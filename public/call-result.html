<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Результат звонка</title>

    <script src="https://api.bitrix24.com/api/v1/"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7f8;
            color: #333;
        }

        .card {
            background: #fff;

            border-radius: 10px;

            padding: 18px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, .07);
        }

        .title {
            margin: 0 0 6px;

            font-size: 20px;
            font-weight: 600;
        }

        .subtitle {
            margin-bottom: 16px;

            color: #7a7a7a;
            font-size: 13px;
        }

        .info {
            margin-bottom: 10px;

            padding: 10px 12px;

            background: #f6f8f9;

            border-radius: 6px;

            color: #555;
            font-size: 13px;
            line-height: 1.4;
        }

        .info.ok {
            background: #e7f7ec;
            color: #24743a;
        }

        .call-status {
            margin-bottom: 16px;

            padding: 10px 12px;

            border-radius: 6px;

            background: #eef6fb;

            font-size: 13px;
        }

        .call-status.finished {
            background: #fff7e6;
        }

        .deal-actions {
            display: flex;

            margin-bottom: 16px;

            gap: 10px;
        }

        .deal-actions.visible {
            display: flex;
        }

        .deal-actions button {
            flex: 1;

            margin-top: 0;
        }

        .button-secondary {
            background: #eef2f4;
            color: #333;
        }

        .button-secondary:hover {
            background: #e1e6e9;
        }

        .form-wrap {
            display: block;
        }

        .form-wrap.visible {
            display: block;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;
        }

        .required {
            color: #d93025;
        }

        select,
        textarea {
            width: 100%;

            padding: 11px 12px;

            border: 1px solid #c6cdd3;
            border-radius: 6px;

            background: #fff;

            font-size: 15px;

            outline: none;
        }

        select:focus,
        textarea:focus {
            border-color: #2fc6f6;
        }

        textarea {
            min-height: 86px;
            margin-top: 0;
            resize: vertical;
            font-family: inherit;
        }

        .comment-group {
            margin-top: 16px;
        }

        button {
            width: 100%;

            margin-top: 16px;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2fc6f6;
            color: #fff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #22b9e8;
        }

        button:disabled {
            opacity: .6;
            cursor: default;
        }

        .message {
            display: none;

            margin-top: 14px;

            padding: 10px 12px;

            border-radius: 6px;

            font-size: 13px;
            line-height: 1.4;
        }

        .message.error {
            display: block;

            background: #fdeaea;
            color: #b93030;
        }

        .message.success {
            display: block;

            background: #e7f7ec;
            color: #24743a;
        }
    </style>
</head>

<body>

<div class="card">

    <h1 class="title">
        Результат звонка
    </h1>

    <div class="subtitle">
        После завершения звонка выберите результат — он сохранится автоматически.
    </div>


    <div
        class="info"
        id="dealInfo"
    >
        Ожидаем данные текущего звонка...
    </div>


    <div
        class="deal-actions"
        id="dealActions"
    >

        <button
            type="button"
            id="createDealButton"
            onclick="createDealManually()"
            disabled
        >
            Ожидаем данные звонка...
        </button>


        <button
            type="button"
            id="openDealButton"
            class="button-secondary"
            onclick="openDeal()"
            style="display:none;"
        >
            Открыть сделку
        </button>

    </div>


    <div
        class="info"
        id="bindingInfo"
    >
        Привязка звонка будет проверена после получения данных.
    </div>


    <div
        class="call-status"
        id="callStatus"
    >
        Виджет загружен. Ожидаем данные звонка от Bitrix24...
    </div>


    <div
        class="form-wrap"
        id="formWrap"
    >

        <label for="callResult">
            Результат звонка
            <span class="required">*</span>
        </label>

        <select
            id="callResult"
            onchange="saveCallResult()"
            disabled
        >
            <option value="">
                Загружаем варианты результата...
            </option>
        </select>


        <!--
            Кнопка оставлена скрытой только для совместимости
            с внутренними функциями setLoading/updateSaveAvailability.
            Результат сохраняется автоматически при выборе.
        -->
        <button
            type="button"
            id="saveButton"
            style="display:none;"
            disabled
        >
            Сохранить результат
        </button>

    </div>


    <div
        class="message"
        id="message"
    ></div>

</div>


<script>

/*
 * =========================================================
 * НАСТРОЙКИ
 * =========================================================
 */

const CALL_RESULT_FIELD_TITLE =
    'Результат звонка';


const DEAL_ORIGINATOR_ID =
    'CALL_RESULT_APP';


let DEAL_CATEGORY_ID =
    0;


function getDealStageEntityId() {

    return DEAL_CATEGORY_ID > 0
        ? 'DEAL_STAGE_' + DEAL_CATEGORY_ID
        : 'DEAL_STAGE';
}


/*
 * =========================================================
 * СОСТОЯНИЕ
 * =========================================================
 */

let callStatusData = {};

let callId = '';

let phoneNumber = '';

let currentCallState = '';

let crmActivityId = 0;

let dealId = 0;

let dealCreationInProgress = false;

let activityBindingInProgress = false;

let resultSaved = false;

let resultModeEnabled = false;

let callResultFieldCode = '';

let callResultFieldId = 0;

let keepAliveTimer = null;

let activityRetryTimer = null;

let activityRetryCount = 0;

let statusPollTimer = null;

let statusPollAttempts = 0;

let statusRequestInProgress = false;

let existingDealLookupInProgress = false;

let existingDealLookupDoneForCallId = '';

let resultOptionsLoaded = false;

let allowAutoClose = false;


/*
 * =========================================================
 * ИНИЦИАЛИЗАЦИЯ
 * =========================================================
 */

BX24.init(function () {

    try {

        BX24.resizeWindow(
            560,
            690
        );

    } catch (e) {

        console.warn(
            'resizeWindow недоступен:',
            e
        );
    }


    /*
     * Блокируем автозакрытие СРАЗУ при открытии CALL_CARD.
     * Иначе Bitrix24 успевает закрыть форму в момент,
     * когда пользователь кладёт трубку.
     */
    startAutoCloseGuard();


    /*
     * Варианты результата загружаем сразу.
     * Форма видна даже до появления CALL_ID.
     */

    loadCallResultField();


    /*
     * Сразу показываем кнопку создания сделки.
     * Пока CALL_ID не пришёл, она будет disabled.
     */

    syncCreateDealButtonState();


    /*
     * Не даём ошибке одного bindEvent
     * сломать весь виджет.
     */

    try {

        BX24.placement.bindEvent(
            'CallCard::EntityChanged',

            function (eventData) {

                console.log(
                    'CallCard::EntityChanged',
                    eventData
                );

                refreshCallStatus();
            }
        );

    } catch (e) {

        console.warn(
            'CallCard::EntityChanged bind error:',
            e
        );
    }


    try {

        BX24.placement.bindEvent(
            'CallCard::CallStateChanged',

            function (
                callState,
                additionalParams
            ) {

                console.log(
                    'CallCard::CallStateChanged',
                    callState,
                    additionalParams
                );


                currentCallState =
                    String(
                        callState || ''
                    );


                handleCallState(
                    currentCallState
                );


                setTimeout(
                    refreshCallStatus,
                    250
                );
            }
        );

    } catch (e) {

        console.warn(
            'CallCard::CallStateChanged bind error:',
            e
        );
    }


    try {

        BX24.placement.bindEvent(
            'CallCard::BeforeClose',

            function () {

                if (!allowAutoClose) {

                    startAutoCloseGuard();

                    showError(
                        'Сначала завершите обработку звонка и выберите результат.'
                    );
                }
            }
        );

    } catch (e) {

        console.warn(
            'CallCard::BeforeClose bind error:',
            e
        );
    }


    /*
     * getStatus не всегда готов в первый момент.
     * Поэтому не ждём события, а сами опрашиваем
     * карточку звонка.
     */

    refreshCallStatus();

    startStatusPolling();

});


/*
 * =========================================================
 * ПОЛУЧАЕМ ПОЛНЫЙ СТАТУС CALL_CARD
 * =========================================================
 */

function refreshCallStatus() {

    if (
        statusRequestInProgress
    ) {
        return;
    }


    statusRequestInProgress =
        true;


    try {

        BX24.placement.call(
            'getStatus',
            {},

            function (status) {

                statusRequestInProgress =
                    false;


                if (!status) {

                    syncCreateDealButtonState();

                    return;
                }


                console.log(
                    'CALL_CARD getStatus',
                    status
                );


                applyCallStatus(
                    status
                );
            }
        );

    } catch (e) {

        statusRequestInProgress =
            false;


        console.warn(
            'CALL_CARD getStatus error:',
            e
        );


        document.getElementById(
            'callStatus'
        ).textContent =
            'Виджет открыт. Ожидаем контекст звонка от Bitrix24...';


        syncCreateDealButtonState();
    }
}


/*
 * =========================================================
 * ПЕРИОДИЧЕСКИ ОПРАШИВАЕМ CALL_CARD
 * =========================================================
 */

function startStatusPolling() {

    if (
        statusPollTimer
    ) {
        return;
    }


    statusPollTimer =
        setInterval(
            function () {

                statusPollAttempts++;


                refreshCallStatus();


                /*
                 * Первые ~20 секунд опрашиваем часто.
                 * Потом оставляем более спокойный режим.
                 */

                if (
                    statusPollAttempts === 40
                ) {

                    clearInterval(
                        statusPollTimer
                    );


                    statusPollTimer =
                        setInterval(
                            refreshCallStatus,
                            2000
                        );
                }

            },
            500
        );
}


/*
 * =========================================================
 * СОСТОЯНИЕ КНОПКИ СОЗДАНИЯ СДЕЛКИ
 * =========================================================
 */

function syncCreateDealButtonState() {

    var button =
        document.getElementById(
            'createDealButton'
        );


    if (!button) {
        return;
    }


    if (dealId) {

        button.disabled =
            false;

        button.style.display =
            'none';

        return;
    }


    button.style.display =
        'block';


    if (
        existingDealLookupInProgress
    ) {

        button.disabled =
            true;

        button.textContent =
            'Ищем существующую сделку...';

    } else if (
        callId
        &&
        !dealCreationInProgress
    ) {

        button.disabled =
            false;

        button.textContent =
            '+ Создать сделку';

    } else if (
        dealCreationInProgress
    ) {

        button.disabled =
            true;

        button.textContent =
            'Создаём сделку...';

    } else {

        button.disabled =
            true;

        button.textContent =
            'Ожидаем данные звонка...';
    }
}


/*
 * =========================================================
 * СБРАСЫВАЕМ СОСТОЯНИЕ ПРИ НОВОМ ЗВОНКЕ
 * =========================================================
 */

function resetCallSessionForNewCall(
    newCallId,
    newPhoneNumber
) {

    console.log(
        'Новый звонок. Сбрасываем состояние CALL_CARD:',
        callId,
        '->',
        newCallId
    );


    /*
     * Если следующий звонок идёт тому же клиенту/номеру,
     * сохраняем уже известный dealId.
     * Иначе CALL_CARD после первого звонка терял привязку
     * и снова показывал «+ Создать сделку».
     */

    const oldPhoneDigits =
        String(phoneNumber || '')
            .replace(/\D/g, '');

    const newPhoneDigits =
        String(newPhoneNumber || '')
            .replace(/\D/g, '');

    const preservedDealId =
        (
            dealId > 0
            &&
            oldPhoneDigits.length >= 10
            &&
            newPhoneDigits.length >= 10
            &&
            oldPhoneDigits === newPhoneDigits
        )
        ?
        dealId
        :
        0;


    resultSaved =
        false;

    resultModeEnabled =
        false;

    allowAutoClose =
        false;

    existingDealLookupInProgress =
        false;

    existingDealLookupDoneForCallId =
        '';

    dealCreationInProgress =
        false;

    activityBindingInProgress =
        false;

    crmActivityId =
        0;

    dealId =
        preservedDealId;

    activityRetryCount =
        0;


    if (activityRetryTimer) {

        clearTimeout(
            activityRetryTimer
        );

        activityRetryTimer =
            null;
    }


    if (keepAliveTimer) {

        clearInterval(
            keepAliveTimer
        );

        keepAliveTimer =
            null;
    }


    /*
     * Новый CALL_ID = новый жизненный цикл звонка.
     * Сразу снова блокируем автозакрытие.
     */
    startAutoCloseGuard();


    const select =
        document.getElementById(
            'callResult'
        );


    if (select) {

        select.value =
            '';

        resultOptionsLoaded =
            (
                callResultFieldCode
                &&
                select.options.length > 1
            );
    }


    const comment =
        document.getElementById(
            'callComment'
        );


    if (comment) {

        comment.value =
            '';
    }


    const saveButton =
        document.getElementById(
            'saveButton'
        );


    if (saveButton) {

        saveButton.disabled =
            true;

        saveButton.textContent =
            'Сохранить результат';
    }


    const message =
        document.getElementById(
            'message'
        );


    if (message) {

        message.className =
            'message';

        message.textContent =
            '';
    }


    const openDealButton =
        document.getElementById(
            'openDealButton'
        );


    if (openDealButton) {

        openDealButton.style.display =
            'none';
    }


    const dealInfo =
        document.getElementById(
            'dealInfo'
        );


    if (dealInfo) {

        if (dealId > 0) {

            dealInfo.className =
                'info ok';

            dealInfo.textContent =
                'Повторный звонок. Используем связанную сделку #' +
                dealId +
                '.';

        } else {

            dealInfo.className =
                'info';

            dealInfo.textContent =
                'Новый звонок. Определяем связанную сделку...';
        }
    }


    const bindingInfo =
        document.getElementById(
            'bindingInfo'
        );


    if (bindingInfo) {

        bindingInfo.className =
            'info';

        bindingInfo.textContent =
            'Проверяем привязку нового звонка...';
    }


    syncResultSelectState();
}


/*
 * =========================================================
 * ОБРАБАТЫВАЕМ СТАТУС
 * =========================================================
 */

function applyCallStatus(
    status
) {

    const newCallId =
        String(
            status.CALL_ID || ''
        );


    const newPhoneNumber =
        String(
            status.PHONE_NUMBER || ''
        );


    /*
     * CALL_CARD может не перезагружаться между звонками.
     * Поэтому при смене CALL_ID обязательно сбрасываем
     * resultSaved и состояние предыдущего звонка.
     */

    if (
        newCallId
        &&
        callId
        &&
        newCallId !== callId
    ) {

        resetCallSessionForNewCall(
            newCallId,
            newPhoneNumber
        );
    }


    callStatusData =
        status || {};


    callId =
        newCallId
        ||
        callId
        ||
        '';


    phoneNumber =
        String(
            status.PHONE_NUMBER || phoneNumber || ''
        );


    currentCallState =
        String(
            status.CALL_STATE || currentCallState || ''
        );


    const nextCrmActivityId =
        normalizePositiveId(
            status.CRM_ACTIVITY_ID
        );

    /*
     * В конце звонка Bitrix24 иногда на мгновение
     * отдаёт CRM_ACTIVITY_ID пустым. Не теряем уже
     * полученный ID стандартного дела.
     */
    if (nextCrmActivityId) {

        crmActivityId =
            nextCrmActivityId;
    }


    syncCreateDealButtonState();


    /*
     * Если у звонка уже есть сделка —
     * используем его.
     *
     * Если сделки нет — НЕ создаём автоматически.
     * Показываем менеджеру кнопку "+ Создать сделку".
     */

    const existingDealId =
        findDealIdInStatus(
            status
        );


    if (existingDealId) {

        setDeal(
            existingDealId,
            false
        );

        existingDealLookupDoneForCallId =
            callId;

    } else if (!dealId) {

        /*
         * Для повторного звонка CALL_ID уже другой,
         * поэтому искать сделка по CALL_ID нельзя.
         * Ищем активную сделку по номеру телефона.
         */
        resolveExistingDealForCurrentCall();
    }


    /*
     * Если сделка уже известна —
     * пытаемся привязать к нему
     * CRM-дело звонка.
     */

    if (dealId) {

        ensureCallActivityBinding();
    }


    handleCallState(
        currentCallState
    );
}


/*
 * =========================================================
 * ИЩЕМ СДЕЛКУ СРЕДИ ПРИВЯЗОК ЗВОНКА
 * =========================================================
 */

function findDealIdInStatus(
    status
) {

    const mainType =
        String(
            status.CRM_ENTITY_TYPE || ''
        ).toUpperCase();


    const mainId =
        normalizePositiveId(
            status.CRM_ENTITY_ID
        );


    if (
        mainType === 'DEAL'
        &&
        mainId
    ) {

        return mainId;
    }


    const bindings =
        Array.isArray(
            status.CRM_BINDINGS
        )
        ?
        status.CRM_BINDINGS
        :
        [];


    const dealBinding =
        bindings.find(
            function (binding) {

                return (
                    String(
                        binding.ENTITY_TYPE || ''
                    ).toUpperCase()
                    ===
                    'DEAL'
                    &&
                    normalizePositiveId(
                        binding.ENTITY_ID
                    ) > 0
                );
            }
        );


    return dealBinding
        ?
        normalizePositiveId(
            dealBinding.ENTITY_ID
        )
        :
        0;
}



/*
 * =========================================================
 * ИЩЕМ СУЩЕСТВУЮЩУЮ АКТИВНУЮ СДЕЛКУ ПО ТЕЛЕФОНУ
 * =========================================================
 */

function resolveExistingDealForCurrentCall() {

    if (
        dealId
        ||
        existingDealLookupInProgress
        ||
        !callId
    ) {
        return;
    }


    if (
        existingDealLookupDoneForCallId ===
        callId
    ) {

        showCreateDealButton();
        return;
    }


    if (!isUsablePhone(phoneNumber)) {

        showCreateDealButton();
        return;
    }


    existingDealLookupInProgress =
        true;

    syncCreateDealButtonState();

    document.getElementById(
        'dealInfo'
    ).textContent =
        'Ищем существующую сделку по номеру телефона...';


    findExistingActiveDealByPhone(
        phoneNumber,

        function (
            foundDealId
        ) {

            existingDealLookupInProgress =
                false;

            existingDealLookupDoneForCallId =
                callId;


            if (foundDealId) {

                setDeal(
                    foundDealId,
                    false
                );

                ensureCallActivityBinding();

                return;
            }


            showCreateDealButton();
        }
    );
}


function findExistingActiveDealByPhone(
    phone,
    callback
) {

    const normalizedPhone =
        String(
            phone || ''
        ).trim();


    if (
        !isUsablePhone(
            normalizedPhone
        )
    ) {

        callback(0);
        return;
    }


    let finished =
        false;


    const finish =
        function (
            id
        ) {

            if (
                finished
            ) {
                return;
            }

            finished =
                true;

            callback(
                normalizePositiveId(
                    id
                )
            );
        };


    const findDealByFilter =
        function (
            filter,
            next
        ) {

            BX24.callMethod(

                'crm.deal.list',

                {
                    order: {
                        ID:
                            'DESC'
                    },

                    filter:
                        filter,

                    select: [
                        'ID',
                        'TITLE',
                        'STAGE_SEMANTIC_ID'
                    ]
                },

                function (
                    result
                ) {

                    if (
                        result.error()
                    ) {

                        console.warn(
                            'Не удалось найти сделку:',
                            result.error(),
                            result.error_description()
                        );

                        next();
                        return;
                    }


                    const deals =
                        Array.isArray(
                            result.data()
                        )
                        ?
                        result.data()
                        :
                        [];


                    const active =
                        deals.find(
                            function (
                                deal
                            ) {

                                const semantic =
                                    String(
                                        deal.STAGE_SEMANTIC_ID
                                        ||
                                        ''
                                    )
                                    .toUpperCase();


                                return (
                                    !semantic
                                    ||
                                    semantic === 'P'
                                );
                            }
                        );


                    if (
                        active
                        &&
                        active.ID
                    ) {

                        finish(
                            active.ID
                        );

                        return;
                    }


                    next();
                }
            );
        };


    const findByCompanies =
        function () {

            BX24.callMethod(

                'crm.duplicate.findbycomm',

                {
                    entity_type:
                        'COMPANY',

                    type:
                        'PHONE',

                    values: [
                        normalizedPhone
                    ]
                },

                function (
                    companyResult
                ) {

                    if (
                        companyResult.error()
                    ) {

                        finish(0);
                        return;
                    }


                    const data =
                        companyResult.data()
                        ||
                        {};


                    const companyIds =
                        (
                            Array.isArray(
                                data.COMPANY
                            )
                            ?
                            data.COMPANY
                            :
                            []
                        )
                        .map(
                            normalizePositiveId
                        )
                        .filter(
                            Boolean
                        );


                    const tryCompany =
                        function (
                            index
                        ) {

                            if (
                                finished
                            ) {
                                return;
                            }


                            if (
                                index >=
                                companyIds.length
                            ) {

                                finish(0);
                                return;
                            }


                            findDealByFilter(
                                {
                                    COMPANY_ID:
                                        companyIds[index]
                                },

                                function () {

                                    tryCompany(
                                        index + 1
                                    );
                                }
                            );
                        };


                    tryCompany(0);
                }
            );
        };


    BX24.callMethod(

        'crm.duplicate.findbycomm',

        {
            entity_type:
                'CONTACT',

            type:
                'PHONE',

            values: [
                normalizedPhone
            ]
        },

        function (
            contactResult
        ) {

            if (
                contactResult.error()
            ) {

                findByCompanies();
                return;
            }


            const data =
                contactResult.data()
                ||
                {};


            const contactIds =
                (
                    Array.isArray(
                        data.CONTACT
                    )
                    ?
                    data.CONTACT
                    :
                    []
                )
                .map(
                    normalizePositiveId
                )
                .filter(
                    Boolean
                );


            const tryContact =
                function (
                    index
                ) {

                    if (
                        finished
                    ) {
                        return;
                    }


                    if (
                        index >=
                        contactIds.length
                    ) {

                        findByCompanies();
                        return;
                    }


                    findDealByFilter(
                        {
                            CONTACT_ID:
                                contactIds[index]
                        },

                        function () {

                            tryContact(
                                index + 1
                            );
                        }
                    );
                };


            tryContact(0);
        }
    );
}


function findFirstActiveDealFromIds(
    ids,
    index,
    callback
) {

    if (
        index >=
        ids.length
    ) {

        callback(0);
        return;
    }


    const id =
        normalizePositiveId(
            ids[index]
        );


    if (!id) {

        findFirstActiveDealFromIds(
            ids,
            index + 1,
            callback
        );

        return;
    }


    BX24.callMethod(

        'crm.deal.get',

        {
            id:
                id
        },

        function (
            result
        ) {

            if (
                !result.error()
            ) {

                const deal =
                    result.data()
                    ||
                    {};


                const semantic =
                    String(
                        deal.STAGE_SEMANTIC_ID
                        ||
                        ''
                    )
                    .toUpperCase();


                if (
                    !semantic
                    ||
                    semantic === 'P'
                ) {

                    callback(id);
                    return;
                }
            }


            findFirstActiveDealFromIds(
                ids,
                index + 1,
                callback
            );
        }
    );
}

function ensureDealForCall(
    status
) {

    if (
        dealId
        ||
        dealCreationInProgress
    ) {
        return;
    }


    /*
     * CALL_ID используется как уникальный
     * внешний идентификатор.
     *
     * Благодаря этому повторная загрузка
     * виджета не создаст вторую сделку
     * для того же звонка.
     */

    if (!callId) {

        document.getElementById(
            'dealInfo'
        ).textContent =
            'Ожидаем идентификатор звонка для создания сделки...';


        const button =
            document.getElementById(
                'createDealButton'
            );


        button.disabled =
            false;

        button.textContent =
            '+ Создать сделку';


        return;
    }


dealCreationInProgress =
    true;

document.getElementById(
    'dealInfo'
).textContent =
    'Шаг 1/4: проверяем существующую сделку...';

    const originId =
        buildOriginId(
            callId
        );


    /*
     * Сначала ищем нашу сделку по CALL_ID.
     */

    BX24.callMethod(
        'crm.deal.list',

        {
            order: {
                ID:
                    'DESC'
            },

            filter: {

                ORIGINATOR_ID:
                    DEAL_ORIGINATOR_ID,

                ORIGIN_ID:
                    originId
            },

            select: [
                'ID',
                'TITLE'
            ]
        },

        function (result) {

            if (result.error()) {

                console.warn(
                    'Не удалось проверить существующую сделку:',
                    result.error(),
                    result.error_description()
                );

document.getElementById(
    'dealInfo'
).textContent =
    'Шаг 2/4: определяем клиента и ответственного...';
                /*
                 * Даже если поиск не сработал,
                 * продолжаем создание.
                 */

                resolveDealContext(
                    status,
                    function (context) {
                        ensureClientContextByPhone(
                            context,
                            createDealFromContext
                        );
                    }
                );

                return;
            }


            const deals =
                result.data() || [];


            if (
                deals.length > 0
            ) {

                const foundId =
                    normalizePositiveId(
                        deals[0].ID
                    );


                dealCreationInProgress =
                    false;


                setDeal(
                    foundId,
                    true
                );


                showDealCreatedActions();


                ensureCallActivityBinding();

                return;
            }

document.getElementById(
    'dealInfo'
).textContent =
    'Шаг 2/4: определяем клиента и ответственного...';
            /*
             * Сделки для этого CALL_ID ещё нет.
             * Получаем ответственного и
             * существующего клиента.
             */

            resolveDealContext(
                status,
                function (context) {
                    ensureClientContextByPhone(
                        context,
                        createDealFromContext
                    );
                }
            );
        }
    );
}


/*
 * =========================================================
 * СОБИРАЕМ КОНТЕКСТ ИЗ КОМПАНИИ / КОНТАКТА / СДЕЛКИ
 * =========================================================
 */

function resolveDealContext(
    status,
    callback
) {

    const context = {

        assignedById:
            0,

        contactId:
            0,

        companyId:
            0,

        clientTitle:
            ''
    };


    const mainType =
        String(
            status.CRM_ENTITY_TYPE || ''
        ).toUpperCase();


    const mainId =
        normalizePositiveId(
            status.CRM_ENTITY_ID
        );


    const bindings =
        Array.isArray(
            status.CRM_BINDINGS
        )
        ?
        status.CRM_BINDINGS
        :
        [];


    /*
     * Забираем CONTACT / COMPANY
     * из всех привязок.
     */

    bindings.forEach(
        function (binding) {

            const type =
                String(
                    binding.ENTITY_TYPE || ''
                ).toUpperCase();


            const id =
                normalizePositiveId(
                    binding.ENTITY_ID
                );


            if (
                type === 'CONTACT'
                &&
                id
                &&
                !context.contactId
            ) {

                context.contactId =
                    id;
            }


            if (
                type === 'COMPANY'
                &&
                id
                &&
                !context.companyId
            ) {

                context.companyId =
                    id;
            }
        }
    );


    /*
     * Основная сущность тоже учитывается.
     */

    if (
        mainType === 'CONTACT'
        &&
        mainId
    ) {

        context.contactId =
            mainId;
    }


    if (
        mainType === 'COMPANY'
        &&
        mainId
    ) {

        context.companyId =
            mainId;
    }


    /*
     * Если звонок связан со сделкой,
     * из неё удобно взять ответственного,
     * контакт и компанию.
     */

    if (
        mainType === 'DEAL'
        &&
        mainId
    ) {

        BX24.callMethod(
            'crm.deal.get',

            {
                id:
                    mainId
            },

            function (result) {

                if (!result.error()) {

                    const deal =
                        result.data() || {};


                    context.assignedById =
                        normalizePositiveId(
                            deal.ASSIGNED_BY_ID
                        );


                    context.contactId =
                        normalizePositiveId(
                            deal.CONTACT_ID
                        )
                        ||
                        context.contactId;


                    context.companyId =
                        normalizePositiveId(
                            deal.COMPANY_ID
                        )
                        ||
                        context.companyId;


                    context.clientTitle =
                        String(
                            deal.TITLE || ''
                        ).trim();
                }


                finishResolveClientContext(
                    context,
                    callback
                );
            }
        );

        return;
    }


    /*
     * Если основная сущность — контакт.
     */

    if (
        mainType === 'CONTACT'
        &&
        mainId
    ) {

        BX24.callMethod(
            'crm.contact.get',

            {
                id:
                    mainId
            },

            function (result) {

                if (!result.error()) {

                    const contact =
                        result.data() || {};


                    context.assignedById =
                        normalizePositiveId(
                            contact.ASSIGNED_BY_ID
                        );


                    context.companyId =
                        normalizePositiveId(
                            contact.COMPANY_ID
                        )
                        ||
                        context.companyId;


                    context.clientTitle =
                        [
                            contact.NAME,
                            contact.SECOND_NAME,
                            contact.LAST_NAME
                        ]
                        .filter(Boolean)
                        .join(' ')
                        .trim();
                }


                finishResolveClientContext(
                    context,
                    callback
                );
            }
        );

        return;
    }


    /*
     * Если основная сущность — компания.
     */

    if (
        mainType === 'COMPANY'
        &&
        mainId
    ) {

        BX24.callMethod(
            'crm.company.get',

            {
                id:
                    mainId
            },

            function (result) {

                if (!result.error()) {

                    const company =
                        result.data() || {};


                    context.assignedById =
                        normalizePositiveId(
                            company.ASSIGNED_BY_ID
                        );


                    context.clientTitle =
                        String(
                            company.TITLE || ''
                        ).trim();
                }


                finishResolveClientContext(
                    context,
                    callback
                );
            }
        );

        return;
    }


    /*
     * Основной сущности нет либо она другая,
     * но в CRM_BINDINGS могла быть компания
     * или контакт.
     */

    finishResolveClientContext(
        context,
        callback
    );
}


/*
 * =========================================================
 * ЕСЛИ ОТВЕТСТВЕННЫЙ ЕЩЁ НЕ НАЙДЕН,
 * БЕРЁМ ЕГО ИЗ КОНТАКТА/КОМПАНИИ
 * =========================================================
 */

function finishResolveClientContext(
    context,
    callback
) {

    if (
        context.assignedById
    ) {

        callback(
            context
        );

        return;
    }


    if (
        context.contactId
    ) {

        BX24.callMethod(
            'crm.contact.get',

            {
                id:
                    context.contactId
            },

            function (result) {

                if (!result.error()) {

                    const contact =
                        result.data() || {};


                    context.assignedById =
                        normalizePositiveId(
                            contact.ASSIGNED_BY_ID
                        );


                    context.companyId =
                        normalizePositiveId(
                            contact.COMPANY_ID
                        )
                        ||
                        context.companyId;


                    if (
                        !context.clientTitle
                    ) {

                        context.clientTitle =
                            [
                                contact.NAME,
                                contact.SECOND_NAME,
                                contact.LAST_NAME
                            ]
                            .filter(Boolean)
                            .join(' ')
                            .trim();
                    }
                }


                if (
                    context.assignedById
                    ||
                    !context.companyId
                ) {

                    callback(
                        context
                    );

                    return;
                }


                resolveContextFromCompany(
                    context,
                    callback
                );
            }
        );

        return;
    }


    if (
        context.companyId
    ) {

        resolveContextFromCompany(
            context,
            callback
        );

        return;
    }


    /*
     * ASSIGNED_BY_ID можно не передавать:
     * Битрикс назначит значение по своим
     * стандартным правилам/текущему пользователю.
     */

    callback(
        context
    );
}


function resolveContextFromCompany(
    context,
    callback
) {

    BX24.callMethod(
        'crm.company.get',

        {
            id:
                context.companyId
        },

        function (result) {

            if (!result.error()) {

                const company =
                    result.data() || {};


                context.assignedById =
                    normalizePositiveId(
                        company.ASSIGNED_BY_ID
                    );


                if (
                    !context.clientTitle
                ) {

                    context.clientTitle =
                        String(
                            company.TITLE || ''
                        ).trim();
                }
            }


            callback(
                context
            );
        }
    );
}


/*
 * =========================================================
 * НАДЁЖНО ОПРЕДЕЛЯЕМ КЛИЕНТА ПО ТЕЛЕФОНУ
 * =========================================================
 */

function ensureClientContextByPhone(
    context,
    callback
) {

    if (!isUsablePhone(phoneNumber)) {
        callback(context);
        return;
    }

    BX24.callMethod(
        'crm.duplicate.findbycomm',
        {
            entity_type: 'CONTACT',
            type: 'PHONE',
            values: [phoneNumber]
        },
        function (contactResult) {

            if (!contactResult.error()) {
                const data = contactResult.data() || {};
                const ids = Array.isArray(data.CONTACT)
                    ? data.CONTACT
                    : [];

                if (ids.length > 0) {
                    context.contactId = Number(ids[0]);
                }
            }

            if (context.contactId) {
                BX24.callMethod(
                    'crm.contact.get',
                    { id: context.contactId },
                    function (result) {

                        if (!result.error()) {
                            const contact = result.data() || {};

                            context.assignedById = Number(
                                contact.ASSIGNED_BY_ID
                                || context.assignedById
                                || 0
                            );

                            context.companyId = Number(
                                contact.COMPANY_ID
                                || context.companyId
                                || 0
                            );

                            const contactName = [
                                contact.NAME,
                                contact.SECOND_NAME,
                                contact.LAST_NAME
                            ].filter(Boolean).join(' ').trim();

                            if (contactName) {
                                context.clientTitle = contactName;
                            }
                        }

                        callback(context);
                    }
                );

                return;
            }

            BX24.callMethod(
                'crm.duplicate.findbycomm',
                {
                    entity_type: 'COMPANY',
                    type: 'PHONE',
                    values: [phoneNumber]
                },
                function (companyResult) {

                    if (!companyResult.error()) {
                        const data = companyResult.data() || {};
                        const ids = Array.isArray(data.COMPANY)
                            ? data.COMPANY
                            : [];

                        if (ids.length > 0) {
                            context.companyId = Number(ids[0]);
                        }
                    }

                    if (context.companyId) {
                        BX24.callMethod(
                            'crm.company.get',
                            { id: context.companyId },
                            function (result) {

                                if (!result.error()) {
                                    const company = result.data() || {};

                                    context.assignedById = Number(
                                        company.ASSIGNED_BY_ID
                                        || context.assignedById
                                        || 0
                                    );

                                    if (company.TITLE) {
                                        context.clientTitle = String(company.TITLE);
                                    }
                                }

                                callback(context);
                            }
                        );

                        return;
                    }

                    createContactForCall(
                        context,
                        callback
                    );
                }
            );
        }
    );
}


function createContactForCall(
    context,
    callback
) {

    const contactName =
        String(context.clientTitle || '').trim()
        || ('Клиент ' + phoneNumber);

    const fields = {
        NAME: contactName,
        OPENED: 'Y',
        PHONE: [
            {
                VALUE: phoneNumber,
                VALUE_TYPE: 'WORK'
            }
        ]
    };

    if (context.assignedById) {
        fields.ASSIGNED_BY_ID =
            Number(context.assignedById);
    }

    BX24.callMethod(
        'crm.contact.add',
        { fields: fields },
        function (result) {

            if (result.error()) {
                console.warn(
                    'Не удалось создать контакт:',
                    result.error(),
                    result.error_description()
                );

                callback(context);
                return;
            }

            context.contactId =
                Number(result.data());

            context.clientTitle =
                contactName;

            callback(context);
        }
    );
}


/*
 * =========================================================
 * СОЗДАЁМ СДЕЛКУ
 * =========================================================
 */

function getDealStatusIdByName(
    stageName,
    callback
) {

    BX24.callMethod(

        'crm.status.list',

        {
            filter: {
                ENTITY_ID:
                    getDealStageEntityId()
            },

            order: {
                SORT:
                    'ASC'
            }
        },

        function (
            result
        ) {

            if (
                result.error()
            ) {

                console.warn(
                    'Не удалось получить стадии сделок:',
                    result.error(),
                    result.error_description()
                );

                callback('');
                return;
            }


            const statuses =
                result.data()
                ||
                [];


            const target =
                statuses.find(
                    function (
                        status
                    ) {

                        return (
                            normalizeText(
                                status.NAME
                            )
                            ===
                            normalizeText(
                                stageName
                            )
                        );
                    }
                );


            if (
                !target
            ) {

                console.warn(
                    'Не найдена стадия:',
                    stageName
                );

                callback('');
                return;
            }


            callback(
                String(
                    target.STATUS_ID
                    ||
                    ''
                )
            );
        }
    );
}


/*
 * =========================================================
 * СОЗДАЁМ СДЕЛКУ
 * =========================================================
 */

function createDealFromContext(
    context
)
{

    document
        .getElementById(
            'dealInfo'
        )
        .textContent =
        'Шаг 3/4: определяем стадию «Новый»...';


    if (
        dealId
    ) {

        dealCreationInProgress =
            false;

        return;
    }


    getDealStatusIdByName(
        'Новый',

        function (
            realNewStageId
        ) {

            if (
                !realNewStageId
            ) {

                dealCreationInProgress =
                    false;


                showError(
                    'Не удалось найти стадию «Новый».'
                );


                const button =
                    document
                        .getElementById(
                            'createDealButton'
                        );


                button.disabled =
                    false;

                button.textContent =
                    '+ Создать сделку';


                return;
            }


            console.log(
                'Реальный STAGE_ID стадии "Новый":',
                realNewStageId
            );


            const fields = {

                TITLE:
                    buildDealTitle(
                        context
                    ),

                CATEGORY_ID:
                    DEAL_CATEGORY_ID,

                STAGE_ID:
                    realNewStageId,

                SOURCE_ID:
                    'CALL',

                OPENED:
                    'Y',

                ORIGINATOR_ID:
                    DEAL_ORIGINATOR_ID,

                ORIGIN_ID:
                    buildOriginId(
                        callId
                    )
            };


            if (
                context.assignedById
            ) {

                fields.ASSIGNED_BY_ID =
                    context.assignedById;
            }


            if (
                context.contactId
            ) {

                fields.CONTACT_ID =
                    Number(
                        context.contactId
                    );
            }


            if (
                context.companyId
            ) {

                fields.COMPANY_ID =
                    Number(
                        context.companyId
                    );
            }


            document
                .getElementById(
                    'dealInfo'
                )
                .textContent =
                'Шаг 4/4: создаём сделку в CRM...';


            BX24.callMethod(

                'crm.deal.add',

                {
                    fields:
                        fields,

                    params: {

                        REGISTER_SONET_EVENT:
                            'Y'
                    }
                },

                function (
                    result
                ) {

                    dealCreationInProgress =
                        false;


                    if (
                        result.error()
                    ) {

                        showError(
                            'Не удалось создать сделку: '
                            +
                            result.error_description()
                        );


                        document
                            .getElementById(
                                'dealInfo'
                            )
                            .textContent =
                            'Сделка не создана.';


                        const button =
                            document
                                .getElementById(
                                    'createDealButton'
                                );


                        button.disabled =
                            false;

                        button.textContent =
                            '+ Создать сделку';


                        return;
                    }


                    const newDealId =
                        normalizePositiveId(
                            result.data()
                        );


                    if (
                        !newDealId
                    ) {

                        showError(
                            'Битрикс24 не вернул ID созданной сделки.'
                        );

                        return;
                    }


                    bindClientToDeal(
                        newDealId,
                        context,

                        function () {

                            ensureDealStageNew(
                                newDealId,

                                function () {

                                    setDeal(
                                        newDealId,
                                        true
                                    );


                                    showSuccess(
                                        'Сделка #'
                                        +
                                        newDealId
                                        +
                                        ' создана. Клиент привязан. Стадия: «Новый».'
                                    );


                                    showDealCreatedActions();

                                    ensureCallActivityBinding();
                                }
                            );
                        }
                    );
                }
            );
        }
    );
}


/*
 * =========================================================
 * ЯВНО ПРИВЯЗЫВАЕМ КЛИЕНТА К СДЕЛКЕ
 * =========================================================
 */

function bindClientToDeal(
    newDealId,
    context,
    callback
) {

    const fields =
        {};


    if (
        context.contactId
    ) {

        fields.CONTACT_ID =
            Number(
                context.contactId
            );
    }


    if (
        context.companyId
    ) {

        fields.COMPANY_ID =
            Number(
                context.companyId
            );
    }


    if (
        Object.keys(
            fields
        ).length === 0
    ) {

        callback();
        return;
    }


    BX24.callMethod(

        'crm.deal.update',

        {
            id:
                newDealId,

            fields:
                fields
        },

        function (
            result
        ) {

            if (
                result.error()
            ) {

                console.warn(
                    'Не удалось привязать клиента к сделке:',
                    result.error(),
                    result.error_description()
                );
            }


            callback();
        }
    );
}


/*
 * =========================================================
 * ФИКСИРУЕМ СТАДИЮ "НОВЫЙ"
 * =========================================================
 */

function ensureDealStageNew(
    newDealId,
    callback
) {

    getDealStatusIdByName(
        'Новый',

        function (
            realNewStageId
        ) {

            if (
                !realNewStageId
            ) {

                console.warn(
                    'Не удалось найти реальный STAGE_ID стадии "Новый"'
                );

                callback();
                return;
            }


            BX24.callMethod(

                'crm.deal.get',

                {
                    id:
                        newDealId
                },

                function (
                    getResult
                ) {

                    if (
                        getResult.error()
                    ) {

                        console.warn(
                            'Не удалось проверить стадию сделки:',
                            getResult.error(),
                            getResult.error_description()
                        );

                        callback();
                        return;
                    }


                    const dealData =
                        getResult.data()
                        ||
                        {};


                    const currentStageId =
                        String(
                            dealData.STAGE_ID
                            ||
                            ''
                        );


                    console.log(
                        'Стадия сделки после создания:',
                        currentStageId,
                        'ожидается:',
                        realNewStageId
                    );


                    if (
                        currentStageId ===
                        realNewStageId
                    ) {

                        callback();
                        return;
                    }


                    BX24.callMethod(

                        'crm.deal.update',

                        {
                            id:
                                newDealId,

                            fields: {

                                STAGE_ID:
                                    realNewStageId
                            }
                        },

                        function (
                            updateResult
                        ) {

                            if (
                                updateResult.error()
                            ) {

                                console.warn(
                                    'Не удалось вернуть сделку в "Новый":',
                                    updateResult.error(),
                                    updateResult.error_description()
                                );

                            } else {

                                console.log(
                                    'Сделка возвращена в реальную стадию "Новый":',
                                    realNewStageId
                                );
                            }


                            callback();
                        }
                    );
                }
            );
        }
    );
}


/*
 * =========================================================
 * УСТАНАВЛИВАЕМ ТЕКУЩУЮ СДЕЛКУ
 * =========================================================
 */

function setDeal(
    id,
    createdByApp
) {

    id =
        normalizePositiveId(
            id
        );


    if (!id) {
        return;
    }


    const changed =
        dealId !== id;


    dealId =
        id;


    syncCreateDealButtonState();

    showDealCreatedActions();


    document.getElementById(
        'dealInfo'
    ).className =
        'info ok';


    document.getElementById(
        'dealInfo'
    ).textContent =
        (
            createdByApp
            ?
            'Сделка для звонка: #'
            :
            'Связанная сделка: #'
        )
        +
        dealId;


    if (
        changed
        ||
        !callResultFieldCode
    ) {

        loadDealInfo();

        loadCallResultField();
    }


    syncResultSelectState();

    updateSaveAvailability();
}

/*
 * =========================================================
 * ПРИВЯЗЫВАЕМ CRM-ДЕЛО ЗВОНКА К СДЕЛКЕ
 * =========================================================
 */

function ensureCallActivityBinding() {

    if (
        !dealId
        ||
        activityBindingInProgress
    ) {
        return;
    }


    /*
     * Если статус уже показывает нужную
     * привязку — делать ничего не надо.
     */

    if (
        statusAlreadyContainsDealBinding()
    ) {

        showBindingSuccess();

        return;
    }


    /*
     * CRM_ACTIVITY_ID может появиться
     * не сразу после начала звонка.
     */

    if (!crmActivityId) {

        document.getElementById(
            'bindingInfo'
        ).textContent =
            'Сделка создана. Ожидаем CRM-дело звонка для привязки...';


        scheduleActivityBindingRetry();

        return;
    }


    activityBindingInProgress =
        true;


    document.getElementById(
        'bindingInfo'
    ).textContent =
        'Привязываем звонок к сделке #' +
        dealId +
        '...';


    BX24.callMethod(
        'crm.activity.binding.add',

        {
            activityId:
                crmActivityId,

            /*
             * entityTypeId = 2 — сделка.
             */
            entityTypeId:
                2,

            entityId:
                dealId
        },

        function (result) {

            activityBindingInProgress =
                false;


            if (result.error()) {

                /*
                 * Если связь уже существует,
                 * это для нас успешный результат.
                 */

                if (
                    result.error()
                    ===
                    'ACTIVITY_IS_ALREADY_BOUND'
                ) {

                    showBindingSuccess();

                    return;
                }


                console.warn(
                    'Ошибка привязки звонка:',
                    result.error(),
                    result.error_description()
                );


                document.getElementById(
                    'bindingInfo'
                ).textContent =
                    'Сделка создана, но пока не удалось привязать дело звонка. Повторяем...';


                scheduleActivityBindingRetry();

                return;
            }


            showBindingSuccess();


            /*
             * Перечитываем статус,
             * чтобы получить свежие bindings.
             */

            setTimeout(
                refreshCallStatus,
                300
            );
        }
    );
}


function statusAlreadyContainsDealBinding() {

    const bindings =
        Array.isArray(
            callStatusData.CRM_BINDINGS
        )
        ?
        callStatusData.CRM_BINDINGS
        :
        [];


    return bindings.some(
        function (binding) {

            return (
                String(
                    binding.ENTITY_TYPE || ''
                ).toUpperCase()
                ===
                'DEAL'
                &&
                normalizePositiveId(
                    binding.ENTITY_ID
                )
                ===
                dealId
            );
        }
    );
}


function showBindingSuccess() {

    if (activityRetryTimer) {

        clearTimeout(
            activityRetryTimer
        );

        activityRetryTimer =
            null;
    }


    document.getElementById(
        'bindingInfo'
    ).className =
        'info ok';


    document.getElementById(
        'bindingInfo'
    ).textContent =
        'Звонок привязан к сделке #' +
        dealId +
        '.';
}


/*
 * =========================================================
 * ПОВТОРНАЯ ПОПЫТКА ПОЛУЧИТЬ CRM_ACTIVITY_ID
 * =========================================================
 */

function scheduleActivityBindingRetry() {

    if (
        activityRetryTimer
        ||
        activityRetryCount >= 15
    ) {
        return;
    }


    activityRetryCount++;


    activityRetryTimer =
        setTimeout(
            function () {

                activityRetryTimer =
                    null;


                refreshCallStatus();

            },
            2000
        );
}


/*
 * =========================================================
 * СОСТОЯНИЕ ЗВОНКА
 * =========================================================
 */

function handleCallState(
    callState
) {

    currentCallState =
        String(
            callState || currentCallState || ''
        );

    syncResultSelectState();


    const statusElement =
        document.getElementById(
            'callStatus'
        );


    if (
        callState ===
        'connected'
    ) {

        statusElement.className =
            'call-status';

        statusElement.textContent =
            'Разговор идёт. Сделка уже создаётся или проверяется. После завершения выберите результат.';

        return;
    }


    if (
        callState ===
        'connecting'
    ) {

        statusElement.className =
            'call-status';

        statusElement.textContent =
            'Устанавливается соединение...';

        return;
    }


    if (
        callState ===
        'idle'
    ) {

        statusElement.className =
            'call-status finished';

        statusElement.textContent =
            'Звонок завершён. Выберите результат звонка.';


        enableResultMode();

        return;
    }


    statusElement.className =
        'call-status';

    statusElement.textContent =
        'Ожидаем состояние звонка...';
}
