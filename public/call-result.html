<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Результат звонка</title>

    <script src="https://api.bitrix24.com/api/v1/"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f7f8;
            color: #333;
        }

        .card {
            background: #fff;

            border-radius: 10px;

            padding: 18px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, .07);
        }

        .title {
            margin: 0 0 6px;

            font-size: 20px;
            font-weight: 600;
        }

        .subtitle {
            margin-bottom: 16px;

            color: #7a7a7a;
            font-size: 13px;
        }

        .info {
            margin-bottom: 10px;

            padding: 10px 12px;

            background: #f6f8f9;

            border-radius: 6px;

            color: #555;
            font-size: 13px;
            line-height: 1.4;
        }

        .info.ok {
            background: #e7f7ec;
            color: #24743a;
        }

        .call-status {
            margin-bottom: 16px;

            padding: 10px 12px;

            border-radius: 6px;

            background: #eef6fb;

            font-size: 13px;
        }

        .call-status.finished {
            background: #fff7e6;
        }

        .lead-actions {
            display: flex;

            margin-bottom: 16px;

            gap: 10px;
        }

        .lead-actions.visible {
            display: flex;
        }

        .lead-actions button {
            flex: 1;

            margin-top: 0;
        }

        .button-secondary {
            background: #eef2f4;
            color: #333;
        }

        .button-secondary:hover {
            background: #e1e6e9;
        }

        .form-wrap {
            display: block;
        }

        .form-wrap.visible {
            display: block;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;
        }

        .required {
            color: #d93025;
        }

        select,
        textarea {
            width: 100%;

            padding: 11px 12px;

            border: 1px solid #c6cdd3;
            border-radius: 6px;

            background: #fff;

            font-size: 15px;

            outline: none;
        }

        select:focus,
        textarea:focus {
            border-color: #2fc6f6;
        }

        textarea {
            min-height: 86px;
            margin-top: 0;
            resize: vertical;
            font-family: inherit;
        }

        .comment-group {
            margin-top: 16px;
        }

        button {
            width: 100%;

            margin-top: 16px;

            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2fc6f6;
            color: #fff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #22b9e8;
        }

        button:disabled {
            opacity: .6;
            cursor: default;
        }

        .message {
            display: none;

            margin-top: 14px;

            padding: 10px 12px;

            border-radius: 6px;

            font-size: 13px;
            line-height: 1.4;
        }

        .message.error {
            display: block;

            background: #fdeaea;
            color: #b93030;
        }

        .message.success {
            display: block;

            background: #e7f7ec;
            color: #24743a;
        }
    </style>
</head>

<body>

<div class="card">

    <h1 class="title">
        Результат звонка
    </h1>

    <div class="subtitle">
        После завершения звонка выберите результат — он сохранится автоматически.
    </div>


    <div
        class="info"
        id="leadInfo"
    >
        Ожидаем данные текущего звонка...
    </div>


    <div
        class="lead-actions"
        id="leadActions"
    >

        <button
            type="button"
            id="createLeadButton"
            onclick="createLeadManually()"
            disabled
        >
            Ожидаем данные звонка...
        </button>


        <button
            type="button"
            id="openLeadButton"
            class="button-secondary"
            onclick="openLead()"
            style="display:none;"
        >
            Открыть лид
        </button>

    </div>


    <div
        class="info"
        id="bindingInfo"
    >
        Привязка звонка будет проверена после получения данных.
    </div>


    <div
        class="call-status"
        id="callStatus"
    >
        Виджет загружен. Ожидаем данные звонка от Bitrix24...
    </div>


    <div
        class="form-wrap"
        id="formWrap"
    >

        <label for="callResult">
            Результат звонка
            <span class="required">*</span>
        </label>

        <select
            id="callResult"
            onchange="saveCallResult()"
            disabled
        >
            <option value="">
                Загружаем варианты результата...
            </option>
        </select>


        <!--
            Кнопка оставлена скрытой только для совместимости
            с внутренними функциями setLoading/updateSaveAvailability.
            Результат сохраняется автоматически при выборе.
        -->
        <button
            type="button"
            id="saveButton"
            style="display:none;"
            disabled
        >
            Сохранить результат
        </button>

    </div>


    <div
        class="message"
        id="message"
    ></div>

</div>


<script>

/*
 * =========================================================
 * НАСТРОЙКИ
 * =========================================================
 */

const CALL_RESULT_FIELD_TITLE =
    'Результат звонка';


const LEAD_ORIGINATOR_ID =
    'CALL_RESULT_APP';


/*
 * =========================================================
 * СОСТОЯНИЕ
 * =========================================================
 */

let callStatusData = {};

let callId = '';

let phoneNumber = '';

let currentCallState = '';

let crmActivityId = 0;

let leadId = 0;

let leadCreationInProgress = false;

let activityBindingInProgress = false;

let resultSaved = false;

let resultModeEnabled = false;

let callResultFieldCode = '';

let callResultFieldId = 0;

let keepAliveTimer = null;

let activityRetryTimer = null;

let activityRetryCount = 0;

let statusPollTimer = null;

let statusPollAttempts = 0;

let statusRequestInProgress = false;

let existingLeadLookupInProgress = false;

let existingLeadLookupFinishedCallId = '';


/*
 * =========================================================
 * ИНИЦИАЛИЗАЦИЯ
 * =========================================================
 */

BX24.init(function () {

    try {

        BX24.resizeWindow(
            560,
            690
        );

    } catch (e) {

        console.warn(
            'resizeWindow недоступен:',
            e
        );
    }


    /*
     * Варианты результата загружаем сразу.
     * Форма видна даже до появления CALL_ID.
     */

    loadCallResultField();


    /*
     * Сразу показываем кнопку создания лида.
     * Пока CALL_ID не пришёл, она будет disabled.
     */

    syncCreateLeadButtonState();


    /*
     * Не даём ошибке одного bindEvent
     * сломать весь виджет.
     */

    try {

        BX24.placement.bindEvent(
            'CallCard::EntityChanged',

            function (eventData) {

                console.log(
                    'CallCard::EntityChanged',
                    eventData
                );

                refreshCallStatus();
            }
        );

    } catch (e) {

        console.warn(
            'CallCard::EntityChanged bind error:',
            e
        );
    }


    try {

        BX24.placement.bindEvent(
            'CallCard::CallStateChanged',

            function (
                callState,
                additionalParams
            ) {

                console.log(
                    'CallCard::CallStateChanged',
                    callState,
                    additionalParams
                );


                currentCallState =
                    String(
                        callState || ''
                    );


                handleCallState(
                    currentCallState
                );


                setTimeout(
                    refreshCallStatus,
                    250
                );
            }
        );

    } catch (e) {

        console.warn(
            'CallCard::CallStateChanged bind error:',
            e
        );
    }


    try {

        BX24.placement.bindEvent(
            'CallCard::BeforeClose',

            function () {

                if (
                    resultModeEnabled
                    &&
                    !resultSaved
                ) {

                    blockAutoClose();

                    showError(
                        'Сначала выберите и сохраните результат звонка.'
                    );
                }
            }
        );

    } catch (e) {

        console.warn(
            'CallCard::BeforeClose bind error:',
            e
        );
    }


    /*
     * getStatus не всегда готов в первый момент.
     * Поэтому не ждём события, а сами опрашиваем
     * карточку звонка.
     */

    refreshCallStatus();

    startStatusPolling();

});


/*
 * =========================================================
 * ПОЛУЧАЕМ ПОЛНЫЙ СТАТУС CALL_CARD
 * =========================================================
 */

function refreshCallStatus() {

    if (
        statusRequestInProgress
    ) {
        return;
    }


    statusRequestInProgress =
        true;


    try {

        BX24.placement.call(
            'getStatus',
            {},

            function (status) {

                statusRequestInProgress =
                    false;


                if (!status) {

                    syncCreateLeadButtonState();

                    return;
                }


                console.log(
                    'CALL_CARD getStatus',
                    status
                );


                applyCallStatus(
                    status
                );
            }
        );

    } catch (e) {

        statusRequestInProgress =
            false;


        console.warn(
            'CALL_CARD getStatus error:',
            e
        );


        document.getElementById(
            'callStatus'
        ).textContent =
            'Виджет открыт. Ожидаем контекст звонка от Bitrix24...';


        syncCreateLeadButtonState();
    }
}


/*
 * =========================================================
 * ПЕРИОДИЧЕСКИ ОПРАШИВАЕМ CALL_CARD
 * =========================================================
 */

function startStatusPolling() {

    if (
        statusPollTimer
    ) {
        return;
    }


    statusPollTimer =
        setInterval(
            function () {

                statusPollAttempts++;


                refreshCallStatus();


                /*
                 * Первые ~20 секунд опрашиваем часто.
                 * Потом оставляем более спокойный режим.
                 */

                if (
                    statusPollAttempts === 40
                ) {

                    clearInterval(
                        statusPollTimer
                    );


                    statusPollTimer =
                        setInterval(
                            refreshCallStatus,
                            2000
                        );
                }

            },
            500
        );
}


/*
 * =========================================================
 * СОСТОЯНИЕ КНОПКИ СОЗДАНИЯ ЛИДА
 * =========================================================
 */

function syncCreateLeadButtonState() {

    var button =
        document.getElementById(
            'createLeadButton'
        );


    if (!button) {
        return;
    }


    if (leadId) {

        button.disabled =
            false;

        button.style.display =
            'none';

        return;
    }


    button.style.display =
        'block';


    if (
        callId
        &&
        !leadCreationInProgress
    ) {

        button.disabled =
            false;

        button.textContent =
            '+ Создать лид';

    } else if (
        leadCreationInProgress
    ) {

        button.disabled =
            true;

        button.textContent =
            'Создаём лид...';

    } else {

        button.disabled =
            true;

        button.textContent =
            'Ожидаем данные звонка...';
    }
}


/*
 * =========================================================
 * СБРАСЫВАЕМ СОСТОЯНИЕ ПРИ НОВОМ ЗВОНКЕ
 * =========================================================
 */

function resetCallSessionForNewCall(
    newCallId,
    newPhoneNumber
) {

    console.log(
        'Новый звонок. Сбрасываем состояние CALL_CARD:',
        callId,
        '->',
        newCallId
    );


    /*
     * Если следующий звонок идёт тому же клиенту/номеру,
     * сохраняем уже известный leadId.
     * Иначе CALL_CARD после первого звонка терял привязку
     * и снова показывал «+ Создать лид».
     */

    const oldPhoneDigits =
        String(phoneNumber || '')
            .replace(/\D/g, '');

    const newPhoneDigits =
        String(newPhoneNumber || '')
            .replace(/\D/g, '');

    const preservedLeadId =
        (
            leadId > 0
            &&
            oldPhoneDigits.length >= 10
            &&
            newPhoneDigits.length >= 10
            &&
            oldPhoneDigits === newPhoneDigits
        )
        ?
        leadId
        :
        0;


    resultSaved =
        false;

    resultModeEnabled =
        false;

    leadCreationInProgress =
        false;

    activityBindingInProgress =
        false;

    crmActivityId =
        0;

    leadId =
        preservedLeadId;

    activityRetryCount =
        0;

    existingLeadLookupInProgress =
        false;

    existingLeadLookupFinishedCallId =
        '';


    if (activityRetryTimer) {

        clearTimeout(
            activityRetryTimer
        );

        activityRetryTimer =
            null;
    }


    if (keepAliveTimer) {

        clearInterval(
            keepAliveTimer
        );

        keepAliveTimer =
            null;
    }


    const select =
        document.getElementById(
            'callResult'
        );


    if (select) {

        select.value =
            '';

        if (
            callResultFieldCode
            &&
            select.options.length > 1
        ) {

            select.disabled =
                false;
        }
    }


    const comment =
        document.getElementById(
            'callComment'
        );


    if (comment) {

        comment.value =
            '';
    }


    const saveButton =
        document.getElementById(
            'saveButton'
        );


    if (saveButton) {

        saveButton.disabled =
            true;

        saveButton.textContent =
            'Сохранить результат';
    }


    const message =
        document.getElementById(
            'message'
        );


    if (message) {

        message.className =
            'message';

        message.textContent =
            '';
    }


    const openLeadButton =
        document.getElementById(
            'openLeadButton'
        );


    if (openLeadButton) {

        openLeadButton.style.display =
            'none';
    }


    const leadInfo =
        document.getElementById(
            'leadInfo'
        );


    if (leadInfo) {

        if (leadId > 0) {

            leadInfo.className =
                'info ok';

            leadInfo.textContent =
                'Повторный звонок. Используем связанный лид #' +
                leadId +
                '.';

        } else {

            leadInfo.className =
                'info';

            leadInfo.textContent =
                'Новый звонок. Определяем связанный лид...';
        }
    }


    const bindingInfo =
        document.getElementById(
            'bindingInfo'
        );


    if (bindingInfo) {

        bindingInfo.className =
            'info';

        bindingInfo.textContent =
            'Проверяем привязку нового звонка...';
    }
}


/*
 * =========================================================
 * ОБРАБАТЫВАЕМ СТАТУС
 * =========================================================
 */

function applyCallStatus(
    status
) {

    const newCallId =
        String(
            status.CALL_ID || ''
        );


    const newPhoneNumber =
        String(
            status.PHONE_NUMBER || ''
        );


    /*
     * CALL_CARD может не перезагружаться между звонками.
     * Поэтому при смене CALL_ID обязательно сбрасываем
     * resultSaved и состояние предыдущего звонка.
     */

    if (
        newCallId
        &&
        callId
        &&
        newCallId !== callId
    ) {

        resetCallSessionForNewCall(
            newCallId,
            newPhoneNumber
        );
    }


    callStatusData =
        status || {};


    callId =
        newCallId
        ||
        callId
        ||
        '';


    phoneNumber =
        String(
            status.PHONE_NUMBER || phoneNumber || ''
        );


    currentCallState =
        String(
            status.CALL_STATE || currentCallState || ''
        );


    crmActivityId =
        normalizePositiveId(
            status.CRM_ACTIVITY_ID
        );


    syncCreateLeadButtonState();


    /*
     * Если у звонка уже есть лид —
     * используем его.
     *
     * Если лида нет — НЕ создаём автоматически.
     * Показываем менеджеру кнопку "+ Создать лид".
     */

    const existingLeadId =
        findLeadIdInStatus(
            status
        );


    if (existingLeadId) {

        setLead(
            existingLeadId,
            false
        );

    } else if (!leadId) {

        tryResolveExistingLeadForCurrentCall(
            status
        );
    }


    /*
     * Если лид уже известен —
     * пытаемся привязать к нему
     * CRM-дело звонка.
     */

    if (leadId) {

        ensureCallActivityBinding();
    }


    handleCallState(
        currentCallState
    );
}


/*
 * =========================================================
 * ЕСЛИ BITRIX НЕ ПЕРЕДАЛ LEAD В CALL_CARD,
 * ИЩЕМ УЖЕ СУЩЕСТВУЮЩИЙ АКТИВНЫЙ ЛИД КЛИЕНТА
 * =========================================================
 *
 * Это нужно для повторных звонков. Новый iframe CALL_CARD
 * не помнит leadId предыдущего звонка, поэтому восстанавливаем
 * его через связанный контакт или телефон клиента.
 */

function tryResolveExistingLeadForCurrentCall(
    status
) {

    if (
        leadId
        ||
        existingLeadLookupInProgress
    ) {
        return;
    }


    if (
        !callId
        ||
        existingLeadLookupFinishedCallId === callId
    ) {

        if (!leadId) {
            showCreateLeadButton();
        }

        return;
    }


    existingLeadLookupInProgress =
        true;


    document.getElementById(
        'leadInfo'
    ).textContent =
        'Ищем существующий лид клиента...';


    function finishWithoutLead() {

        existingLeadLookupInProgress =
            false;

        existingLeadLookupFinishedCallId =
            callId;

        if (!leadId) {
            showCreateLeadButton();
        }
    }


    function finishWithLead(
        foundLeadId
    ) {

        existingLeadLookupInProgress =
            false;

        existingLeadLookupFinishedCallId =
            callId;


        foundLeadId =
            normalizePositiveId(
                foundLeadId
            );


        if (!foundLeadId) {
            finishWithoutLead();
            return;
        }


        setLead(
            foundLeadId,
            false
        );


        ensureCallActivityBinding();
    }


    function findLeadByContactId(
        contactId
    ) {

        contactId =
            normalizePositiveId(
                contactId
            );


        if (!contactId) {
            finishWithoutLead();
            return;
        }


        BX24.callMethod(
            'crm.lead.list',

            {
                order: {
                    ID:
                        'DESC'
                },

                filter: {
                    CONTACT_ID:
                        contactId
                },

                select: [
                    'ID',
                    'TITLE',
                    'STATUS_ID',
                    'STATUS_SEMANTIC_ID'
                ]
            },

            function (result) {

                if (result.error()) {

                    console.warn(
                        'Не удалось найти лиды контакта:',
                        result.error(),
                        result.error_description()
                    );

                    finishWithoutLead();
                    return;
                }


                const leads =
                    result.data() || [];


                if (!leads.length) {
                    finishWithoutLead();
                    return;
                }


                const hasSemanticData =
                    leads.some(
                        function (item) {
                            return String(
                                item.STATUS_SEMANTIC_ID || ''
                            ).trim() !== '';
                        }
                    );


                let targetLead =
                    null;


                if (hasSemanticData) {

                    targetLead =
                        leads.find(
                            function (item) {

                                const semantic =
                                    String(
                                        item.STATUS_SEMANTIC_ID || ''
                                    )
                                    .trim()
                                    .toUpperCase();


                                return (
                                    semantic !== 'S'
                                    &&
                                    semantic !== 'F'
                                );
                            }
                        ) || null;

                } else {

                    /*
                     * На некоторых порталах STATUS_SEMANTIC_ID
                     * в crm.lead.list не приходит. Тогда берём
                     * самый свежий связанный лид.
                     */

                    targetLead =
                        leads[0] || null;
                }


                if (!targetLead) {
                    finishWithoutLead();
                    return;
                }


                finishWithLead(
                    targetLead.ID
                );
            }
        );
    }


    /*
     * Сначала пробуем взять CONTACT прямо из CALL_CARD.
     */

    const mainType =
        String(
            status?.CRM_ENTITY_TYPE || ''
        ).toUpperCase();


    const mainId =
        normalizePositiveId(
            status?.CRM_ENTITY_ID
        );


    if (
        mainType === 'CONTACT'
        &&
        mainId
    ) {

        findLeadByContactId(
            mainId
        );

        return;
    }


    const bindings =
        Array.isArray(
            status?.CRM_BINDINGS
        )
        ?
        status.CRM_BINDINGS
        :
        [];


    const contactBinding =
        bindings.find(
            function (binding) {

                return (
                    String(
                        binding.ENTITY_TYPE || ''
                    ).toUpperCase() === 'CONTACT'
                    &&
                    normalizePositiveId(
                        binding.ENTITY_ID
                    ) > 0
                );
            }
        );


    if (contactBinding) {

        findLeadByContactId(
            contactBinding.ENTITY_ID
        );

        return;
    }


    /*
     * Если CALL_CARD передал только номер телефона —
     * находим контакт по телефону.
     */

    if (!isUsablePhone(phoneNumber)) {
        finishWithoutLead();
        return;
    }


    BX24.callMethod(
        'crm.duplicate.findbycomm',

        {
            entity_type:
                'CONTACT',

            type:
                'PHONE',

            values: [
                phoneNumber
            ]
        },

        function (result) {

            if (result.error()) {

                console.warn(
                    'Не удалось найти контакт по телефону:',
                    result.error(),
                    result.error_description()
                );

                finishWithoutLead();
                return;
            }


            const data =
                result.data() || {};


            const contactIds =
                Array.isArray(
                    data.CONTACT
                )
                ?
                data.CONTACT
                :
                [];


            if (!contactIds.length) {
                finishWithoutLead();
                return;
            }


            findLeadByContactId(
                contactIds[0]
            );
        }
    );
}


/*
 * =========================================================
 * ИЩЕМ ЛИД СРЕДИ ПРИВЯЗОК ЗВОНКА
 * =========================================================
 */

function findLeadIdInStatus(
    status
) {

    const mainType =
        String(
            status.CRM_ENTITY_TYPE || ''
        ).toUpperCase();


    const mainId =
        normalizePositiveId(
            status.CRM_ENTITY_ID
        );


    if (
        mainType === 'LEAD'
        &&
        mainId
    ) {

        return mainId;
    }


    const bindings =
        Array.isArray(
            status.CRM_BINDINGS
        )
        ?
        status.CRM_BINDINGS
        :
        [];


    const leadBinding =
        bindings.find(
            function (binding) {

                return (
                    String(
                        binding.ENTITY_TYPE || ''
                    ).toUpperCase()
                    ===
                    'LEAD'
                    &&
                    normalizePositiveId(
                        binding.ENTITY_ID
                    ) > 0
                );
            }
        );


    return leadBinding
        ?
        normalizePositiveId(
            leadBinding.ENTITY_ID
        )
        :
        0;
}

function createLeadManually() {

    if (leadId) {

        openLead();

        return;
    }


    if (!callId) {

        showError(
            'Данные звонка ещё загружаются. Подождите 1–2 секунды.'
        );

        refreshCallStatus();

        startStatusPolling();

        syncCreateLeadButtonState();

        return;
    }


    const button =
        document.getElementById(
            'createLeadButton'
        );


    button.disabled =
        true;

    button.textContent =
        'Создаём лид...';


    document.getElementById(
        'leadInfo'
    ).textContent =
        'Запускаем создание лида...';


    /*
     * Страховка от вечного зависания.
     */

    const createTimeout =
        setTimeout(
            function () {

                if (
                    !leadId
                    &&
                    leadCreationInProgress
                ) {

                    leadCreationInProgress =
                        false;


                    button.disabled =
                        false;

                    button.textContent =
                        '+ Создать лид';


                    showError(
                        'Создание лида зависло. Повторите попытку.'
                    );


                    document.getElementById(
                        'leadInfo'
                    ).textContent =
                        'Не удалось завершить создание лида.';
                }

            },
            10000
        );


    ensureLeadForCall(
        callStatusData
    );


    /*
     * Если лид успешно появится —
     * таймер просто ничего не сделает.
     */

    const watchSuccess =
        setInterval(
            function () {

                if (
                    leadId
                    ||
                    !leadCreationInProgress
                ) {

                    clearTimeout(
                        createTimeout
                    );

                    clearInterval(
                        watchSuccess
                    );
                }

            },
            300
        );
}

/*
 * =========================================================
 * СОЗДАЁМ ЛИД ПО КНОПКЕ, ЕСЛИ ЕГО НЕТ
 * =========================================================
 */

function ensureLeadForCall(
    status
) {

    if (
        leadId
        ||
        leadCreationInProgress
    ) {
        return;
    }


    /*
     * CALL_ID используется как уникальный
     * внешний идентификатор.
     *
     * Благодаря этому повторная загрузка
     * виджета не создаст второй лид
     * для того же звонка.
     */

    if (!callId) {

        document.getElementById(
            'leadInfo'
        ).textContent =
            'Ожидаем идентификатор звонка для создания лида...';


        const button =
            document.getElementById(
                'createLeadButton'
            );


        button.disabled =
            false;

        button.textContent =
            '+ Создать лид';


        return;
    }


leadCreationInProgress =
    true;

document.getElementById(
    'leadInfo'
).textContent =
    'Шаг 1/4: проверяем существующий лид...';

    const originId =
        buildOriginId(
            callId
        );


    /*
     * Сначала ищем наш лид по CALL_ID.
     */

    BX24.callMethod(
        'crm.lead.list',

        {
            order: {
                ID:
                    'DESC'
            },

            filter: {

                ORIGINATOR_ID:
                    LEAD_ORIGINATOR_ID,

                ORIGIN_ID:
                    originId
            },

            select: [
                'ID',
                'TITLE'
            ]
        },

        function (result) {

            if (result.error()) {

                console.warn(
                    'Не удалось проверить существующий лид:',
                    result.error(),
                    result.error_description()
                );

document.getElementById(
    'leadInfo'
).textContent =
    'Шаг 2/4: определяем клиента и ответственного...';
                /*
                 * Даже если поиск не сработал,
                 * продолжаем создание.
                 */

                resolveLeadContext(
                    status,
                    function (context) {
                        ensureClientContextByPhone(
                            context,
                            createLeadFromContext
                        );
                    }
                );

                return;
            }


            const leads =
                result.data() || [];


            if (
                leads.length > 0
            ) {

                const foundId =
                    normalizePositiveId(
                        leads[0].ID
                    );


                leadCreationInProgress =
                    false;


                setLead(
                    foundId,
                    true
                );


                showLeadCreatedActions();


                ensureCallActivityBinding();

                return;
            }

document.getElementById(
    'leadInfo'
).textContent =
    'Шаг 2/4: определяем клиента и ответственного...';
            /*
             * Лида для этого CALL_ID ещё нет.
             * Получаем ответственного и
             * существующего клиента.
             */

            resolveLeadContext(
                status,
                function (context) {
                    ensureClientContextByPhone(
                        context,
                        createLeadFromContext
                    );
                }
            );
        }
    );
}


/*
 * =========================================================
 * СОБИРАЕМ КОНТЕКСТ ИЗ КОМПАНИИ / КОНТАКТА / СДЕЛКИ
 * =========================================================
 */

function resolveLeadContext(
    status,
    callback
) {

    const context = {

        assignedById:
            0,

        contactId:
            0,

        companyId:
            0,

        clientTitle:
            ''
    };


    const mainType =
        String(
            status.CRM_ENTITY_TYPE || ''
        ).toUpperCase();


    const mainId =
        normalizePositiveId(
            status.CRM_ENTITY_ID
        );


    const bindings =
        Array.isArray(
            status.CRM_BINDINGS
        )
        ?
        status.CRM_BINDINGS
        :
        [];


    /*
     * Забираем CONTACT / COMPANY
     * из всех привязок.
     */

    bindings.forEach(
        function (binding) {

            const type =
                String(
                    binding.ENTITY_TYPE || ''
                ).toUpperCase();


            const id =
                normalizePositiveId(
                    binding.ENTITY_ID
                );


            if (
                type === 'CONTACT'
                &&
                id
                &&
                !context.contactId
            ) {

                context.contactId =
                    id;
            }


            if (
                type === 'COMPANY'
                &&
                id
                &&
                !context.companyId
            ) {

                context.companyId =
                    id;
            }
        }
    );


    /*
     * Основная сущность тоже учитывается.
     */

    if (
        mainType === 'CONTACT'
        &&
        mainId
    ) {

        context.contactId =
            mainId;
    }


    if (
        mainType === 'COMPANY'
        &&
        mainId
    ) {

        context.companyId =
            mainId;
    }


    /*
     * Если звонок связан со сделкой,
     * из неё удобно взять ответственного,
     * контакт и компанию.
     */

    if (
        mainType === 'DEAL'
        &&
        mainId
    ) {

        BX24.callMethod(
            'crm.deal.get',

            {
                id:
                    mainId
            },

            function (result) {

                if (!result.error()) {

                    const deal =
                        result.data() || {};


                    context.assignedById =
                        normalizePositiveId(
                            deal.ASSIGNED_BY_ID
                        );


                    context.contactId =
                        normalizePositiveId(
                            deal.CONTACT_ID
                        )
                        ||
                        context.contactId;


                    context.companyId =
                        normalizePositiveId(
                            deal.COMPANY_ID
                        )
                        ||
                        context.companyId;


                    context.clientTitle =
                        String(
                            deal.TITLE || ''
                        ).trim();
                }


                finishResolveClientContext(
                    context,
                    callback
                );
            }
        );

        return;
    }


    /*
     * Если основная сущность — контакт.
     */

    if (
        mainType === 'CONTACT'
        &&
        mainId
    ) {

        BX24.callMethod(
            'crm.contact.get',

            {
                id:
                    mainId
            },

            function (result) {

                if (!result.error()) {

                    const contact =
                        result.data() || {};


                    context.assignedById =
                        normalizePositiveId(
                            contact.ASSIGNED_BY_ID
                        );


                    context.companyId =
                        normalizePositiveId(
                            contact.COMPANY_ID
                        )
                        ||
                        context.companyId;


                    context.clientTitle =
                        [
                            contact.NAME,
                            contact.SECOND_NAME,
                            contact.LAST_NAME
                        ]
                        .filter(Boolean)
                        .join(' ')
                        .trim();
                }


                finishResolveClientContext(
                    context,
                    callback
                );
            }
        );

        return;
    }


    /*
     * Если основная сущность — компания.
     */

    if (
        mainType === 'COMPANY'
        &&
        mainId
    ) {

        BX24.callMethod(
            'crm.company.get',

            {
                id:
                    mainId
            },

            function (result) {

                if (!result.error()) {

                    const company =
                        result.data() || {};


                    context.assignedById =
                        normalizePositiveId(
                            company.ASSIGNED_BY_ID
                        );


                    context.clientTitle =
                        String(
                            company.TITLE || ''
                        ).trim();
                }


                finishResolveClientContext(
                    context,
                    callback
                );
            }
        );

        return;
    }


    /*
     * Основной сущности нет либо она другая,
     * но в CRM_BINDINGS могла быть компания
     * или контакт.
     */

    finishResolveClientContext(
        context,
        callback
    );
}


/*
 * =========================================================
 * ЕСЛИ ОТВЕТСТВЕННЫЙ ЕЩЁ НЕ НАЙДЕН,
 * БЕРЁМ ЕГО ИЗ КОНТАКТА/КОМПАНИИ
 * =========================================================
 */

function finishResolveClientContext(
    context,
    callback
) {

    if (
        context.assignedById
    ) {

        callback(
            context
        );

        return;
    }


    if (
        context.contactId
    ) {

        BX24.callMethod(
            'crm.contact.get',

            {
                id:
                    context.contactId
            },

            function (result) {

                if (!result.error()) {

                    const contact =
                        result.data() || {};


                    context.assignedById =
                        normalizePositiveId(
                            contact.ASSIGNED_BY_ID
                        );


                    context.companyId =
                        normalizePositiveId(
                            contact.COMPANY_ID
                        )
                        ||
                        context.companyId;


                    if (
                        !context.clientTitle
                    ) {

                        context.clientTitle =
                            [
                                contact.NAME,
                                contact.SECOND_NAME,
                                contact.LAST_NAME
                            ]
                            .filter(Boolean)
                            .join(' ')
                            .trim();
                    }
                }


                if (
                    context.assignedById
                    ||
                    !context.companyId
                ) {

                    callback(
                        context
                    );

                    return;
                }


                resolveContextFromCompany(
                    context,
                    callback
                );
            }
        );

        return;
    }


    if (
        context.companyId
    ) {

        resolveContextFromCompany(
            context,
            callback
        );

        return;
    }


    /*
     * ASSIGNED_BY_ID можно не передавать:
     * Битрикс назначит значение по своим
     * стандартным правилам/текущему пользователю.
     */

    callback(
        context
    );
}


function resolveContextFromCompany(
    context,
    callback
) {

    BX24.callMethod(
        'crm.company.get',

        {
            id:
                context.companyId
        },

        function (result) {

            if (!result.error()) {

                const company =
                    result.data() || {};


                context.assignedById =
                    normalizePositiveId(
                        company.ASSIGNED_BY_ID
                    );


                if (
                    !context.clientTitle
                ) {

                    context.clientTitle =
                        String(
                            company.TITLE || ''
                        ).trim();
                }
            }


            callback(
                context
            );
        }
    );
}


/*
 * =========================================================
 * НАДЁЖНО ОПРЕДЕЛЯЕМ КЛИЕНТА ПО ТЕЛЕФОНУ
 * =========================================================
 */

function ensureClientContextByPhone(
    context,
    callback
) {

    if (!isUsablePhone(phoneNumber)) {
        callback(context);
        return;
    }

    BX24.callMethod(
        'crm.duplicate.findbycomm',
        {
            entity_type: 'CONTACT',
            type: 'PHONE',
            values: [phoneNumber]
        },
        function (contactResult) {

            if (!contactResult.error()) {
                const data = contactResult.data() || {};
                const ids = Array.isArray(data.CONTACT)
                    ? data.CONTACT
                    : [];

                if (ids.length > 0) {
                    context.contactId = Number(ids[0]);
                }
            }

            if (context.contactId) {
                BX24.callMethod(
                    'crm.contact.get',
                    { id: context.contactId },
                    function (result) {

                        if (!result.error()) {
                            const contact = result.data() || {};

                            context.assignedById = Number(
                                contact.ASSIGNED_BY_ID
                                || context.assignedById
                                || 0
                            );

                            context.companyId = Number(
                                contact.COMPANY_ID
                                || context.companyId
                                || 0
                            );

                            const contactName = [
                                contact.NAME,
                                contact.SECOND_NAME,
                                contact.LAST_NAME
                            ].filter(Boolean).join(' ').trim();

                            if (contactName) {
                                context.clientTitle = contactName;
                            }
                        }

                        callback(context);
                    }
                );

                return;
            }

            BX24.callMethod(
                'crm.duplicate.findbycomm',
                {
                    entity_type: 'COMPANY',
                    type: 'PHONE',
                    values: [phoneNumber]
                },
                function (companyResult) {

                    if (!companyResult.error()) {
                        const data = companyResult.data() || {};
                        const ids = Array.isArray(data.COMPANY)
                            ? data.COMPANY
                            : [];

                        if (ids.length > 0) {
                            context.companyId = Number(ids[0]);
                        }
                    }

                    if (context.companyId) {
                        BX24.callMethod(
                            'crm.company.get',
                            { id: context.companyId },
                            function (result) {

                                if (!result.error()) {
                                    const company = result.data() || {};

                                    context.assignedById = Number(
                                        company.ASSIGNED_BY_ID
                                        || context.assignedById
                                        || 0
                                    );

                                    if (company.TITLE) {
                                        context.clientTitle = String(company.TITLE);
                                    }
                                }

                                callback(context);
                            }
                        );

                        return;
                    }

                    createContactForCall(
                        context,
                        callback
                    );
                }
            );
        }
    );
}


function createContactForCall(
    context,
    callback
) {

    const contactName =
        String(context.clientTitle || '').trim()
        || ('Клиент ' + phoneNumber);

    const fields = {
        NAME: contactName,
        OPENED: 'Y',
        PHONE: [
            {
                VALUE: phoneNumber,
                VALUE_TYPE: 'WORK'
            }
        ]
    };

    if (context.assignedById) {
        fields.ASSIGNED_BY_ID =
            Number(context.assignedById);
    }

    BX24.callMethod(
        'crm.contact.add',
        { fields: fields },
        function (result) {

            if (result.error()) {
                console.warn(
                    'Не удалось создать контакт:',
                    result.error(),
                    result.error_description()
                );

                callback(context);
                return;
            }

            context.contactId =
                Number(result.data());

            context.clientTitle =
                contactName;

            callback(context);
        }
    );
}


/*
 * =========================================================
 * СОЗДАЁМ ЛИД
 * =========================================================
 */

function getLeadStatusIdByName(
    stageName,
    callback
) {

    BX24.callMethod(
        'crm.status.list',

        {
            filter: {
                ENTITY_ID:
                    'STATUS'
            },

            order: {
                SORT:
                    'ASC'
            }
        },

        function (result) {

            if (result.error()) {

                console.warn(
                    'Не удалось получить стадии лидов:',
                    result.error(),
                    result.error_description()
                );

                callback('');
                return;
            }


            const statuses =
                result.data() || [];


            const target =
                statuses.find(
                    function (status) {

                        return (
                            normalizeText(
                                status.NAME
                            )
                            ===
                            normalizeText(
                                stageName
                            )
                        );
                    }
                );


            if (!target) {

                console.warn(
                    'Не найдена стадия:',
                    stageName
                );

                callback('');
                return;
            }


            callback(
                String(
                    target.STATUS_ID || ''
                )
            );
        }
    );
}

function createLeadFromContext(context) 
{
document.getElementById(
    'leadInfo'
).textContent =

            );


            const fields = {

                    buildLeadTitle(
                        context
                    ),

                 */
                STATUS_ID:
                    realNewStatusId,

                SOURCE_ID:
                    'CALL',

                    'Y',

            };


            if (

            ) {

            }


            if (
                context.contactId
            ) {

                fields.CONTACT_IDS = [

                    )
                ];
            }


            if (
                context.companyId
            ) {

                fields.COMPANY_ID =
                    Number(
                        context.companyId
                    );
            }


            if (
                isUsablePhone(
                    phoneNumber
                )
            ) {

                fields.PHONE = [
                    {

                        VALUE_TYPE:
                            'WORK'
                    }
                ];
            }


           

document.getElementById(
    'leadInfo'
).textContent =
    'Шаг 4/4: создаём лид в CRM...';

            BX24.callMethod(
                'crm.lead.add',

                {
                    fields:
                        fields,

                    params: {

                        REGISTER_SONET_EVENT:
                            'Y'
                    }
                },

                function (result) {

                    leadCreationInProgress =
                        false;


                    if (result.error()) {

                        showError(
                            'Не удалось создать лид: ' +
                            result.error_description()
                        );


                        document.getElementById(
                            'leadInfo'
                        ).textContent =

                            document.getElementById(
                                'createLeadButton'
                            );

                        button.textContent =

                    }

                            result.data()
                        );


                    if (!newLeadId) {

                        showError(
                            'Битрикс24 не вернул ID созданного лида.'
                        );

                        return;
                    }


                    bindClientToLead(

                        context,

                            ensureLeadStageNew(
                                newLeadId,

                                function () {

                                    setLead(
                                        newLeadId,
                                        true
                                    );


                                    showSuccess(
                                        'Лид #' +
                                        newLeadId +
                                        ' создан. Клиент привязан. Стадия: «Новый».'
                                    );


                                    showLeadCreatedActions();


                                    ensureCallActivityBinding();
                                }
                            );
                        }
                    );
                }
            );
        }
    );
}


/*
 * =========================================================
 * ЯВНО ПРИВЯЗЫВАЕМ КЛИЕНТА К ЛИДУ
 * =========================================================
 */

function bindClientToLead(
    newLeadId,
    context,
    callback
) {

    const finish = function () {

        if (context.companyId) {
            BX24.callMethod(
                'crm.lead.update',
                {
                    id: newLeadId,
                    fields: {
                        COMPANY_ID:
                            Number(context.companyId)
                    }
                },
                function () {
                    callback();
                }
            );

            return;
        }

        callback();
    };


    if (!context.contactId) {
        finish();
        return;
    }


    BX24.callMethod(
        'crm.lead.contact.add',
        {
            id: newLeadId,
            fields: {
                CONTACT_ID:
                    Number(context.contactId),

                SORT:
                    10,

                IS_PRIMARY:
                    'Y'
            }
        },
        function (result) {

            if (result.error()) {
                console.warn(
                    'crm.lead.contact.add:',
                    result.error(),
                    result.error_description()
                );
            }

            finish();
        }
    );
}


/*
 * =========================================================
 * ФИКСИРУЕМ СТАДИЮ "НОВЫЙ"
 * =========================================================
 */

function ensureLeadStageNew(
    newLeadId,
    callback
) {

    getLeadStatusIdByName(
        'Новый',

        function (
            realNewStatusId
        ) {

            if (!realNewStatusId) {

                console.warn(
                    'Не удалось найти реальный STATUS_ID стадии "Новый"'
                );

                callback();
                return;
            }


            BX24.callMethod(
                'crm.lead.get',

                {
                    id:
                        newLeadId
                },

                function (getResult) {

                    if (getResult.error()) {

                        console.warn(
                            'Не удалось проверить стадию лида:',
                            getResult.error(),
                            getResult.error_description()
                        );

                        callback();
                        return;
                    }


                    const leadData =
                        getResult.data() || {};


                    const currentStatusId =
                        String(
                            leadData.STATUS_ID || ''
                        );


                    console.log(
                        'Стадия лида после создания:',
                        currentStatusId,
                        'ожидается:',
                        realNewStatusId
                    );


                    if (
                        currentStatusId ===
                        realNewStatusId
                    ) {

                        callback();
                        return;
                    }


                    /*
                     * Если другой механизм успел
                     * поменять стадию, возвращаем
                     * именно в реальную стадию "Новый".
                     */

                    BX24.callMethod(
                        'crm.lead.update',

                        {
                            id:
                                newLeadId,

                            fields: {
                                STATUS_ID:
                                    realNewStatusId
                            }
                        },

                        function (updateResult) {

                            if (updateResult.error()) {

                                console.warn(
                                    'Не удалось вернуть лид в "Новый":',
                                    updateResult.error(),
                                    updateResult.error_description()
                                );

                            } else {

                                console.log(
                                    'Лид возвращён в реальную стадию "Новый":',
                                    realNewStatusId
                                );
                            }


                            callback();
                        }
                    );
                }
            );
        }
    );
}

/*
 * =========================================================
 * ПРИВЯЗЫВАЕМ CRM-ДЕЛО ЗВОНКА К ЛИДУ
 * =========================================================
 */

function ensureCallActivityBinding() {

    if (
        !leadId
        ||
        activityBindingInProgress
    ) {
        return;
    }


    /*
     * Если статус уже показывает нужную
     * привязку — делать ничего не надо.
     */

    if (
        statusAlreadyContainsLeadBinding()
    ) {

        showBindingSuccess();

        return;
    }


    /*
     * CRM_ACTIVITY_ID может появиться
     * не сразу после начала звонка.
     */

    if (!crmActivityId) {

        document.getElementById(
            'bindingInfo'
        ).textContent =
            'Лид создан. Ожидаем CRM-дело звонка для привязки...';


        scheduleActivityBindingRetry();

        return;
    }


    activityBindingInProgress =
        true;


    document.getElementById(
        'bindingInfo'
    ).textContent =
        'Привязываем звонок к лиду #' +
        leadId +
        '...';


    BX24.callMethod(
        'crm.activity.binding.add',

        {
            activityId:
                crmActivityId,

            /*
             * entityTypeId = 1 — лид.
             */
            entityTypeId:
                1,

            entityId:
                leadId
        },

        function (result) {

            activityBindingInProgress =
                false;


            if (result.error()) {

                /*
                 * Если связь уже существует,
                 * это для нас успешный результат.
                 */

                if (
                    result.error()
                    ===
                    'ACTIVITY_IS_ALREADY_BOUND'
                ) {

                    showBindingSuccess();

                    return;
                }


                console.warn(
                    'Ошибка привязки звонка:',
                    result.error(),
                    result.error_description()
                );


                document.getElementById(
                    'bindingInfo'
                ).textContent =
                    'Лид создан, но пока не удалось привязать дело звонка. Повторяем...';


                scheduleActivityBindingRetry();

                return;
            }


            showBindingSuccess();


            /*
             * Перечитываем статус,
             * чтобы получить свежие bindings.
             */

            setTimeout(
                refreshCallStatus,
                300
            );
        }
    );
}


function statusAlreadyContainsLeadBinding() {

    const bindings =
        Array.isArray(
            callStatusData.CRM_BINDINGS
        )
        ?
        callStatusData.CRM_BINDINGS
        :
        [];


    return bindings.some(
        function (binding) {

            return (
                String(
                    binding.ENTITY_TYPE || ''
                ).toUpperCase()
                ===
                'LEAD'
                &&
                normalizePositiveId(
                    binding.ENTITY_ID
                )
                ===
                leadId
            );
        }
    );
}


function showBindingSuccess() {

    if (activityRetryTimer) {

        clearTimeout(
            activityRetryTimer
        );

        activityRetryTimer =
            null;
    }


    document.getElementById(
        'bindingInfo'
    ).className =
        'info ok';


    document.getElementById(
        'bindingInfo'
    ).textContent =
        'Звонок привязан к лиду #' +
        leadId +
        '.';
}


/*
 * =========================================================
 * ПОВТОРНАЯ ПОПЫТКА ПОЛУЧИТЬ CRM_ACTIVITY_ID
 * =========================================================
 */

function scheduleActivityBindingRetry() {

    if (
        activityRetryTimer
        ||
        activityRetryCount >= 15
    ) {
        return;
    }


    activityRetryCount++;


    activityRetryTimer =
        setTimeout(
            function () {

                activityRetryTimer =
                    null;


                refreshCallStatus();

            },
            2000
        );
}


/*
 * =========================================================
 * СОСТОЯНИЕ ЗВОНКА
 * =========================================================
 */

function handleCallState(
    callState
) {

    const statusElement =
        document.getElementById(
            'callStatus'
        );


    if (
        callState ===
        'connected'
    ) {

        statusElement.className =
            'call-status';

        statusElement.textContent =
            'Разговор идёт. Лид уже создаётся/проверяется. После завершения выберите результат.';

        return;
    }


    if (
        callState ===
        'connecting'
    ) {

        statusElement.className =
            'call-status';

        statusElement.textContent =
            'Устанавливается соединение...';

        return;
    }


    if (
        callState ===
        'idle'
    ) {

        statusElement.className =
            'call-status finished';

        statusElement.textContent =
            'Звонок завершён. Выберите результат звонка.';


        enableResultMode();

        return;
    }


    statusElement.className =
        'call-status';

    statusElement.textContent =
        'Ожидаем состояние звонка...';
}

/*
 * =========================================================
 * ИЩЕМ ПОЛЕ "РЕЗУЛЬТАТ ЗВОНКА"
 * =========================================================
 */

function loadCallResultField() {

    if (
        callResultFieldCode
    ) {

        updateSaveAvailability();

        return;
    }


    findCallResultField(
        0
    );
}


function findCallResultField(
    start
) {

    BX24.callMethod(
        'crm.lead.userfield.list',

        {
            order: {

                SORT:
                    'ASC',

                ID:
                    'ASC'
            },

            filter: {

                USER_TYPE_ID:
                    'enumeration',

                LANG:
                    'ru'
            },

            start:
                start
        },

        function (result) {

            if (result.error()) {

                showError(
                    'Не удалось получить пользовательские поля лида: ' +
                    result.error_description()
                );

                return;
            }


            const fields =
                result.data() || [];


            const target =
                fields.find(
                    function (field) {

                        return isCallResultField(
                            field
                        );
                    }
                );


            if (target) {

                callResultFieldCode =
                    String(
                        target.FIELD_NAME || ''
                    );


                callResultFieldId =
                    normalizePositiveId(
                        target.ID
                    );


                console.log(
                    'Поле результата звонка найдено:',
                    target
                );


                if (
                    Array.isArray(
                        target.LIST
                    )
                    &&
                    target.LIST.length
                ) {

                    fillResultOptions(
                        target.LIST
                    );

                    return;
                }


                loadCallResultFieldById();

                return;
            }


            if (
                typeof result.more ===
                'function'
                &&
                result.more()
            ) {

                const next =
                    result.next();


                if (
                    next !== false
                    &&
                    next !== null
                    &&
                    next !== undefined
                ) {

                    findCallResultField(
                        Number(next)
                    );

                    return;
                }
            }


            showError(
                'Не найдено поле списка «' +
                CALL_RESULT_FIELD_TITLE +
                '». Проверьте точное название поля.'
            );
        }
    );
}


/*
 * =========================================================
 * ПРОВЕРЯЕМ НАЗВАНИЕ ПОЛЯ
 * =========================================================
 */

function isCallResultField(
    field
) {

    const expected =
        normalizeText(
            CALL_RESULT_FIELD_TITLE
        );


    const labels = [

        field.EDIT_FORM_LABEL,
        field.LIST_COLUMN_LABEL,
        field.LIST_FILTER_LABEL,
        field.LABEL,
        field.TITLE

    ];


    return labels.some(
        function (label) {

            if (
                label
                &&
                typeof label ===
                'object'
            ) {

                label =
                    label.ru || '';
            }


            return (
                normalizeText(
                    label
                )
                ===
                expected
            );
        }
    );
}


/*
 * =========================================================
 * ПОЛУЧАЕМ ВАРИАНТЫ ПОЛЯ
 * =========================================================
 */

function loadCallResultFieldById() {

    if (!callResultFieldId) {

        loadCallResultOptionsFallback();

        return;
    }


    BX24.callMethod(
        'crm.lead.userfield.get',

        {
            id:
                callResultFieldId
        },

        function (result) {

            if (result.error()) {

                loadCallResultOptionsFallback();

                return;
            }


            const field =
                result.data() || {};


            if (
                Array.isArray(
                    field.LIST
                )
                &&
                field.LIST.length
            ) {

                fillResultOptions(
                    field.LIST
                );

                return;
            }


            loadCallResultOptionsFallback();
        }
    );
}


/*
 * =========================================================
 * РЕЗЕРВНО ПОЛУЧАЕМ ENUM ИЗ crm.lead.fields
 * =========================================================
 */

function loadCallResultOptionsFallback() {

    BX24.callMethod(
        'crm.lead.fields',
        {},

        function (result) {

            if (result.error()) {

                showError(
                    'Поле найдено, но не удалось получить варианты списка.'
                );

                return;
            }


            const fields =
                result.data() || {};


            const field =
                fields[
                    callResultFieldCode
                ];


            if (!field) {

                showError(
                    'Поле «Результат звонка» найдено, но его описание недоступно.'
                );

                return;
            }


            const options =
                Array.isArray(
                    field.items
                )
                ?
                field.items
                :
                (
                    Array.isArray(
                        field.LIST
                    )
                    ?
                    field.LIST
                    :
                    []
                );


            if (!options.length) {

                showError(
                    'Не удалось получить варианты поля «Результат звонка».'
                );

                return;
            }


            fillResultOptions(
                options
            );
        }
    );
}


/*
 * =========================================================
 * ЗАПОЛНЯЕМ СПИСОК РЕЗУЛЬТАТОВ
 * =========================================================
 */

function fillResultOptions(
    items
) {

    const select =
        document.getElementById(
            'callResult'
        );


    select.innerHTML =
        '';


    const placeholder =
        document.createElement(
            'option'
        );


    placeholder.value =
        '';

    placeholder.textContent =
        'Выберите результат';


    select.appendChild(
        placeholder
    );


    items.forEach(
        function (item) {

            const value =
                String(
                    item.VALUE
                    ??
                    item.value
                    ??
                    ''
                )
                .trim();


            const id =
                String(
                    item.ID
                    ??
                    item.id
                    ??
                    ''
                )
                .trim();


            if (
                !value
                ||
                !id
            ) {
                return;
            }


            /*
             * "не выбрано" в форме
             * специально не показываем.
             */

            if (
                isEmptyResultValue(
                    value
                )
            ) {
                return;
            }


            const option =
                document.createElement(
                    'option'
                );


            option.value =
                id;

            option.textContent =
                value;


            select.appendChild(
                option
            );
        }
    );


    if (
        select.options.length <= 1
    ) {

        showError(
            'У поля «Результат звонка» нет доступных вариантов.'
        );

        return;
    }


    select.disabled =
        false;


    updateSaveAvailability();
}


/*
 * =========================================================
 * ЗАМЕНЯЕМ СТАНДАРТНУЮ КАРТОЧКУ ЗВОНКА
 * НА НАШУ КОНФИГУРИРУЕМУЮ КАРТОЧКУ
 * =========================================================
 */

function bxCallPromise(
    method,
    params = {}
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            BX24.callMethod(
                method,
                params,

                function (result) {

                    if (result.error()) {

                        reject(
                            new Error(
                                result.error() +
                                ': ' +
                                result.error_description()
                            )
                        );

                        return;
                    }


                    resolve(
                        result.data()
                    );
                }
            );
        }
    );
}


function waitMs(
    ms
) {

    return new Promise(
        function (resolve) {

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


async function waitForCrmActivityId(
    timeoutMs = 5000
) {

    const startedAt =
        Date.now();


    while (
        !crmActivityId
        &&
        Date.now() - startedAt < timeoutMs
    ) {

        refreshCallStatus();

        await waitMs(
            300
        );
    }


    return normalizePositiveId(
        crmActivityId
    );
}


function formatCallDuration(
    startTime,
    endTime
) {

    const start =
        new Date(
            startTime || ''
        ).getTime();


    const end =
        new Date(
            endTime || ''
        ).getTime();


    if (
        !Number.isFinite(start)
        ||
        !Number.isFinite(end)
        ||
        end <= start
    ) {

        return '—';
    }


    const totalSeconds =
        Math.max(
            0,
            Math.round(
                (end - start) / 1000
            )
        );


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    if (!minutes) {

        return seconds + ' сек';
    }


    return (
        minutes +
        ' мин ' +
        String(seconds).padStart(2, '0') +
        ' сек'
    );
}


function formatCallDate(
    value
) {

    const date =
        new Date(
            value || ''
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return '—';
    }


    return date.toLocaleString(
        'ru-RU'
    );
}


function getCallResultTagType(
    resultText
) {

    const normalized =
        normalizeText(
            resultText
        );


    if (
        normalized.includes('отказ')
        ||
        normalized.includes('ошибоч')
    ) {

        return 'warning';
    }


    return 'primary';
}


function formatCallDurationSeconds(
    value
) {

    const totalSeconds =
        Math.max(
            0,
            Number(value || 0)
        );


    if (!Number.isFinite(totalSeconds)) {
        return '—';
    }


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        Math.round(
            totalSeconds % 60
        );


    if (!minutes) {
        return seconds + ' сек';
    }


    return (
        minutes +
        ' мин ' +
        String(seconds).padStart(2, '0') +
        ' сек'
    );
}


async function getCallStatistic(
    originalActivityId = 0
) {

    const filter = {};


    if (callId) {

        filter.CALL_ID =
            callId;

    } else if (originalActivityId) {

        filter.CRM_ACTIVITY_ID =
            originalActivityId;

    } else {

        return null;
    }


    /*
     * Запись разговора иногда появляется
     * не мгновенно после завершения звонка.
     * Несколько секунд ждём статистику телефонии.
     */

    for (
        let attempt = 0;
        attempt < 10;
        attempt++
    ) {

        try {

            const rows =
                await bxCallPromise(
                    'voximplant.statistic.get',
                    {
                        FILTER:
                            filter,

                        SORT:
                            'ID',

                        ORDER:
                            'DESC'
                    }
                );


            const items =
                Array.isArray(rows)
                ?
                rows
                :
                [];


            if (items.length) {

                const row =
                    items[0] || {};


                if (
                    row.CALL_RECORD_URL
                    ||
                    attempt === 9
                ) {

                    return row;
                }
            }

        } catch (error) {

            console.warn(
                'Не удалось получить статистику звонка. ' +
                'Для плеера приложению нужен доступ к телефонии:',
                error
            );

            return null;
        }


        await waitMs(
            500
        );
    }


    return null;
}


function getCallBodyLogoCode(
    directionTitle
) {

    if (
        directionTitle ===
        'Входящий звонок'
    ) {

        return 'call-incoming';
    }


    if (
        directionTitle ===
        'Исходящий звонок'
    ) {

        return 'call-outgoing';
    }


    if (
        directionTitle ===
        'Обратный звонок'
    ) {

        return 'call-incoming';
    }


    return 'call-incoming';
}


async function replaceStandardCallWithCustomCard(

) {

    if (!leadId) {

        throw new Error(
            'Не определён лид.'
        );

     * Поэтому наличие стандартного дела НЕ является
     * обязательным условием для создания нашей карточки.

        );

            );

        }
    }


    const callStatistic =

        );

        String(

        ).trim();


    const lead =
        await bxCallPromise(
