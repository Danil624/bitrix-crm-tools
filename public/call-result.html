            {
                id:
                    leadId
            }
        );


    const hasDirection =
        activity.DIRECTION !== undefined
        &&
        activity.DIRECTION !== null
        &&
        String(activity.DIRECTION) !== '';


    const incoming =
        hasDirection
        ?
        String(
            activity.DIRECTION
        ) === '1'
        :
        false;


    let directionTitle =
        hasDirection
        ?
        (
            incoming
            ?
            'Входящий звонок'
            :
            'Исходящий звонок'
        )
        :
        'Звонок';


    const callType =
        String(
            callStatistic?.CALL_TYPE || ''
        );


    if (callType === '1') {
        directionTitle =
            'Исходящий звонок';
    } else if (
        callType === '2'
        ||
        callType === '3'
    ) {
        directionTitle =
            'Входящий звонок';
    } else if (callType === '4') {
        directionTitle =
            'Обратный звонок';
    }


    const callLogoCode =
        getCallBodyLogoCode(
            directionTitle
        );


    const clientTitle =
        String(
            lead.TITLE ||
            ('Лид #' + leadId)
        );


    const phone =
        String(
            phoneNumber || '—'
        );


    const callDate =
        formatCallDate(
            callStatistic?.CALL_START_DATE ||
            activity.START_TIME ||
            activity.CREATED ||
            new Date().toISOString()
        );


    const duration =
        callStatistic?.CALL_DURATION !== undefined
        &&
        callStatistic?.CALL_DURATION !== null
        ?
        formatCallDurationSeconds(
            callStatistic.CALL_DURATION
        )
        :
        (
            activity.START_TIME
            &&
            activity.END_TIME
        )
        ?
        formatCallDuration(
            activity.START_TIME,
            activity.END_TIME
        )
        :
        '—';


    const responsibleId =
        normalizePositiveId(
            activity.RESPONSIBLE_ID ||
            lead.ASSIGNED_BY_ID
        );


    const originToken =
        originalActivityId
        ||
        callId
        ||
        Date.now();


    const fields = {

        /*
         * typeId специально НЕ задаём.
         * Тогда Bitrix24 использует стандартный
         * тип CONFIGURABLE для приложения.
         */

        completed:
            true,

        isIncomingChannel:
            incoming,

        originatorId:
            'CALL_RESULT_APP',

        originId:
            'CALL_' +
            originToken
    };


    if (responsibleId) {

        fields.responsibleId =
            responsibleId;
    }


    const blocks = {

        client: {

            type:
                'withTitle',

            properties: {

                title:
                    'Клиент',

                inline:
                    true,

                block: {

                    type:
                        'link',

                    properties: {

                        text:
                            clientTitle,

                        bold:
                            true,

                        action: {

                            type:
                                'redirect',

                            uri:
                                '/crm/lead/details/' +
                                leadId +
                                '/'
                        }
                    }
                }
            }
        }
    };


    if (callComment) {

        blocks.comment = {

            type:
                'withTitle',

            properties: {

                title:
                    'Комментарий',

                inline:
                    false,

                block: {

                    type:
                        'text',

                    properties: {

                        value:
                            callComment,

                        multiline:
                            true
                    }
                }
            }
        };
    }


    if (recordUrl) {

        blocks.recording = {

            type:
                'link',

            properties: {

                text:
                    '▶',

                bold:
                    true,

                action: {

                    type:
                        'redirect',

                    uri:
                        recordUrl
                }
            }
        };
    }


    const customActivity =
        await bxCallPromise(
            'crm.activity.configurable.add',
            {
                ownerTypeId:
                    1,

                ownerId:
                    leadId,

                fields:
                    fields,

                layout: {

                    icon: {
                        code:
                            'call-completed'
                    },

                    header: {

                        title:
                            directionTitle
                    },

                    body: {

                        logo: {
                            code:
                                callLogoCode
                        },

                        blocks:
                            blocks
                    },

                    footer: {

                        buttons: {

                            testDrive: {

                                title:
                                    'Создать тест-драйв',

                                type:
                                    'primary',

                                action: {

                                    type:
                                        'openRestApp',

                                    actionParams: {

                                        mode:
                                            'create_testdrive',

                                        ID:
                                            leadId,

                                        leadId:
                                            leadId,

                                        entityId:
                                            leadId
                                    },

                                    sliderParams: {

                                        title:
                                            'Тест-драйв',

                                        width:
                                            760
                                    }
                                }
                            },

                            commercial: {

                                title:
                                    'Создать КП',

                                type:
                                    'secondary',

                                action: {

                                    type:
                                        'openRestApp',

                                    actionParams: {

                                        mode:
                                            'create_commercial',

                                        ID:
                                            leadId,

                                        leadId:
                                            leadId,

                                        entityId:
                                            leadId
                                    },

                                    sliderParams: {

                                        title:
                                            'КП',

                                        width:
                                            760
                                    }
                                }
                            }
                        }
                    }
                }
            }
        );


    const customActivityId =
        normalizePositiveId(
            customActivity?.activity?.id
        );


    if (!customActivityId) {

        throw new Error(
            'Bitrix24 не вернул ID новой карточки звонка.'
        );
    }


    /*
     * Дополнительно убеждаемся, что карточка реально
     * существует в Bitrix24, и только после этого
     * пробуем удалить стандартный звонок.
     */

    await bxCallPromise(
        'crm.activity.configurable.get',
        {
            id:
                customActivityId
        }
    );


    let standardDeleted =
        false;


    if (originalActivityId) {

        try {

            await bxCallPromise(
                'crm.activity.delete',
                {
                    id:
                        originalActivityId
                }
            );


            standardDeleted =
                true;

        } catch (deleteError) {

            /*
             * Кастомную карточку больше НЕ удаляем.
             * Главное — не остаться вообще без записи.
             */

            console.warn(
                'Кастомная карточка создана, но стандартный звонок удалить не удалось:',
                deleteError
            );
        }
    }


    if (standardDeleted) {

        crmActivityId =
            0;
    }


    return {

        customActivityId:
            customActivityId,

        deletedActivityId:
            standardDeleted
            ?
            originalActivityId
            :
            0
    };
}

/*
 * =========================================================
 * СОХРАНЯЕМ РЕЗУЛЬТАТ В СОЗДАННЫЙ ЛИД
 * =========================================================
 */

function saveCallResult() {

    if (
        currentCallState !==
        'idle'
    ) {

        showError(
            'Результат можно сохранить после завершения звонка.'
        );

        return;
    }


    if (!leadId) {

        showError(
            'Лид ещё не создан. Подождите несколько секунд.'
        );

        refreshCallStatus();

        return;
    }


    if (!callResultFieldCode) {

        showError(
            'Не удалось определить поле «Результат звонка».'
        );

        return;
    }


    const select =
        document.getElementById(
            'callResult'
        );


    const enumId =
        String(
            select.value || ''
        );


    if (!enumId) {

        showError(
            'Выберите результат звонка.'
        );

        return;
    }


    const selectedText =
        select.options[
            select.selectedIndex
        ]
        ?
        select.options[
            select.selectedIndex
        ].textContent
        :
        '';


    if (
        isEmptyResultValue(
            selectedText
        )
    ) {

        showError(
            'Выберите результат звонка.'
        );

        return;
    }


    const callComment =
        '';


    setLoading(
        true
    );


    const fields = {};


    fields[
        callResultFieldCode
    ] =
        enumId;


    BX24.callMethod(
        'crm.lead.update',

        {
            id:
                leadId,

            fields:
                fields
        },

        function (result) {

            if (result.error()) {

                setLoading(
                    false
                );


                showError(
                    'Не удалось сохранить результат звонка: ' +
                    result.error_description()
                );

                return;
            }


            /*
             * После сохранения результата
             * ставим правильную стадию лида.
             *
             * Это заодно перекрывает ситуацию,
             * когда Битрикс сам успел увести
             * новый лид в "Отказ от покупки".
             */

            setLeadStageByCallResult(
                selectedText,

                function (
                    stageName,
                    stageWarning
                ) {

                    resultSaved =
                        true;

                    resultModeEnabled =
                        false;


                    if (keepAliveTimer) {

                        clearInterval(
                            keepAliveTimer
                        );

                        keepAliveTimer =
                            null;
                    }


                    document.getElementById(
                        'callResult'
                    ).disabled =
                        true;


                    setLoading(
                        false
                    );


                    document.getElementById(
                        'saveButton'
                    ).disabled =
                        true;


                    let successText =
                        'Результат сохранён в лид #' +
                        leadId +
                        ': ' +
                        selectedText;


                    if (stageName) {

                        successText +=
                            '. Стадия: «' +
                            stageName +
                            '»';
                    }


                    if (stageWarning) {

                        successText +=
                            '. ' +
                            stageWarning;
                    }


                    /*
                     * После сохранения результата
                     * заменяем стандартную карточку звонка
                     * на нашу конфигурируемую карточку.
                     *
                     * Стандартное дело удаляем ТОЛЬКО
                     * после успешного создания нашей карточки.
                     */

                    replaceStandardCallWithCustomCard(
                        selectedText,
                        callComment
                    )
                        .then(
                            function () {

                                showSuccess(
                                    successText +
                                    '. Карточка звонка обновлена.'
                                );


                                BX24.placement.call(
                                    'enableAutoClose',
                                    {},

                                    function () {

                                        console.log(
                                            'Автозакрытие карточки звонка снова разрешено'
                                        );
                                    }
                                );
                            }
                        )
                        .catch(
                            function (error) {

                                console.error(
                                    'Ошибка замены карточки звонка:',
                                    error
                                );


                                showSuccess(
                                    successText +
                                    '. Не удалось создать новую карточку звонка: ' +
                                    error.message
                                );


                                BX24.placement.call(
                                    'enableAutoClose',
                                    {},

                                    function () {

                                        console.log(
                                            'Автозакрытие карточки звонка снова разрешено'
                                        );
                                    }
                                );
                            }
                        );
                }
            );
        }
    );
}


/*
 * =========================================================
 * СТАДИЯ ЛИДА ПО РЕЗУЛЬТАТУ ЗВОНКА
 * =========================================================
 *
 * Логика:
 *
 * Дозвонился...       -> В работе
 * Отказ               -> Отказ от покупки
 * Ошибочный номер     -> Ошибочный клиент
 * Любой другой итог   -> Новый
 *
 * ВАЖНО:
 * "Не дозвонился" содержит слово "дозвонился",
 * поэтому сначала проверяем исключения, а уже потом
 * обычный "Дозвонился".
 */

function setLeadStageByCallResult(
    resultText,
    callback
) {

    const normalized =
        normalizeCallResultForRouting(
            resultText
        );


    let targetStageName =
        'Новый';


    /*
     * 1. Ошибочный номер -> "Ошибочный клиент"
     */

    if (
        normalized.includes(
            'ошибоч'
        )
    ) {

        targetStageName =
            'Ошибочный клиент';

    /*
     * 2. Отказ -> "Отказ от покупки"
     */

    } else if (
        normalized === 'отказ'
        ||
        normalized.includes(
            'отказ от покупки'
        )
    ) {

        targetStageName =
            'Отказ от покупки';

    /*
     * 3. "Дозвонился..." -> "В работе"
     *
     * При этом "Не дозвонился" сюда попасть не должен.
     */

    } else if (
        !normalized.includes(
            'не дозвонился'
        )
        &&
        (
            normalized === 'дозвонился'
            ||
            normalized.startsWith(
                'дозвонился '
            )
            ||
            normalized.includes(
                'дозвонился есть интерес'
            )
        )
    ) {

        targetStageName =
            'В работе';

    /*
     * 4. Всё остальное -> "Новый"
     *
     * Например:
     * - Не дозвонился
     * - Перезвонить позже
     * - Назначена встреча
     * - Другое
     */
    } else {

        targetStageName =
            'Новый';
    }


    BX24.callMethod(
        'crm.status.list',

        {
            filter: {
                ENTITY_ID:
                    'STATUS'
            }
        },

        function (result) {

            if (result.error()) {

                console.warn(
                    'Не удалось получить стадии лидов:',
                    result.error(),
                    result.error_description()
                );


                callback(
                    '',
                    'Не удалось изменить стадию.'
                );

                return;
            }


            const statuses =
                result.data() || [];


            const target =
                statuses.find(
                    function (status) {

                        return (
                            normalizeText(
                                status.NAME
                            )
                            ===
                            normalizeText(
                                targetStageName
                            )
                        );
                    }
                );


            if (!target) {

                console.warn(
                    'Не найдена стадия:',
                    targetStageName
                );


                callback(
                    '',
                    'Стадия «' +
                    targetStageName +
                    '» не найдена.'
                );

                return;
            }


            const statusId =
                String(
                    target.STATUS_ID || ''
                );


            if (!statusId) {

                callback(
                    '',
                    'У стадии «' +
                    targetStageName +
                    '» нет STATUS_ID.'
                );

                return;
            }


            updateLeadStageAndVerify(
                statusId,
                targetStageName,
                callback
            );
        }
    );
}


/*
 * =========================================================
 * СТАВИМ СТАДИЮ И ПРОВЕРЯЕМ, ЧТО ОНА НЕ УЛЕТЕЛА ОБРАТНО
 * =========================================================
 */

function updateLeadStageAndVerify(
    statusId,
    stageName,
    callback
) {

    BX24.callMethod(
        'crm.lead.update',

        {
            id:
                leadId,

            fields: {
                STATUS_ID:
                    statusId
            }
        },

        function (updateResult) {

            if (updateResult.error()) {

                console.warn(
                    'Ошибка смены стадии:',
                    updateResult.error(),
                    updateResult.error_description()
                );


                callback(
                    '',
                    'Не удалось поставить стадию «' +
                    stageName +
                    '».'
                );

                return;
            }


            /*
             * Через небольшую паузу проверяем:
             * если внешний механизм Битрикса
             * снова перекинул лид в "Отказ",
             * возвращаем нужную стадию ещё раз.
             */

            setTimeout(
                function () {

                    BX24.callMethod(
                        'crm.lead.get',

                        {
                            id:
                                leadId
                        },

                        function (getResult) {

                            if (getResult.error()) {

                                callback(
                                    stageName,
                                    ''
                                );

                                return;
                            }


                            const leadData =
                                getResult.data() || {};


                            const currentStatusId =
                                String(
                                    leadData.STATUS_ID || ''
                                );


                            if (
                                currentStatusId ===
                                String(statusId)
                            ) {

                                callback(
                                    stageName,
                                    ''
                                );

                                return;
                            }


                            console.warn(
                                'Стадия была изменена после сохранения.',
                                'Ожидалась:',
                                statusId,
                                'Фактически:',
                                currentStatusId
                            );


                            /*
                             * Одна повторная попытка.
                             * В бесконечный цикл не уходим.
                             */

                            BX24.callMethod(
                                'crm.lead.update',

                                {
                                    id:
                                        leadId,

                                    fields: {
                                        STATUS_ID:
                                            statusId
                                    }
                                },

                                function (
                                    retryResult
                                ) {

                                    if (
                                        retryResult.error()
                                    ) {

                                        callback(
                                            stageName,
                                            'Внешняя автоматизация снова изменила стадию.'
                                        );

                                        return;
                                    }


                                    callback(
                                        stageName,
                                        'Стадия была автоматически изменена Битрикс24 и возвращена приложением.'
                                    );
                                }
                            );
                        }
                    );
                },
                1200
            );
        }
    );
}


/*
 * =========================================================
 * НОРМАЛИЗАЦИЯ РЕЗУЛЬТАТА ДЛЯ МАРШРУТИЗАЦИИ
 * =========================================================
 */

function normalizeCallResultForRouting(
    value
) {

    return String(
        value || ''
    )
    .trim()
    .toLowerCase()
    .replace(
        /ё/g,
        'е'
    )
    .replace(
        /[—–-]+/g,
        ' '
    )
    .replace(
        /\s+/g,
        ' '
    );
}


/*
 * =========================================================
 * ДОСТУПНОСТЬ КНОПКИ
 * =========================================================
 */

function updateSaveAvailability() {

    const button =
        document.getElementById(
            'saveButton'
        );


    const select =
        document.getElementById(
            'callResult'
        );


    button.disabled =
        !(
            currentCallState ===
                'idle'
            &&
            leadId > 0
            &&
            callResultFieldCode
            &&
            !select.disabled
            &&
            !resultSaved
        );
}


/*
 * =========================================================
 * ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
 * =========================================================
 */

function buildLeadTitle(
    context
) {

    const client =
        String(
            context.clientTitle || ''
        ).trim();


    if (client) {

        return (
            'Звонок — ' +
            client
        );
    }


    if (
        isUsablePhone(
            phoneNumber
        )
    ) {

        return (
            'Звонок — ' +
            phoneNumber
        );
    }


    return 'Звонок — новый лид';
}


function buildOriginId(
    id
) {

    return (
        'CALL_' +
        String(
            id || ''
        )
    )
    .slice(
        0,
        250
    );
}


function normalizePositiveId(
    value
) {

    const id =
        Number(
            value
        );


    return (
        Number.isFinite(id)
        &&
        id > 0
    )
    ?
    Math.trunc(id)
    :
    0;
}


function isUsablePhone(
    value
) {

    const phone =
        String(
            value || ''
        )
        .trim()
        .toLowerCase();


    return (
        phone !== ''
        &&
        phone !== 'hidden'
        &&
        phone !== 'unknown'
        &&
        phone !== 'undefined'
    );
}


function normalizeText(
    value
) {

    return String(
        value || ''
    )
    .trim()
    .toLowerCase()
    .replace(
        /\s+/g,
        ' '
    );
}


function isEmptyResultValue(
    value
) {

    const normalized =
        normalizeText(
            value
        );


    return (
        normalized ===
            'не выбрано'
        ||
        normalized ===
            'не выбран'
        ||
        normalized ===
            'не выбрано.'
    );
}


function setLoading(
    loading
) {

    const button =
        document.getElementById(
            'saveButton'
        );


    button.disabled =
        loading;


    button.textContent =
        loading
        ?
        'Сохраняю...'
        :
        'Сохранить результат';
}


function showError(
    text
) {

    const message =
        document.getElementById(
            'message'
        );


    message.className =
        'message error';


    message.textContent =
        text;
}


function showSuccess(
    text
) {

    const message =
        document.getElementById(
            'message'
        );


    message.className =
        'message success';


    message.textContent =
        text;
}

</script>
