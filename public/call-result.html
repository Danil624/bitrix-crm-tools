/*
 * =========================================================
 * БЛОКИРУЕМ АВТОЗАКРЫТИЕ КАРТОЧКИ
 * =========================================================
 */

function blockAutoClose() {

    try {

        BX24.placement.call(
            'disableAutoClose',
            {},
            function () {

                console.log(
                    'Автозакрытие карточки звонка заблокировано'
                );
            }
        );

    } catch (e) {

        console.warn(
            'disableAutoClose недоступен:',
            e
        );
    }
}


function startAutoCloseGuard() {

    allowAutoClose =
        false;

    blockAutoClose();


    if (keepAliveTimer) {
        return;
    }


    keepAliveTimer =
        setInterval(
            function () {

                if (!allowAutoClose) {

                    blockAutoClose();
                }

            },
            10000
        );
}


function releaseAutoClose() {

    allowAutoClose =
        true;


    if (keepAliveTimer) {

        clearInterval(
            keepAliveTimer
        );

        keepAliveTimer =
            null;
    }


    try {

        BX24.placement.call(
            'enableAutoClose',
            {},
            function () {

                console.log(
                    'Автозакрытие карточки звонка снова разрешено'
                );
            }
        );

    } catch (e) {

        console.warn(
            'enableAutoClose недоступен:',
            e
        );
    }
}


/*
 * =========================================================
 * ИЩЕМ ПОЛЕ "РЕЗУЛЬТАТ ЗВОНКА"
 * =========================================================
 */

function loadCallResultField() {

    if (
        callResultFieldCode
    ) {

        updateSaveAvailability();

        return;
    }


    findCallResultField(
        0
    );
}


function findCallResultField(
    start
) {

    BX24.callMethod(
        'crm.deal.userfield.list',

        {
            order: {

                SORT:
                    'ASC',

                ID:
                    'ASC'
            },

            filter: {

                USER_TYPE_ID:
                    'enumeration',

                LANG:
                    'ru'
            },

            start:
                start
        },

        function (result) {

            if (result.error()) {

                showError(
                    'Не удалось получить пользовательские поля сделки: ' +
                    result.error_description()
                );

                return;
            }


            const fields =
                result.data() || [];


            const target =
                fields.find(
                    function (field) {

                        return isCallResultField(
                            field
                        );
                    }
                );


            if (target) {

                callResultFieldCode =
                    String(
                        target.FIELD_NAME || ''
                    );


                callResultFieldId =
                    normalizePositiveId(
                        target.ID
                    );


                console.log(
                    'Поле результата звонка найдено:',
                    target
                );


                if (
                    Array.isArray(
                        target.LIST
                    )
                    &&
                    target.LIST.length
                ) {

                    fillResultOptions(
                        target.LIST
                    );

                    return;
                }


                loadCallResultFieldById();

                return;
            }


            if (
                typeof result.more ===
                'function'
                &&
                result.more()
            ) {

                const next =
                    result.next();


                if (
                    next !== false
                    &&
                    next !== null
                    &&
                    next !== undefined
                ) {

                    findCallResultField(
                        Number(next)
                    );

                    return;
                }
            }


            showError(
                'Не найдено поле списка «' +
                CALL_RESULT_FIELD_TITLE +
                '». Проверьте точное название поля.'
            );
        }
    );
}


/*
 * =========================================================
 * ПРОВЕРЯЕМ НАЗВАНИЕ ПОЛЯ
 * =========================================================
 */

function isCallResultField(
    field
) {

    const expected =
        normalizeText(
            CALL_RESULT_FIELD_TITLE
        );


    const labels = [

        field.EDIT_FORM_LABEL,
        field.LIST_COLUMN_LABEL,
        field.LIST_FILTER_LABEL,
        field.LABEL,
        field.TITLE

    ];


    return labels.some(
        function (label) {

            if (
                label
                &&
                typeof label ===
                'object'
            ) {

                label =
                    label.ru || '';
            }


            return (
                normalizeText(
                    label
                )
                ===
                expected
            );
        }
    );
}


/*
 * =========================================================
 * ПОЛУЧАЕМ ВАРИАНТЫ ПОЛЯ
 * =========================================================
 */

function loadCallResultFieldById() {

    if (!callResultFieldId) {

        loadCallResultOptionsFallback();

        return;
    }


    BX24.callMethod(
        'crm.deal.userfield.get',

        {
            id:
                callResultFieldId
        },

        function (result) {

            if (result.error()) {

                loadCallResultOptionsFallback();

                return;
            }


            const field =
                result.data() || {};


            if (
                Array.isArray(
                    field.LIST
                )
                &&
                field.LIST.length
            ) {

                fillResultOptions(
                    field.LIST
                );

                return;
            }


            loadCallResultOptionsFallback();
        }
    );
}


/*
 * =========================================================
 * РЕЗЕРВНО ПОЛУЧАЕМ ENUM ИЗ crm.deal.fields
 * =========================================================
 */

function loadCallResultOptionsFallback() {

    BX24.callMethod(
        'crm.deal.fields',
        {},

        function (result) {

            if (result.error()) {

                showError(
                    'Поле найдено, но не удалось получить варианты списка.'
                );

                return;
            }


            const fields =
                result.data() || {};


            const field =
                fields[
                    callResultFieldCode
                ];


            if (!field) {

                showError(
                    'Поле «Результат звонка» найдено, но его описание недоступно.'
                );

                return;
            }


            const options =
                Array.isArray(
                    field.items
                )
                ?
                field.items
                :
                (
                    Array.isArray(
                        field.LIST
                    )
                    ?
                    field.LIST
                    :
                    []
                );


            if (!options.length) {

                showError(
                    'Не удалось получить варианты поля «Результат звонка».'
                );

                return;
            }


            fillResultOptions(
                options
            );
        }
    );
}


/*
 * =========================================================
 * ЗАПОЛНЯЕМ СПИСОК РЕЗУЛЬТАТОВ
 * =========================================================
 */

function fillResultOptions(
    items
) {

    const select =
        document.getElementById(
            'callResult'
        );


    select.innerHTML =
        '';


    const placeholder =
        document.createElement(
            'option'
        );


    placeholder.value =
        '';

    placeholder.textContent =
        'Выберите результат';


    select.appendChild(
        placeholder
    );


    items.forEach(
        function (item) {

            const value =
                String(
                    item.VALUE
                    ??
                    item.value
                    ??
                    ''
                )
                .trim();


            const id =
                String(
                    item.ID
                    ??
                    item.id
                    ??
                    ''
                )
                .trim();


            if (
                !value
                ||
                !id
            ) {
                return;
            }


            /*
             * "не выбрано" в форме
             * специально не показываем.
             */

            if (
                isEmptyResultValue(
                    value
                )
            ) {
                return;
            }


            const option =
                document.createElement(
                    'option'
                );


            option.value =
                id;

            option.textContent =
                value;


            select.appendChild(
                option
            );
        }
    );


    if (
        select.options.length <= 1
    ) {

        showError(
            'У поля «Результат звонка» нет доступных вариантов.'
        );

        return;
    }


    resultOptionsLoaded =
        true;

    syncResultSelectState();

    updateSaveAvailability();
}


/*
 * =========================================================
 * ЗАМЕНЯЕМ СТАНДАРТНУЮ КАРТОЧКУ ЗВОНКА
 * НА НАШУ КОНФИГУРИРУЕМУЮ КАРТОЧКУ
 * =========================================================
 */

function bxCallPromise(
    method,
    params = {}
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            BX24.callMethod(
                method,
                params,

                function (result) {

                    if (result.error()) {

                        reject(
                            new Error(
                                result.error() +
                                ': ' +
                                result.error_description()
                            )
                        );

                        return;
                    }


                    resolve(
                        result.data()
                    );
                }
            );
        }
    );
}


function waitMs(
    ms
) {

    return new Promise(
        function (resolve) {

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


async function waitForCrmActivityId(
    timeoutMs = 5000
) {

    const startedAt =
        Date.now();


    while (
        !crmActivityId
        &&
        Date.now() - startedAt < timeoutMs
    ) {

        refreshCallStatus();

        await waitMs(
            300
        );
    }


    return normalizePositiveId(
        crmActivityId
    );
}


function formatCallDuration(
    startTime,
    endTime
) {

    const start =
        new Date(
            startTime || ''
        ).getTime();


    const end =
        new Date(
            endTime || ''
        ).getTime();


    if (
        !Number.isFinite(start)
        ||
        !Number.isFinite(end)
        ||
        end <= start
    ) {

        return '—';
    }


    const totalSeconds =
        Math.max(
            0,
            Math.round(
                (end - start) / 1000
            )
        );


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    if (!minutes) {

        return seconds + ' сек';
    }


    return (
        minutes +
        ' мин ' +
        String(seconds).padStart(2, '0') +
        ' сек'
    );
}


function formatCallDate(
    value
) {

    const date =
        new Date(
            value || ''
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return '—';
    }


    return date.toLocaleString(
        'ru-RU'
    );
}


function getCallResultTagType(
    resultText
) {

    const normalized =
        normalizeText(
            resultText
        );


    if (
        normalized.includes('отказ')
        ||
        normalized.includes('ошибоч')
    ) {

        return 'warning';
    }


    return 'primary';
}


function formatCallDurationSeconds(
    value
) {

    const totalSeconds =
        Math.max(
            0,
            Number(value || 0)
        );


    if (!Number.isFinite(totalSeconds)) {
        return '—';
    }


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        Math.round(
            totalSeconds % 60
        );


    if (!minutes) {
        return seconds + ' сек';
    }


    return (
        minutes +
        ' мин ' +
        String(seconds).padStart(2, '0') +
        ' сек'
    );
}


async function getCallStatistic(
    originalActivityId = 0
) {

    const filter = {};


    if (callId) {

        filter.CALL_ID =
            callId;

    } else if (originalActivityId) {

        filter.CRM_ACTIVITY_ID =
            originalActivityId;

    } else {

        return null;
    }


    /*
     * Запись разговора иногда появляется
     * не мгновенно после завершения звонка.
     * Несколько секунд ждём статистику телефонии.
     */

    for (
        let attempt = 0;
        attempt < 10;
        attempt++
    ) {

        try {

            const rows =
                await bxCallPromise(
                    'voximplant.statistic.get',
                    {
                        FILTER:
                            filter,

                        SORT:
                            'ID',

                        ORDER:
                            'DESC'
                    }
                );


            const items =
                Array.isArray(rows)
                ?
                rows
                :
                [];


            if (items.length) {

                const row =
                    items[0] || {};


                if (
                    row.CALL_RECORD_URL
                    ||
                    attempt === 9
                ) {

                    return row;
                }
            }

        } catch (error) {

            console.warn(
                'Не удалось получить статистику звонка. ' +
                'Для плеера приложению нужен доступ к телефонии:',
                error
            );

            return null;
        }


        await waitMs(
            500
        );
    }


    return null;
}


function getCallBodyLogoCode(
    directionTitle
) {

    if (
        directionTitle ===
        'Входящий звонок'
    ) {

        return 'call-incoming';
    }


    if (
        directionTitle ===
        'Исходящий звонок'
    ) {

        return 'call-outgoing';
    }


    if (
        directionTitle ===
        'Обратный звонок'
    ) {

        return 'call-incoming';
    }


    return 'call-incoming';
}


async function deleteStandardCallActivity(
    activityId
) {

    activityId =
        normalizePositiveId(
            activityId
        );

    if (!activityId) {
        return false;
    }


    for (
        let attempt = 1;
        attempt <= 5;
        attempt++
    ) {

        try {

            await bxCallPromise(
                'crm.activity.delete',
                {
                    id:
                        activityId
                }
            );

            console.log(
                'Стандартное дело звонка удалено:',
                activityId
            );

            return true;

        } catch (error) {

            console.warn(
                'Попытка удалить стандартное дело #' +
                activityId +
                ' (' + attempt + '/5):',
                error
            );

            if (attempt < 5) {
                await waitMs(500);
            }
        }
    }


    return false;
}


async function replaceStandardCallWithCustomCard(
    resultText,
    callComment = ''
) {

    if (!dealId) {

        throw new Error(
            'Не определена сделка.'
        );
    }


    /*
     * CRM_ACTIVITY_ID стандартного звонка может появиться
     * с задержкой или вообще не попасть в CALL_CARD.
     * Поэтому наличие стандартного дела НЕ является
     * обязательным условием для создания нашей карточки.
     */

    let originalActivityId =
        await waitForCrmActivityId(
            5000
        );


    /*
     * Иногда CALL_CARD не отдаёт CRM_ACTIVITY_ID,
     * хотя стандартное дело звонка уже создано.
     * В таком случае берём его из статистики телефонии
     * по текущему CALL_ID.
     */
    const callStatistic =
        await getCallStatistic(
            originalActivityId
        );


    if (!originalActivityId) {

        originalActivityId =
            normalizePositiveId(
                callStatistic?.CRM_ACTIVITY_ID
            );

        if (originalActivityId) {

            crmActivityId =
                originalActivityId;

            console.log(
                'CRM_ACTIVITY_ID найден через voximplant.statistic.get:',
                originalActivityId
            );
        }
    }


    let activity = {};


    if (originalActivityId) {

        try {

            activity =
                await bxCallPromise(
                    'crm.activity.get',
                    {
                        id:
                            originalActivityId
                    }
                ) || {};

        } catch (error) {

            console.warn(
                'Не удалось получить стандартное дело звонка:',
                error
            );

            activity = {};
        }
    }


    const recordUrl =
        String(
            callStatistic?.CALL_RECORD_URL || ''
        ).trim();


    const deal =
        await bxCallPromise(
            'crm.deal.get',
            {
                id:
                    dealId
            }
        );


    const hasDirection =
        activity.DIRECTION !== undefined
        &&
        activity.DIRECTION !== null
        &&
        String(activity.DIRECTION) !== '';


    const incoming =
        hasDirection
        ?
        String(
            activity.DIRECTION
        ) === '1'
        :
        false;


    let directionTitle =
        hasDirection
        ?
        (
            incoming
            ?
            'Входящий звонок'
            :
            'Исходящий звонок'
        )
        :
        'Звонок';


    const callType =
        String(
            callStatistic?.CALL_TYPE || ''
        );


    if (callType === '1') {
        directionTitle =
            'Исходящий звонок';
    } else if (
        callType === '2'
        ||
        callType === '3'
    ) {
        directionTitle =
            'Входящий звонок';
    } else if (callType === '4') {
        directionTitle =
            'Обратный звонок';
    }


    const completedDirectionTitle =
        directionTitle === 'Исходящий звонок'
        ? 'Завершён исходящий звонок'
        : directionTitle === 'Входящий звонок'
        ? 'Завершён входящий звонок'
        : directionTitle === 'Обратный звонок'
        ? 'Завершён обратный звонок'
        : 'Завершён звонок';


    const callLogoCode =
        getCallBodyLogoCode(
            directionTitle
        );


    const clientTitle =
        String(
            deal.TITLE ||
            ('Сделка #' + dealId)
        );


    const phone =
        String(
            phoneNumber || '—'
        );


    const callDate =
        formatCallDate(
            callStatistic?.CALL_START_DATE ||
            activity.START_TIME ||
            activity.CREATED ||
            new Date().toISOString()
        );


    const duration =
        callStatistic?.CALL_DURATION !== undefined
        &&
        callStatistic?.CALL_DURATION !== null
        ?
        formatCallDurationSeconds(
            callStatistic.CALL_DURATION
        )
        :
        (
            activity.START_TIME
            &&
            activity.END_TIME
        )
        ?
        formatCallDuration(
            activity.START_TIME,
            activity.END_TIME
        )
        :
        '—';


    const responsibleId =
        normalizePositiveId(
            activity.RESPONSIBLE_ID ||
            deal.ASSIGNED_BY_ID
        );


    const originToken =
        originalActivityId
        ||
        callId
        ||
        Date.now();


    const fields = {

        /*
         * typeId специально НЕ задаём.
         * Тогда Bitrix24 использует стандартный
         * тип CONFIGURABLE для приложения.
         */

        completed:
            true,

        isIncomingChannel:
            incoming,

        originatorId:
            'CALL_RESULT_APP',

        originId:
            'CALL_' +
            originToken
    };


    if (responsibleId) {

        fields.responsibleId =
            responsibleId;
    }


    const blocks = {

        client: {

            type:
                'withTitle',

            properties: {

                title:
                    'Клиент',

                inline:
                    true,

                block: {

                    type:
                        'link',

                    properties: {

                        text:
                            clientTitle,

                        bold:
                            true,

                        action: {

                            type:
                                'redirect',

                            uri:
                                '/crm/deal/details/' +
                                dealId +
                                '/'
                        }
                    }
                }
            }
        }
    };


    if (callComment) {

        blocks.comment = {

            type:
                'withTitle',

            properties: {

                title:
                    'Комментарий',

                inline:
                    false,

                block: {

                    type:
                        'text',

                    properties: {

                        value:
                            callComment,

                        multiline:
                            true
                    }
                }
            }
        };
    }


    if (recordUrl) {

        blocks.recording = {

            type:
                'link',

            properties: {

                text:
                    '▶',

                bold:
                    true,

                action: {

                    type:
                        'redirect',

                    uri:
                        recordUrl
                }
            }
        };
    }


    const customActivity =
        await bxCallPromise(
            'crm.activity.configurable.add',
            {
                ownerTypeId:
                    2,

                ownerId:
                    dealId,

                fields:
                    fields,

                layout: {

                    icon: {
                        code:
                            'call-completed'
                    },

                    header: {

                        title:
                            completedDirectionTitle
                    },

                    body: {

                        logo: {
                            code:
                                callLogoCode
                        },

                        blocks:
                            blocks
                    },

                    footer: {

                        buttons: {

                            testDrive: {

                                title:
                                    'Создать тест-драйв',

                                type:
                                    'primary',

                                action: {

                                    type:
                                        'openRestApp',

                                    actionParams: {

                                        mode:
                                            'create_testdrive',

                                        ID:
                                            dealId,

                                        dealId:
                                            dealId,

                                        entityId:
                                            dealId
                                    },

                                    sliderParams: {

                                        title:
                                            'Тест-драйв',

                                        width:
                                            760
                                    }
                                }
                            },

                            commercial: {

                                title:
                                    'Создать КП',

                                type:
                                    'secondary',

                                action: {

                                    type:
                                        'openRestApp',

                                    actionParams: {

                                        mode:
                                            'create_commercial',

                                        ID:
                                            dealId,

                                        dealId:
                                            dealId,

                                        entityId:
                                            dealId
                                    },

                                    sliderParams: {

                                        title:
                                            'КП',

                                        width:
                                            760
                                    }
                                }
                            }
                        }
                    }
                }
            }
        );


    const customActivityId =
        normalizePositiveId(
            customActivity?.activity?.id
        );


    if (!customActivityId) {

        throw new Error(
            'Bitrix24 не вернул ID новой карточки звонка.'
        );
    }


    /*
     * Дополнительно убеждаемся, что карточка реально
     * существует в Bitrix24, и только после этого
     * пробуем удалить стандартный звонок.
     */

    await bxCallPromise(
        'crm.activity.configurable.get',
        {
            id:
                customActivityId
        }
    );


    const standardDeleted =
        await deleteStandardCallActivity(
            originalActivityId
        );


    if (
        originalActivityId
        &&
        !standardDeleted
    ) {

        console.warn(
            'Кастомная карточка создана, но стандартный звонок не удалось удалить:',
            originalActivityId
        );
    }


    if (standardDeleted) {

        crmActivityId =
            0;
    }


    return {

        customActivityId:
            customActivityId,

        deletedActivityId:
            standardDeleted
            ?
            originalActivityId
            :
            0
    };
}

/*

 * СОХРАНЯЕМ РЕЗУЛЬТАТ В СОЗДАННУЮ СДЕЛКУ
 * =========================================================

function saveCallResult() {

    if (
        currentCallState !==
        'idle'
    ) {

        showError(
            'Результат можно сохранить после завершения звонка.'
        );

        return;
    }


    if (!dealId) {

        showError(
            'Сделка ещё не создана. Подождите несколько секунд.'
        );

        refreshCallStatus();

        return;
    }


    if (!callResultFieldCode) {

        showError(
            'Не удалось определить поле «Результат звонка».'
        );

        return;
    }


    const select =
        document.getElementById(
            'callResult'
        );


    const enumId =
        String(
            select.value || ''
        );


    if (!enumId) {

        showError(
            'Выберите результат звонка.'
        );

        return;
    }


    const selectedText =
        select.options[
            select.selectedIndex
        ]
        ?
        select.options[
            select.selectedIndex
        ].textContent
        :
        '';


    if (
        isEmptyResultValue(
            selectedText
        )
    ) {

        showError(
            'Выберите результат звонка.'
        );

        return;
    }


    const callComment =
        '';


    setLoading(
        true
    );


    const fields = {};


    fields[
        callResultFieldCode
    ] =
        enumId;


    BX24.callMethod(
        'crm.deal.update',

        {
            id:
                dealId,

            fields:
                fields
        },

        function (result) {

            if (result.error()) {

                setLoading(
                    false
                );


                showError(
                    'Не удалось сохранить результат звонка: ' +
                    result.error_description()
                );

                return;
            }


            /*
             * После сохранения результата
             * ставим правильную стадию сделки.
             *
             * Это заодно перекрывает ситуацию,
             * когда Битрикс сам успел увести
             * новую сделку в "Отказ от покупки".
             */

            setDealStageByCallResult(
                selectedText,

                function (
                    stageName,
                    stageWarning
                ) {

                    resultSaved =
                        true;

                    resultModeEnabled =
                        false;


                    /*
                     * Автозакрытие пока НЕ разрешаем:
                     * сначала должна создаться и провериться
                     * кастомная карточка звонка.
                     */
                    syncResultSelectState();


                    setLoading(
                        false
                    );


                    document.getElementById(
                        'saveButton'
                    ).disabled =
                        true;


                    let successText =
                        'Результат сохранён в сделке #' +
                        dealId +
                        ': ' +
                        selectedText;


                    if (stageName) {

                        successText +=
                            '. Стадия: «' +
                            stageName +
                            '»';
                    }


                    if (stageWarning) {

                        successText +=
                            '. ' +
                            stageWarning;
                    }


                    /*
                     * После сохранения результата
                     * заменяем стандартную карточку звонка
                     * на нашу конфигурируемую карточку.
                     *
                     * Стандартное дело удаляем ТОЛЬКО
                     * после успешного создания нашей карточки.
                     */

                    replaceStandardCallWithCustomCard(
                        selectedText,
                        callComment
                    )
                        .then(
                            function () {

                                showSuccess(
                                    successText +
                                    '. Карточка звонка обновлена.'
                                );


                                releaseAutoClose();
                            }
                        )
                        .catch(
                            function (error) {

                                console.error(
                                    'Ошибка замены карточки звонка:',
                                    error
                                );


                                showSuccess(
                                    successText +
                                    '. Не удалось создать новую карточку звонка: ' +
                                    error.message
                                );


                                releaseAutoClose();
                            }
                        );
                }
            );
        }
    );
}


/*
 * =========================================================
 * СТАДИЯ СДЕЛКИ ПО РЕЗУЛЬТАТУ ЗВОНКА
 * =========================================================
 *
 * Логика:
 *
 * Дозвонился...       -> В работе
 * Отказ               -> Отказ от покупки
 * Ошибочный номер     -> Ошибочный клиент
 * Любой другой итог   -> Новый
 *
 * ВАЖНО:
 * "Не дозвонился" содержит слово "дозвонился",
 * поэтому сначала проверяем исключения, а уже потом
 * обычный "Дозвонился".
 */

function setDealStageByCallResult(
    resultText,
    callback
) {

    const normalized =
        normalizeCallResultForRouting(
            resultText
        );


    let targetStageName =
        'Новый';


    /*
     * 1. Ошибочный номер -> "Ошибочный клиент"
     */

    if (
        normalized.includes(
            'ошибоч'
        )
    ) {

        targetStageName =
            'Ошибочный клиент';

    /*
     * 2. Отказ -> "Отказ от покупки"
     */

    } else if (
        normalized === 'отказ'
        ||
        normalized.includes(
            'отказ от покупки'
        )
    ) {

        targetStageName =
            'Отказ от покупки';

    /*
     * 3. "Дозвонился..." -> "В работе"
     *
     * При этом "Не дозвонился" сюда попасть не должен.
     */

    } else if (
        !normalized.includes(
            'не дозвонился'
        )
        &&
        (
            normalized === 'дозвонился'
            ||
            normalized.startsWith(
                'дозвонился '
            )
            ||
            normalized.includes(
                'дозвонился есть интерес'
            )
        )
    ) {

        targetStageName =
            'В работе';

    /*
     * 4. Всё остальное -> "Новый"
     *
     * Например:
     * - Не дозвонился
     * - Перезвонить позже
     * - Назначена встреча
     * - Другое
     */
    } else {

        targetStageName =
            'Новый';
    }


    BX24.callMethod(
        'crm.status.list',

        {
            filter: {
                ENTITY_ID:
                    getDealStageEntityId()
            }
        },

        function (result) {

            if (result.error()) {

                console.warn(
                    'Не удалось получить стадии сделок:',
                    result.error(),
                    result.error_description()
                );


                callback(
                    '',
                    'Не удалось изменить стадию.'
                );

                return;
            }


            const statuses =
                result.data() || [];


            const target =
                statuses.find(
                    function (status) {

                        return (
                            normalizeText(
                                status.NAME
                            )
                            ===
                            normalizeText(
                                targetStageName
                            )
                        );
                    }
                );


            if (!target) {

                console.warn(
                    'Не найдена стадия:',
                    targetStageName
                );


                callback(
                    '',
                    'Стадия «' +
                    targetStageName +
                    '» не найдена.'
                );

                return;
            }


            const statusId =
                String(
                    target.STATUS_ID || ''
                );


            if (!statusId) {

                callback(
                    '',
                    'У стадии «' +
                    targetStageName +
                    '» нет STATUS_ID.'
                );

                return;
            }


            updateDealStageAndVerify(
                statusId,
                targetStageName,
                callback
            );
        }
    );
}


/*
 * =========================================================
 * СТАВИМ СТАДИЮ И ПРОВЕРЯЕМ, ЧТО ОНА НЕ УЛЕТЕЛА ОБРАТНО
 * =========================================================
 */

function updateDealStageAndVerify(
    statusId,
    stageName,
    callback
) {

    BX24.callMethod(
        'crm.deal.update',

        {
            id:
                dealId,

            fields: {
                STAGE_ID:
                    statusId
            }
        },

        function (updateResult) {

            if (updateResult.error()) {

                console.warn(
                    'Ошибка смены стадии:',
                    updateResult.error(),
                    updateResult.error_description()
                );


                callback(
                    '',
                    'Не удалось поставить стадию «' +
                    stageName +
                    '».'
                );

                return;
            }


            /*
             * Через небольшую паузу проверяем:
             * если внешний механизм Битрикса
             * снова перекинул сделку в "Отказ",
             * возвращаем нужную стадию ещё раз.
             */

            setTimeout(
                function () {

                    BX24.callMethod(
                        'crm.deal.get',

                        {
                            id:
                                dealId
                        },

                        function (getResult) {

                            if (getResult.error()) {

                                callback(
                                    stageName,
                                    ''
                                );

                                return;
                            }


                            const dealData =
                                getResult.data() || {};


                            const currentStatusId =
                                String(
                                    dealData.STAGE_ID || ''
                                );


                            if (
                                currentStatusId ===
                                String(statusId)
                            ) {

                                callback(
                                    stageName,
                                    ''
                                );

                                return;
                            }


                            console.warn(
                                'Стадия была изменена после сохранения.',
                                'Ожидалась:',
                                statusId,
                                'Фактически:',
                                currentStatusId
                            );


                            /*
                             * Одна повторная попытка.
                             * В бесконечный цикл не уходим.
                             */

                            BX24.callMethod(
                                'crm.deal.update',

                                {
                                    id:
                                        dealId,

                                    fields: {
                                        STAGE_ID:
                                            statusId
                                    }
                                },

                                function (
                                    retryResult
                                ) {

                                    if (
                                        retryResult.error()
                                    ) {

                                        callback(
                                            stageName,
                                            'Внешняя автоматизация снова изменила стадию.'
                                        );

                                        return;
                                    }


                                    callback(
                                        stageName,
                                        'Стадия была автоматически изменена Битрикс24 и возвращена приложением.'
                                    );
                                }
                            );
                        }
                    );
                },
                1200
            );
        }
    );
}


/*
 * =========================================================
 * НОРМАЛИЗАЦИЯ РЕЗУЛЬТАТА ДЛЯ МАРШРУТИЗАЦИИ
 * =========================================================
 */

function normalizeCallResultForRouting(
    value
) {

    return String(
        value || ''
    )
    .trim()
    .toLowerCase()
    .replace(
        /ё/g,
        'е'
    )
    .replace(
        /[—–-]+/g,
        ' '
    )
    .replace(
        /\s+/g,
        ' '
    );
}

 * ДОСТУПНОСТЬ КНОПКИ
 * =========================================================
 */

function syncResultSelectState() {

    const select =
        document.getElementById(
            'callResult'
        );


    if (!select) {
        return;
    }


    select.disabled =
        !(
            resultOptionsLoaded
            &&
            currentCallState === 'idle'
            &&
            dealId > 0
            &&
            !resultSaved
        );
}


function updateSaveAvailability() {

    const button =
        document.getElementById(
            'saveButton'
        );


    const select =
        document.getElementById(
            'callResult'
        );


    button.disabled =
        !(
            currentCallState ===
                'idle'
            &&
            dealId > 0
            &&
            callResultFieldCode
            &&
            !select.disabled
            &&
            !resultSaved
        );
}

    ) {

        );
    }

function buildOriginId(
    id
) {

    return (
        'CALL_' +
        String(
            id || ''
        )
    )
    .slice(
        0,
        250
    );
}


function normalizePositiveId(
    value
) {

    const id =
        Number(
            value
        );


    return (
        Number.isFinite(id)
        &&
        id > 0
    )
    ?
    Math.trunc(id)
    :
    0;
}


function isUsablePhone(
    value
) {

    const phone =
        String(
            value || ''
        )
        .trim()
        .toLowerCase();


    return (
        phone !== ''
        &&
        phone !== 'hidden'
        &&
        phone !== 'unknown'
        &&
        phone !== 'undefined'
    );
}


function normalizeText(
    value
) {

    return String(
        value || ''
    )
    .trim()
    .toLowerCase()
    .replace(
        /\s+/g,
        ' '
    );
}


function isEmptyResultValue(
    value
) {

    const normalized =
        normalizeText(
            value
        );


    return (
        normalized ===
            'не выбрано'
        ||
        normalized ===
            'не выбран'
        ||
        normalized ===
            'не выбрано.'
    );
}


function setLoading(
    loading
) {

    const button =
        document.getElementById(
            'saveButton'
        );


    button.disabled =
        loading;


    button.textContent =
        loading
        ?
        'Сохраняю...'
        :
        'Сохранить результат';
}


function showError(
    text
) {

    const message =
        document.getElementById(
            'message'
        );


    message.className =
        'message error';


    message.textContent =
        text;
}


function showSuccess(
    text
) {

    const message =
        document.getElementById(
            'message'
        );


    message.className =
        'message success';


    message.textContent =
        text;
}
