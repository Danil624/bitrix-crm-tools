<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Тест-драйв</title>

    <script src="https://api.bitrix24.com/api/v1/"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f8;
            color: #333;
        }

        .form-card {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, .08);
        }

        .title {
            margin: 0 0 5px;
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #7a7a7a;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #c6cdd3;
            border-radius: 6px;
            background: #fff;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2fc6f6;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .responsible-row {
            display: flex;
            gap: 10px;
        }

        .responsible-row input {
            flex: 1;
        }

        .responsible-row button {
            flex: 0 0 auto;
        }

        button {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            padding: 11px 18px;
        }

        .button-select {
            background: #eef2f4;
            color: #333;
        }

        .button-select:hover {
            background: #e1e6e9;
        }

        .button-submit {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            background: #2fc6f6;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .button-submit:hover {
            background: #22b9e8;
        }

        .button-submit:disabled {
            opacity: .6;
            cursor: default;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }

        .message.success {
            display: block;
            background: #e7f7ec;
            color: #24743a;
        }

        .message.error {
            display: block;
            background: #fdeaea;
            color: #b93030;
        }

        .entity-info {
            padding: 10px 12px;
            margin-bottom: 20px;
            background: #f6f8f9;
            border-radius: 6px;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="form-card">

    <h1 class="title">
        Тест-драйв
    </h1>

    <div class="subtitle">
        Назначение тест-драйва клиенту
    </div>

    <div
        class="entity-info"
        id="entityInfo"
    >
        Загрузка данных...
    </div>

    <input
        type="hidden"
        id="entity_id"
        value="0"
    >

    <div class="form-group">
        <label for="datetime">
            Дата и время тест-драйва
        </label>

        <input
            type="datetime-local"
            id="datetime"
        >
    </div>

    <div class="form-group">
        <label for="car">
            Автомобиль
        </label>

        <input
            type="text"
            id="car"
            placeholder="Например: Chery Tiggo 7 Pro Max"
        >
    </div>

    <div class="form-group">

        <label>
            Ответственный за тест-драйв
        </label>

        <div class="responsible-row">

            <input
                type="text"
                id="responsible_name"
                placeholder="Сотрудник не выбран"
                readonly
            >

            <input
                type="hidden"
                id="responsible_id"
            >

            <button
                type="button"
                class="button-select"
                onclick="selectResponsible()"
            >
                Выбрать
            </button>

        </div>
    </div>

    <div class="form-group">

        <label for="comment">
            Комментарий
        </label>

        <textarea
            id="comment"
            placeholder="Дополнительная информация по тест-драйву"
        ></textarea>

    </div>

    <button
        id="createButton"
        class="button-submit"
        onclick="createTestDrive()"
    >
        Назначить тест-драйв
    </button>

    <div
        id="message"
        class="message"
    ></div>

</div>

<script>

const WORK_STAGE_NAME =
    'В работе';


let entityType =
    '';

let ownerTypeId =
    0;

let entityId =
    0;

let entity =
    null;


/*
 * ==============================
 * ИНИЦИАЛИЗАЦИЯ
 * ==============================
 */

BX24.init(function () {

    try {
        BX24.resizeWindow(
            750,
            720
        );
    } catch (e) {
    }


    const placementInfo =
        BX24.placement.info()
        ||
        {};


    let placementOptions =
        placementInfo.options
        ||
        {};


    if (
        typeof placementOptions ===
        'string'
    ) {

        try {

            placementOptions =
                JSON.parse(
                    placementOptions
                );

        } catch (e) {

            placementOptions =
                {};
        }
    }


    const placement =
        String(
            placementInfo.placement
            ||
            ''
        )
        .toUpperCase();


    if (
        placement.indexOf(
            'CRM_DEAL'
        ) !== -1
    ) {

        entityType =
            'DEAL';

        ownerTypeId =
            2;

    } else if (
        placement.indexOf(
            'CRM_LEAD'
        ) !== -1
    ) {

        entityType =
            'LEAD';

        ownerTypeId =
            1;

    } else {

        entityType =
            detectEntityType(
                placementOptions
            );


        ownerTypeId =
            entityType === 'DEAL'
            ?
            2
            :
            (
                entityType === 'LEAD'
                ?
                1
                :
                0
            );
    }


    entityId =
        findEntityId(
            placementOptions
        );


    document
        .getElementById(
            'entity_id'
        )
        .value =
        entityId;


    if (
        !entityId
        ||
        !ownerTypeId
    ) {

        showError(
            'Битрикс24 не передал ID текущего CRM-элемента'
        );

        document
            .getElementById(
                'createButton'
            )
            .disabled =
            true;

        return;
    }


    setDefaultDateTime();

    loadEntity();

});


/*
 * ==============================
 * ОПРЕДЕЛЯЕМ ТИП СУЩНОСТИ
 * ==============================
 */

function detectEntityType(
    obj
) {

    if (
        !obj
        ||
        typeof obj !==
        'object'
    ) {

        return '';
    }


    const typeId =
        Number(
            obj.ENTITY_TYPE_ID
            ||
            obj.entityTypeId
            ||
            obj.OWNER_TYPE_ID
            ||
            obj.ownerTypeId
            ||
            0
        );


    if (
        typeId === 2
    ) {

        return 'DEAL';
    }


    if (
        typeId === 1
    ) {

        return 'LEAD';
    }


    if (
        obj.DEAL_ID
        ||
        obj.dealId
    ) {

        return 'DEAL';
    }


    if (
        obj.LEAD_ID
        ||
        obj.leadId
    ) {

        return 'LEAD';
    }


    for (
        const key
        in obj
    ) {

        if (
            obj[key]
            &&
            typeof obj[key] ===
            'object'
        ) {

            const found =
                detectEntityType(
                    obj[key]
                );


            if (
                found
            ) {

                return found;
            }
        }
    }


    return '';
}


/*
 * ==============================
 * ИЩЕМ ID СУЩНОСТИ
 * ==============================
 */

function findEntityId(
    obj
) {

    if (
        !obj
        ||
        typeof obj !==
        'object'
    ) {

        return 0;
    }


    const directKeys = [

        'DEAL_ID',
        'dealId',

        'LEAD_ID',
        'leadId',

        'ENTITY_ID',
        'entityId',

        'OWNER_ID',
        'ownerId',

        'ID',
        'id'

    ];


    for (
        const key
        of directKeys
    ) {

        const value =
            Number(
                obj[key]
                ||
                0
            );


        if (
            Number.isFinite(
                value
            )
            &&
            value > 0
        ) {

            return Math.trunc(
                value
            );
        }
    }


    for (
        const key
        in obj
    ) {

        if (
            obj[key]
            &&
            typeof obj[key] ===
            'object'
        ) {

            const found =
                findEntityId(
                    obj[key]
                );


            if (
                found
            ) {

                return found;
            }
        }
    }


    return 0;
}


/*
 * ==============================
 * ДАТА ПО УМОЛЧАНИЮ
 * ==============================
 */

function setDefaultDateTime() {

    const date =
        new Date();


    date.setHours(
        date.getHours() + 1
    );

    date.setMinutes(
        0
    );

    date.setSeconds(
        0
    );

    date.setMilliseconds(
        0
    );


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        )
        .padStart(
            2,
            '0'
        );


    const day =
        String(
            date.getDate()
        )
        .padStart(
            2,
            '0'
        );


    const hours =
        String(
            date.getHours()
        )
        .padStart(
            2,
            '0'
        );


    const minutes =
        String(
            date.getMinutes()
        )
        .padStart(
            2,
            '0'
        );


    document
        .getElementById(
            'datetime'
        )
        .value =
        `${year}-${month}-${day}T${hours}:${minutes}`;
}


/*
 * ==============================
 * ПОЛУЧАЕМ CRM-ЭЛЕМЕНТ
 * ==============================
 */

function loadEntity() {

    const method =
        entityType === 'DEAL'
        ?
        'crm.deal.get'
        :
        'crm.lead.get';


    BX24.callMethod(

        method,

        {
            id:
                entityId
        },

        function (
            result
        ) {

            if (
                result.error()
            ) {

                showError(
                    'Не удалось получить '
                    +
                    (
                        entityType === 'DEAL'
                        ?
                        'сделку'
                        :
                        'лид'
                    )
                    +
                    ': '
                    +
                    result.error_description()
                );

                return;
            }


            entity =
                result.data()
                ||
                {};


            const fallbackTitle =
                entityType === 'DEAL'
                ?
                'Сделка #' + entityId
                :
                'Лид #' + entityId;


            const title =
                entity.TITLE
                ||
                fallbackTitle;


            document
                .getElementById(
                    'entityInfo'
                )
                .textContent =
                (
                    entityType === 'DEAL'
                    ?
                    'Сделка: '
                    :
                    'Лид: '
                )
                +
                title;


            /*
             * По умолчанию ставим ответственным
             * ответственного за текущий CRM-элемент.
             */

            const assignedById =
                Number(
                    entity.ASSIGNED_BY_ID
                    ||
                    0
                );


            if (
                assignedById
            ) {

                document
                    .getElementById(
                        'responsible_id'
                    )
                    .value =
                    assignedById;


                loadResponsibleName(
                    assignedById
                );
            }
        }
    );
}


/*
 * ==============================
 * ЗАГРУЖАЕМ ИМЯ ОТВЕТСТВЕННОГО
 * ==============================
 */

function loadResponsibleName(
    userId
) {

    BX24.callMethod(

        'user.get',

        {
            ID:
                userId
        },

        function (
            result
        ) {

            const entityName =
                entityType === 'DEAL'
                ?
                'сделку'
                :
                'лид';


            if (
                result.error()
            ) {

                document
                    .getElementById(
                        'responsible_name'
                    )
                    .value =
                    'Ответственный за '
                    +
                    entityName
                    +
                    ' (ID '
                    +
                    userId
                    +
                    ')';


                console.warn(
                    'Не удалось получить имя ответственного:',
                    result.error(),
                    result.error_description()
                );

                return;
            }


            const users =
                result.data();


            if (
                !Array.isArray(
                    users
                )
                ||
                users.length === 0
            ) {

                document
                    .getElementById(
                        'responsible_name'
                    )
                    .value =
                    'Ответственный за '
                    +
                    entityName
                    +
                    ' (ID '
                    +
                    userId
                    +
                    ')';

                return;
            }


            const user =
                users[0];


            const fullName =
                [
                    user.NAME,
                    user.LAST_NAME
                ]
                .filter(
                    Boolean
                )
                .join(
                    ' '
                )
                .trim();


            document
                .getElementById(
                    'responsible_name'
                )
                .value =
                fullName
                ||
                (
                    'Ответственный за '
                    +
                    entityName
                    +
                    ' (ID '
                    +
                    userId
                    +
                    ')'
                );
        }
    );
}


/*
 * ==============================
 * РОДНОЙ ВЫБОР СОТРУДНИКА
 * БИТРИКС24
 * ==============================
 */

function selectResponsible() {

    BX24.selectUser(
        function (
            user
        ) {

            if (
                !user
            ) {

                return;
            }


            document
                .getElementById(
                    'responsible_id'
                )
                .value =
                user.id;


            document
                .getElementById(
                    'responsible_name'
                )
                .value =
                user.name;
        }
    );
}


/*
 * ==============================
 * ПАРАМЕТРЫ КНОПКИ РЕЗУЛЬТАТА
 * ==============================
 */

function buildResultActionParams(
    result,
    car,
    start,
    responsibleId,
    responsibleName
) {

    const params = {

        mode:
            'testdrive_result',

        result:
            result,

        entityType:
            entityType,

        entityId:
            entityId,

        car:
            car,

        date:
            formatDateTime(
                start
            ),

        responsibleId:
            responsibleId,

        responsibleName:
            responsibleName
    };


    /*
     * Оставляем старый leadId для совместимости,
     * пока весь проект переводится на сделки.
     */

    if (
        entityType === 'DEAL'
    ) {

        params.dealId =
            entityId;

    } else {

        params.leadId =
            entityId;
    }


    return params;
}


/*
 * ==============================
 * СОЗДАНИЕ ТЕСТ-ДРАЙВА
 * ==============================
 */

function createTestDrive() {

    entityId =
        Number(
            document
                .getElementById(
                    'entity_id'
                )
                .value
            ||
            0
        );


    const datetimeValue =
        document
            .getElementById(
                'datetime'
            )
            .value;


    const car =
        document
            .getElementById(
                'car'
            )
            .value
            .trim();


    const responsibleId =
        Number(
            document
                .getElementById(
                    'responsible_id'
                )
                .value
            ||
            0
        );


    const responsibleName =
        document
            .getElementById(
                'responsible_name'
            )
            .value
            .trim();


    const comment =
        document
            .getElementById(
                'comment'
            )
            .value
            .trim();


    if (
        !entityId
    ) {

        showError(
            'Не определён CRM-элемент'
        );

        return;
    }


    if (
        !datetimeValue
    ) {

        showError(
            'Укажите дату и время тест-драйва'
        );

        return;
    }


    if (
        !car
    ) {

        showError(
            'Укажите автомобиль'
        );

        return;
    }


    if (
        !responsibleId
    ) {

        showError(
            'Выберите ответственного за тест-драйв'
        );

        return;
    }


    const start =
        new Date(
            datetimeValue
        );


    if (
        Number.isNaN(
            start.getTime()
        )
    ) {

        showError(
            'Некорректная дата тест-драйва'
        );

        return;
    }


    setLoading(
        true
    );


    const blocks = {

        date: {

            type:
                'withTitle',

            properties: {

                title:
                    'Дата и время',

                inline:
                    true,

                block: {

                    type:
                        'text',

                    properties: {

                        value:
                            formatDateTime(
                                start
                            )
                    }
                }
            }
        },


        car: {

            type:
                'withTitle',

            properties: {

                title:
                    'Автомобиль',

                inline:
                    true,

                block: {

                    type:
                        'text',

                    properties: {

                        value:
                            car,

                        bold:
                            true
                    }
                }
            }
        },


        responsible: {

            type:
                'withTitle',

            properties: {

                title:
                    'Ответственный',

                inline:
                    true,

                block: {

                    type:
                        'text',

                    properties: {

                        value:
                            responsibleName,

                        bold:
                            true
                    }
                }
            }
        }

    };


    if (
        comment
    ) {

        blocks.comment = {

            type:
                'withTitle',

            properties: {

                title:
                    'Комментарий',

                inline:
                    false,

                block: {

                    type:
                        'text',

                    properties: {

                        value:
                            comment,

                        multiline:
                            true
                    }
                }
            }
        };
    }


    BX24.callMethod(

        'crm.activity.configurable.add',

        {

            ownerTypeId:
                ownerTypeId,

            ownerId:
                entityId,


            fields: {

                completed:
                    false,

                deadline:
                    start.toISOString(),

                isIncomingChannel:
                    false,

                responsibleId:
                    responsibleId,

                originatorId:
                    'TEST_DRIVE_APP',

                originId:
                    'TD_'
                    +
                    entityType
                    +
                    '_'
                    +
                    entityId
                    +
                    '_'
                    +
                    Date.now()
            },


            layout: {

                icon: {

                    code:
                        'testdrive-car-icon-v1'
                },


                header: {

                    title:
                        'Тест-драйв — '
                        +
                        car
                },


                body: {

                    logo: {

                        code:
                            'testdrive-car-logo-v1'
                    },

                    blocks:
                        blocks
                },


                footer: {

                    buttons: {


                        passed: {

                            title:
                                'Тест-драйв пройден',

                            type:
                                'primary',

                            action: {

                                type:
                                    'openRestApp',

                                actionParams:
                                    buildResultActionParams(
                                        'passed',
                                        car,
                                        start,
                                        responsibleId,
                                        responsibleName
                                    ),

                                sliderParams: {

                                    title:
                                        'Результат тест-драйва',

                                    width:
                                        720
                                }
                            }
                        },


                        failed: {

                            title:
                                'Не состоялся',

                            type:
                                'secondary',

                            action: {

                                type:
                                    'openRestApp',

                                actionParams:
                                    buildResultActionParams(
                                        'failed',
                                        car,
                                        start,
                                        responsibleId,
                                        responsibleName
                                    ),

                                sliderParams: {

                                    title:
                                        'Тест-драйв не состоялся',

                                    width:
                                        650
                                }
                            }
                        }

                    }
                }
            }
        },


        function (
            result
        ) {

            if (
                result.error()
            ) {

                setLoading(
                    false
                );

                showError(
                    'Ошибка создания тест-драйва: '
                    +
                    result.error()
                    +
                    ' — '
                    +
                    result.error_description()
                );


                console.error(
                    result.error(),
                    result.error_description()
                );

                return;
            }


            console.log(
                'Тест-драйв создан:',
                result.data()
            );


            moveEntityToWork();
        }
    );
}


/*
 * ==============================
 * ПЕРЕВОДИМ В "В РАБОТЕ"
 * ==============================
 */

function moveEntityToWork() {

    if (
        entityType === 'DEAL'
    ) {

        moveDealToWork();

        return;
    }


    moveLeadToWork();
}


/*
 * ==============================
 * ЛИД → "В РАБОТЕ"
 * ==============================
 */

function moveLeadToWork() {

    BX24.callMethod(

        'crm.status.list',

        {

            order: {
                SORT:
                    'ASC'
            },

            filter: {
                ENTITY_ID:
                    'STATUS'
            }
        },


        function (
            result
        ) {

            if (
                result.error()
            ) {

                finishSuccess(
                    'Тест-драйв назначен. '
                    +
                    'Но не удалось проверить стадию лида.'
                );

                return;
            }


            const workStatus =
                findWorkStage(
                    result.data()
                );


            if (
                !workStatus
            ) {

                finishSuccess(
                    'Тест-драйв назначен. '
                    +
                    'Стадия «В работе» не найдена.'
                );

                return;
            }


            BX24.callMethod(

                'crm.lead.update',

                {

                    id:
                        entityId,

                    fields: {

                        STATUS_ID:
                            workStatus.STATUS_ID
                    }
                },


                function (
                    updateResult
                ) {

                    if (
                        updateResult.error()
                    ) {

                        finishSuccess(
                            'Тест-драйв назначен, '
                            +
                            'но стадия лида не изменилась.'
                        );

                        return;
                    }


                    finishSuccess(
                        'Тест-драйв назначен. '
                        +
                        'Лид переведён в «В работе».'
                    );
                }
            );
        }
    );
}


/*
 * ==============================
 * СДЕЛКА → "В РАБОТЕ"
 * ==============================
 */

function moveDealToWork() {

    const categoryId =
        Number(
            entity
            &&
            entity.CATEGORY_ID
            ||
            0
        );


    const statusEntityId =
        categoryId > 0
        ?
        'DEAL_STAGE_' + categoryId
        :
        'DEAL_STAGE';


    BX24.callMethod(

        'crm.status.list',

        {

            order: {
                SORT:
                    'ASC'
            },

            filter: {
                ENTITY_ID:
                    statusEntityId
            }
        },


        function (
            result
        ) {

            if (
                result.error()
            ) {

                finishSuccess(
                    'Тест-драйв назначен. '
                    +
                    'Но не удалось проверить стадию сделки.'
                );

                return;
            }


            const workStatus =
                findWorkStage(
                    result.data()
                );


            if (
                !workStatus
            ) {

                finishSuccess(
                    'Тест-драйв назначен. '
                    +
                    'В этой воронке нет стадии «В работе».'
                );

                return;
            }


            BX24.callMethod(

                'crm.deal.update',

                {

                    id:
                        entityId,

                    fields: {

                        STAGE_ID:
                            workStatus.STATUS_ID
                    }
                },


                function (
                    updateResult
                ) {

                    if (
                        updateResult.error()
                    ) {

                        finishSuccess(
                            'Тест-драйв назначен, '
                            +
                            'но стадия сделки не изменилась.'
                        );

                        return;
                    }


                    finishSuccess(
                        'Тест-драйв назначен. '
                        +
                        'Сделка переведена в «В работе».'
                    );
                }
            );
        }
    );
}


/*
 * ==============================
 * ИЩЕМ СТАДИЮ "В РАБОТЕ"
 * ==============================
 */

function findWorkStage(
    statuses
) {

    if (
        !Array.isArray(
            statuses
        )
    ) {

        return null;
    }


    return (
        statuses.find(
            function (
                status
            ) {

                return (
                    status
                    &&
                    status.NAME
                    &&
                    String(
                        status.NAME
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    WORK_STAGE_NAME
                        .trim()
                        .toLowerCase()
                );
            }
        )
        ||
        null
    );
}


/*
 * ==============================
 * УСПЕШНОЕ ЗАВЕРШЕНИЕ
 * ==============================
 */

function finishSuccess(
    text
) {

    setLoading(
        false
    );

    showSuccess(
        text
    );


    setTimeout(
        function () {

            BX24.reloadWindow(
                function () {

                    BX24.closeApplication();
                }
            );
        },
        1200
    );
}


/*
 * ==============================
 * ФОРМАТ ДАТЫ
 * ==============================
 */

function formatDateTime(
    date
) {

    return date.toLocaleString(
        'ru-RU',
        {

            day:
                '2-digit',

            month:
                '2-digit',

            year:
                'numeric',

            hour:
                '2-digit',

            minute:
                '2-digit'
        }
    );
}


/*
 * ==============================
 * ИНТЕРФЕЙС
 * ==============================
 */

function setLoading(
    loading
) {

    const button =
        document
            .getElementById(
                'createButton'
            );


    button.disabled =
        loading;


    button.textContent =
        loading
        ?
        'Создаю тест-драйв...'
        :
        'Назначить тест-драйв';
}


function showError(
    text
) {

    const message =
        document
            .getElementById(
                'message'
            );


    message.className =
        'message error';


    message.textContent =
        text;
}


function showSuccess(
    text
) {

    const message =
        document
            .getElementById(
                'message'
            );


    message.className =
        'message success';


    message.textContent =
        text;
}

</script>
