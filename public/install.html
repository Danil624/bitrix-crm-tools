<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Установка CRM-инструментов</title>
    <script src="https://api.bitrix24.com/api/v1/"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f8;
            color: #252525;
        }
        .box {
            max-width: 900px;
            margin: 0 auto;
            padding: 22px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.07);
        }
        h2 { margin: 0 0 8px; }
        .subtitle {
            margin-bottom: 18px;
            color: #777;
            font-size: 13px;
        }
        .line {
            margin: 5px 0;
            padding: 7px 9px;
            border-radius: 5px;
            background: #f6f8f9;
            word-break: break-word;
            font-size: 14px;
        }
        .ok { background: #e7f7ec; color: #24743a; }
        .warn { background: #fff7e6; color: #8a5a00; }
        .err { background: #fdeaea; color: #b93030; }
        #finishButton {
            display: none;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2fc6f6;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>Установка CRM-инструментов</h2>
    <div class="subtitle">Перенос приложения на сделки и воронку «РЛ».</div>
    <div id="status">
        <div class="line">install.php загружен. Ожидаем BX24.init...</div>
    </div>
    <button id="finishButton" type="button" onclick="finishInstall()">
        Завершить установку
    </button>
</div>

<script>
var installFinished = false;
var RL_CATEGORY_ID = 0;
var RL_CATEGORY_NAME = 'РЛ';

var REQUIRED_STAGE_NAMES = [
    'Новый',
    'Брошенный',
    'В работе',
    'Ведутся переговоры',
    'Ошибочный клиент',
    'Отказ от покупки'
];

var REQUIRED_DEAL_FIELDS = [
    {
        title: 'Результат звонка',
        fieldName: 'CRM_TOOLS_CALL_RESULT'
    },
    {
        title: 'Почему не взяли контакт клиента?',
        fieldName: 'CRM_TOOLS_NO_PHONE_REASON'
    }
];

var EXPECTED_PLACEMENTS = [
    {
        placement: 'CRM_DEAL_DETAIL_ACTIVITY',
        file: 'commercial.php',
        title: 'КП'
    },
    {
        placement: 'CRM_DEAL_DETAIL_ACTIVITY',
        file: 'testdrive.php',
        title: 'Тест-драйв'
    },
    {
        placement: 'CRM_DEAL_DETAIL_ACTIVITY',
        file: 'call-plan.php',
        title: 'Запланировать звонок'
    },
    {
        placement: 'CALL_CARD',
        file: 'call-result.php',
        title: 'Результат звонка'
    },
    {
        placement: 'CRM_DEAL_ACTIVITY_TIMELINE_MENU',
        file: 'call-complete.php',
        title: 'Завершить звонок с результатом'
    }
];

var LEGACY_LEAD_PLACEMENTS = [
    {
        placement: 'CRM_LEAD_DETAIL_ACTIVITY',
        file: 'commercial.php'
    },
    {
        placement: 'CRM_LEAD_DETAIL_ACTIVITY',
        file: 'testdrive.php'
    },
    {
        placement: 'CRM_LEAD_DETAIL_ACTIVITY',
        file: 'call-plan.php'
    },
    {
        placement: 'CRM_LEAD_ACTIVITY_TIMELINE_MENU',
        file: 'call-complete.php'
    }
];

var EXPECTED_EVENTS = [
    {
        event: 'ONCRMACTIVITYUPDATE',
        file: 'activity-guard.php'
    },
    {
        event: 'ONCRMDEALUPDATE',
        file: 'crm-phone-guard.php'
    }
];

var LEGACY_EVENTS = [
    {
        event: 'ONCRMLEADADD',
        files: ['lead-status-logger.php']
    },
    {
        event: 'ONCRMLEADUPDATE',
        files: [
            'lead-status-logger.php',
            'lead-phone-guard.php',
            'crm-phone-guard.php'
        ]
    }
];


function log(text, type) {
    var line = document.createElement('div');
    line.className = 'line ' + (type || '');
    line.textContent = text;

    document
        .getElementById('status')
        .appendChild(line);

    console.log('[CRM INSTALL]', text);
}


function normalizeText(value) {
    return String(value || '')
        .trim()
        .toLowerCase()
        .replace(/\s+/g, ' ');
}


function baseUrl() {
    var href = window.location.href;
    var q = href.indexOf('?');

    if (q >= 0) {
        href = href.substring(0, q);
    }

    var slash = href.lastIndexOf('/');

    return slash >= 0
        ? href.substring(0, slash + 1)
        : href;
}


function handlerUrl(fileName) {
    return baseUrl() + fileName;
}


function call(method, params) {
    return new Promise(function(resolve, reject) {
        BX24.callMethod(
            method,
            params || {},
            function(result) {
                if (result.error()) {
                    reject(
                        new Error(
                            result.error() + ': ' + result.error_description()
                        )
                    );
                    return;
                }

                resolve(result.data());
            }
        );
    });
}


function normalizeArray(data) {
    if (Array.isArray(data)) {
        return data;
    }

    if (data && Array.isArray(data.items)) {
        return data.items;
    }

    return [];
}


function placementName(item) {
    return String(item.PLACEMENT || item.placement || '');
}


function placementHandler(item) {
    return String(item.HANDLER || item.handler || '');
}


function eventName(item) {
    return String(item.event || item.EVENT || '').toUpperCase();
}


function eventHandler(item) {
    return String(item.handler || item.HANDLER || '');
}


function endsWithFile(handler, fileName) {
    return (
        handler.endsWith('/' + fileName)
        ||
        handler.endsWith(fileName)
    );
}


async function getPlacements() {
    try {
        return normalizeArray(
            await call('placement.get', {})
        );
    } catch (error) {
        log(
            'Не удалось получить placements: ' + error.message,
            'err'
        );
        return [];
    }
}


async function getEvents() {
    try {
        return normalizeArray(
            await call('event.get', {})
        );
    } catch (error) {
        log(
            'event.get недоступен: ' + error.message,
            'warn'
        );
        return [];
    }
}


/*
 * ============================================
 * ВОРОНКА РЛ
 * ============================================
 */

async function ensureRlCategory() {
    var data;

    try {
        data = await call(
            'crm.category.list',
            {
                entityTypeId: 2
            }
        );
    } catch (error) {
        log(
            'Не удалось получить список воронок сделок: ' + error.message,
            'err'
        );
        return false;
    }

    var categories = [];

    if (data && Array.isArray(data.categories)) {
        categories = data.categories;
    } else if (Array.isArray(data)) {
        categories = data;
    }

    var target = categories.find(function(item) {
        return normalizeText(item.name || item.NAME) === normalizeText(RL_CATEGORY_NAME);
    });

    if (!target) {
        log(
            'Воронка «РЛ» не найдена. Установка остановлена.',
            'err'
        );
        return false;
    }

    RL_CATEGORY_ID = Number(target.id || target.ID || 0);

    if (!RL_CATEGORY_ID && String(target.isDefault || target.IS_DEFAULT || '').toUpperCase() === 'Y') {
        RL_CATEGORY_ID = 0;
    }

    log(
        'Воронка «РЛ» найдена. CATEGORY_ID = ' + RL_CATEGORY_ID,
        'ok'
    );

    try {
        await call(
            'app.option.set',
            {
                options: {
                    RL_CATEGORY_ID: String(RL_CATEGORY_ID),
                    RL_CATEGORY_NAME: RL_CATEGORY_NAME
                }
            }
        );

        log(
            'CATEGORY_ID воронки «РЛ» сохранён в настройках приложения.',
            'ok'
        );
    } catch (error) {
        log(
            'Не удалось сохранить CATEGORY_ID в настройках приложения: ' + error.message,
            'warn'
        );
    }

    return true;
}


/*
 * ============================================
 * СТАДИИ РЛ
 * ============================================
 */

async function verifyRlStages() {
    var entityId = RL_CATEGORY_ID > 0
        ? 'DEAL_STAGE_' + RL_CATEGORY_ID
        : 'DEAL_STAGE';

    var stages;

    try {
        stages = await call(
            'crm.status.list',
            {
                order: {
                    SORT: 'ASC'
                },
                filter: {
                    ENTITY_ID: entityId
                }
            }
        );
    } catch (error) {
        log(
            'Не удалось получить стадии воронки «РЛ»: ' + error.message,
            'err'
        );
        return false;
    }

    stages = Array.isArray(stages) ? stages : [];

    var missing = REQUIRED_STAGE_NAMES.filter(function(stageName) {
        return !stages.some(function(stage) {
            return normalizeText(stage.NAME) === normalizeText(stageName);
        });
    });

    if (missing.length) {
        log(
            'Не хватает стадий в «РЛ»: ' + missing.join(', '),
            'err'
        );
        return false;
    }

    log(
        'Основные стадии воронки «РЛ» найдены.',
        'ok'
    );

    return true;
}


/*
 * ============================================
 * ПОЛЯ СДЕЛКИ
 * ============================================
 */

function getFieldLabel(field) {
    var labels = [
        field.EDIT_FORM_LABEL,
        field.LIST_COLUMN_LABEL,
        field.LIST_FILTER_LABEL,
        field.LABEL,
        field.TITLE
    ];

    for (var i = 0; i < labels.length; i++) {
        var label = labels[i];

        if (label && typeof label === 'object') {
            label = label.ru || label.en || '';
        }

        label = String(label || '').trim();

        if (label) {
            return label;
        }
    }

    return '';
}


async function findUserField(method, title) {
    var start = 0;

    for (var page = 0; page < 20; page++) {
        var data;

        try {
            data = await call(
                method,
                {
                    order: {
                        SORT: 'ASC',
                        ID: 'ASC'
                    },
                    filter: {
                        LANG: 'ru'
                    },
                    start: start
                }
            );
        } catch (error) {
            return null;
        }

        var fields = Array.isArray(data) ? data : [];

        var found = fields.find(function(field) {
            return normalizeText(getFieldLabel(field)) === normalizeText(title);
        });

        if (found) {
            if (
                Number(found.ID || 0) > 0
                &&
                (!Array.isArray(found.LIST) || !found.LIST.length)
            ) {
                try {
                    var single = await call(
                        method.replace('.list', '.get'),
                        {
                            id: Number(found.ID)
                        }
                    );

                    if (single) {
                        return single;
                    }
                } catch (error) {
                    // Берём то, что уже получили из list.
                }
            }

            return found;
        }

        break;
    }

    return null;
}


function buildDealFieldFromLead(sourceField, config) {
    var title = config.title;

    var fields = {
        FIELD_NAME: config.fieldName,
        USER_TYPE_ID: sourceField.USER_TYPE_ID || 'string',
        LABEL: title,
        EDIT_FORM_LABEL: title,
        LIST_COLUMN_LABEL: title,
        LIST_FILTER_LABEL: title,
        SORT: Number(sourceField.SORT || 500),
        MULTIPLE: String(sourceField.MULTIPLE || 'N'),
        MANDATORY: 'N',
        SHOW_FILTER: 'Y',
        SHOW_IN_LIST: 'Y',
        EDIT_IN_LIST: 'Y',
        IS_SEARCHABLE: 'Y'
    };

    if (
        sourceField.SETTINGS
        &&
        typeof sourceField.SETTINGS === 'object'
    ) {
        fields.SETTINGS = sourceField.SETTINGS;
    }

    if (
        String(sourceField.USER_TYPE_ID || '') === 'enumeration'
        &&
        Array.isArray(sourceField.LIST)
    ) {
        fields.LIST = sourceField.LIST.map(function(item, index) {
            return {
                VALUE: String(item.VALUE || item.value || ''),
                DEF: String(item.DEF || 'N'),
                SORT: Number(item.SORT || ((index + 1) * 100)),
                XML_ID: String(item.XML_ID || ('CRM_TOOLS_' + index))
            };
        }).filter(function(item) {
            return item.VALUE !== '';
        });
    }

    return fields;
}


async function ensureDealUserFields() {
    for (var i = 0; i < REQUIRED_DEAL_FIELDS.length; i++) {
        var config = REQUIRED_DEAL_FIELDS[i];

        var existing = await findUserField(
            'crm.deal.userfield.list',
            config.title
        );

        if (existing) {
            log(
                'Поле сделки уже есть: «' + config.title + '».',
                'ok'
            );
            continue;
        }

        var source = await findUserField(
            'crm.lead.userfield.list',
            config.title
        );

        if (!source) {
            log(
                'Не найдено исходное поле лида «' + config.title + '».',
                'err'
            );
            return false;
        }

        try {
            await call(
                'crm.deal.userfield.add',
                {
                    fields: buildDealFieldFromLead(
                        source,
                        config
                    )
                }
            );

            log(
                'Поле перенесено в сделки: «' + config.title + '».',
                'ok'
            );
        } catch (error) {
            log(
                'Не удалось создать поле сделки «' + config.title + '»: ' + error.message,
                'err'
            );
            return false;
        }
    }

    return true;
}


/*
 * ============================================
 * CLEANUP PLACEMENTS
 * ============================================
 */

async function cleanupWrongCallCard() {
    var items = await getPlacements();

    for (var i = 0; i < items.length; i++) {
        var placement = placementName(items[i]);
        var handler = placementHandler(items[i]);

        if (
            placement === 'CALL_CARD'
            &&
            endsWithFile(handler, 'call-plan.php')
        ) {
            try {
                await call(
                    'placement.unbind',
                    {
                        PLACEMENT: placement,
                        HANDLER: handler
                    }
                );

                log(
                    'Удалена неправильная привязка CALL_CARD → call-plan.php.',
                    'ok'
                );
            } catch (error) {
                log(
                    'Ошибка удаления старого CALL_CARD: ' + error.message,
                    'warn'
                );
            }
        }
    }
}


async function cleanupLegacyLeadPlacements() {
    var items = await getPlacements();

    for (var i = 0; i < items.length; i++) {
        var placement = placementName(items[i]);
        var handler = placementHandler(items[i]);

        var legacy = LEGACY_LEAD_PLACEMENTS.find(function(item) {
            return (
                item.placement === placement
                &&
                endsWithFile(handler, item.file)
            );
        });

        if (!legacy) {
            continue;
        }

        try {
            await call(
                'placement.unbind',
                {
                    PLACEMENT: placement,
                    HANDLER: handler
                }
            );

            log(
                'Удалена старая лидовая привязка: ' + placement + ' → ' + handler,
                'ok'
            );
        } catch (error) {
            log(
                'Не удалось удалить лидовую привязку: ' + error.message,
                'warn'
            );
        }
    }
}


async function cleanupOldPlacements() {
    var items = await getPlacements();

    for (var i = 0; i < items.length; i++) {
        var placement = placementName(items[i]);
        var handler = placementHandler(items[i]);

        for (var j = 0; j < EXPECTED_PLACEMENTS.length; j++) {
            var expected = EXPECTED_PLACEMENTS[j];
            var currentUrl = handlerUrl(expected.file);

            if (
                placement === expected.placement
                &&
                endsWithFile(handler, expected.file)
                &&
                handler !== currentUrl
            ) {
                try {
                    await call(
                        'placement.unbind',
                        {
                            PLACEMENT: placement,
                            HANDLER: handler
                        }
                    );

                    log(
                        'Удалена старая привязка с другим host: ' + handler,
                        'ok'
                    );
                } catch (error) {
                    log(
                        'Ошибка удаления старой привязки: ' + error.message,
                        'warn'
                    );
                }
            }
        }
    }
}


function placementExists(items, expected) {
    var url = handlerUrl(expected.file);

    return items.some(function(item) {
        return (
            placementName(item) === expected.placement
            &&
            placementHandler(item) === url
        );
    });
}


async function ensurePlacements() {
    var items = await getPlacements();

    for (var i = 0; i < EXPECTED_PLACEMENTS.length; i++) {
        var expected = EXPECTED_PLACEMENTS[i];
        var url = handlerUrl(expected.file);

        if (placementExists(items, expected)) {
            log(
                'Уже зарегистрировано: ' + expected.title,
                'ok'
            );
            continue;
        }

        try {
            await call(
                'placement.bind',
                {
                    PLACEMENT: expected.placement,
                    HANDLER: url,
                    TITLE: expected.title,
                    LANG_ALL: {
                        ru: {
                            TITLE: expected.title
                        }
                    }
                }
            );

            log(
                'Зарегистрировано: ' + expected.title + ' → ' + expected.placement,
                'ok'
            );
        } catch (error) {
            log(
                'Ошибка регистрации «' + expected.title + '»: ' + error.message,
                'err'
            );
        }
    }
}


/*
 * ============================================
 * CLEANUP / REGISTER EVENTS
 * ============================================
 */

async function cleanupLegacyEvents() {
    var items = await getEvents();

    for (var i = 0; i < items.length; i++) {
        var name = eventName(items[i]);
        var handler = eventHandler(items[i]);

        var legacy = LEGACY_EVENTS.find(function(config) {
            if (config.event !== name) {
                return false;
            }

            return config.files.some(function(fileName) {
                return endsWithFile(handler, fileName);
            });
        });

        if (!legacy) {
            continue;
        }

        try {
            await call(
                'event.unbind',
                {
                    event: name,
                    handler: handler
                }
            );

            log(
                'Удалено старое лидовое событие: ' + name + ' → ' + handler,
                'ok'
            );
        } catch (error) {
            log(
                'Не удалось удалить старое событие: ' + error.message,
                'warn'
            );
        }
    }
}


async function cleanupOldEvents() {
    var items = await getEvents();

    for (var i = 0; i < items.length; i++) {
        var name = eventName(items[i]);
        var handler = eventHandler(items[i]);

        for (var j = 0; j < EXPECTED_EVENTS.length; j++) {
            var expected = EXPECTED_EVENTS[j];
            var currentUrl = handlerUrl(expected.file);

            if (
                name === expected.event
                &&
                endsWithFile(handler, expected.file)
                &&
                handler !== currentUrl
            ) {
                try {
                    await call(
                        'event.unbind',
                        {
                            event: name,
                            handler: handler
                        }
                    );

                    log(
                        'Удалено событие со старым host: ' + name + ' → ' + handler,
                        'ok'
                    );
                } catch (error) {
                    log(
                        'Не удалось удалить старый handler события: ' + error.message,
                        'warn'
                    );
                }
            }
        }
    }
}


async function ensureEvents() {
    var items = await getEvents();

    for (var i = 0; i < EXPECTED_EVENTS.length; i++) {
        var expected = EXPECTED_EVENTS[i];
        var url = handlerUrl(expected.file);

        var exists = items.some(function(item) {
            return (
                eventName(item) === expected.event
                &&
                eventHandler(item) === url
            );
        });

        if (exists) {
            log(
                'Событие уже зарегистрировано: ' + expected.event,
                'ok'
            );
            continue;
        }

        try {
            await call(
                'event.bind',
                {
                    event: expected.event,
                    handler: url
                }
            );

            log(
                'Зарегистрировано событие: ' + expected.event,
                'ok'
            );
        } catch (error) {
            log(
                'Не удалось зарегистрировать ' + expected.event + ': ' + error.message,
                'warn'
            );
        }
    }
}


function showFinish() {
    log(
        'Перенос placements и событий на сделки завершён.',
        'ok'
    );

    document
        .getElementById('finishButton')
        .style.display = 'block';

    try {
        BX24.resizeWindow(950, 760);
    } catch (error) {
        console.warn(error);
    }
}


function finishInstall() {
    if (installFinished) {
        return;
    }

    installFinished = true;

    document
        .getElementById('finishButton')
        .disabled = true;

    BX24.installFinish();

    log(
        'installFinish отправлен.',
        'ok'
    );
}


BX24.init(async function() {
    log(
        'BX24.init выполнен.',
        'ok'
    );

    log(
        'Текущая база обработчиков: ' + baseUrl()
    );

    var categoryOk = await ensureRlCategory();

    if (!categoryOk) {
        return;
    }

    var stagesOk = await verifyRlStages();

    if (!stagesOk) {
        log(
            'Сначала исправь стадии воронки «РЛ», затем перезагрузи установку.',
            'err'
        );
        return;
    }

    var fieldsOk = await ensureDealUserFields();

    if (!fieldsOk) {
        log(
            'Не удалось подготовить обязательные поля сделки. Установка остановлена.',
            'err'
        );
        return;
    }

    await cleanupWrongCallCard();
    await cleanupLegacyLeadPlacements();
    await cleanupOldPlacements();
    await ensurePlacements();

    await cleanupLegacyEvents();
    await cleanupOldEvents();
    await ensureEvents();

    showFinish();
});
</script>
</body>
</html>
