<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Установка CRM-инструментов</title>

    <script src="https://api.bitrix24.com/api/v1/"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f8;
            color: #252525;
        }

        .box {
            max-width: 900px;
            margin: 0 auto;
            padding: 22px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.07);
        }

        h2 { margin: 0 0 8px; }

        .subtitle {
            margin-bottom: 18px;
            color: #777;
            font-size: 13px;
        }

        .line {
            margin: 5px 0;
            padding: 7px 9px;
            border-radius: 5px;
            background: #f6f8f9;
            word-break: break-word;
            font-size: 14px;
        }

        .ok {
            background: #e7f7ec;
            color: #24743a;
        }

        .warn {
            background: #fff7e6;
            color: #8a5a00;
        }

        .err {
            background: #fdeaea;
            color: #b93030;
        }

        #finishButton {
            display: none;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2fc6f6;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Установка CRM-инструментов</h2>

    <div class="subtitle">
        Правильные обработчики не перепривязываются.
        Удаляются только старые URL этого приложения.
    </div>

    <div id="status">
        <div class="line">
            install.php загружен. Ожидаем BX24.init...
        </div>
    </div>

    <button
        id="finishButton"
        type="button"
        onclick="finishInstall()"
    >
        Завершить установку
    </button>

</div>

<script>

var installFinished = false;


function log(
    text,
    type
) {

    var line =
        document.createElement(
            'div'
        );

    line.className =
        'line ' +
        (
            type
            ?
            type
            :
            ''
        );

    line.textContent =
        text;

    document
        .getElementById(
            'status'
        )
        .appendChild(
            line
        );

    if (
        window.console
        &&
        console.log
    ) {
        console.log(
            '[CRM INSTALL]',
            text
        );
    }
}


function baseUrl() {

    var href =
        window.location.href;

    var q =
        href.indexOf('?');

    if (q >= 0) {
        href =
            href.substring(
                0,
                q
            );
    }

    var slash =
        href.lastIndexOf('/');

    return (
        slash >= 0
        ?
        href.substring(
            0,
            slash + 1
        )
        :
        href
    );
}


function handlerUrl(
    fileName
) {

    return (
        baseUrl()
        +
        fileName
    );
}


function normalizeArray(
    data
) {

    if (
        Object.prototype.toString.call(
            data
        )
        ===
        '[object Array]'
    ) {
        return data;
    }

    if (
        data
        &&
        Object.prototype.toString.call(
            data.items
        )
        ===
        '[object Array]'
    ) {
        return data.items;
    }

    return [];
}


function placementName(
    item
) {

    return String(
        item.PLACEMENT
        ||
        item.placement
        ||
        ''
    );
}


function placementHandler(
    item
) {

    return String(
        item.HANDLER
        ||
        item.handler
        ||
        ''
    );
}


function fileFromUrl(
    url
) {

    var clean =
        String(
            url || ''
        );

    var q =
        clean.indexOf('?');

    if (q >= 0) {
        clean =
            clean.substring(
                0,
                q
            );
    }

    var slash =
        clean.lastIndexOf('/');

    return (
        slash >= 0
        ?
        clean.substring(
            slash + 1
        )
        :
        clean
    );
}


function call(
    method,
    params,
    callback
) {

    BX24.callMethod(
        method,
        params || {},

        function (
            result
        ) {

            callback(
                result
            );
        }
    );
}


/*
 * =========================================================
 * PLACEMENTS, КОТОРЫЕ ДОЛЖНЫ БЫТЬ У ПРИЛОЖЕНИЯ
 * =========================================================
 */

var EXPECTED_PLACEMENTS = [

    {
        placement:
            'CRM_LEAD_DETAIL_ACTIVITY',

        file:
            'commercial.php',

        title:
            'КП'
    },

    {
        placement:
            'CRM_LEAD_DETAIL_ACTIVITY',

        file:
            'testdrive.php',

        title:
            'Тест-драйв'
    },

    {
        placement:
            'CRM_LEAD_DETAIL_ACTIVITY',

        file:
            'call-plan.php',

        title:
            'Запланировать звонок'
    },

    {
        placement:
            'CALL_CARD',

        file:
            'call-result.php',

        title:
            'Результат звонка'
    },

    {
        placement:
            'CRM_LEAD_ACTIVITY_TIMELINE_MENU',

        file:
            'call-complete.php',

        title:
            'Завершить звонок с результатом'
    }
];


var KNOWN_FILES = [
    'commercial.php',
    'testdrive.php',
    'call-plan.php',
    'call-result.php',
    'call-complete.php'
];


function loadPlacements(
    callback
) {

    call(
        'placement.get',
        {},

        function (
            result
        ) {

            if (
                result.error()
            ) {

                log(
                    'placement.get: ' +
                    result.error() +
                    ' — ' +
                    result.error_description(),
                    'err'
                );

                callback(
                    []
                );

                return;
            }

            callback(
                normalizeArray(
                    result.data()
                )
            );
        }
    );
}


/*
 * =========================================================
 * УДАЛЯЕМ ТОЛЬКО УСТАРЕВШИЕ URL
 * =========================================================
 */

function removeStalePlacements(
    items,
    index,
    callback
) {

    if (
        index >=
        items.length
    ) {

        callback();
        return;
    }


    var item =
        items[
            index
        ]
        ||
        {};


    var placement =
        placementName(
            item
        );


    var handler =
        placementHandler(
            item
        );


    var file =
        fileFromUrl(
            handler
        );


    var isKnownFile =
        KNOWN_FILES.indexOf(
            file
        )
        >=
        0;


    if (
        !isKnownFile
    ) {

        removeStalePlacements(
            items,
            index + 1,
            callback
        );

        return;
    }


    var expectedUrl =
        handlerUrl(
            file
        );


    if (
        handler ===
        expectedUrl
    ) {

        log(
            'Оставляем существующий обработчик: ' +
            placement +
            ' → ' +
            handler,
            'ok'
        );


        removeStalePlacements(
            items,
            index + 1,
            callback
        );

        return;
    }


    call(
        'placement.unbind',

        {
            PLACEMENT:
                placement,

            HANDLER:
                handler
        },

        function (
            result
        ) {

            if (
                result.error()
            ) {

                log(
                    'Не удалось удалить старый URL: ' +
                    handler +
                    ' — ' +
                    result.error_description(),
                    'warn'
                );

            } else {

                log(
                    'Удалён старый URL: ' +
                    handler,
                    'ok'
                );
            }


            removeStalePlacements(
                items,
                index + 1,
                callback
            );
        }
    );
}


/*
 * =========================================================
 * РЕГИСТРИРУЕМ ТОЛЬКО ТО, ЧЕГО НЕТ
 * =========================================================
 */

function ensurePlacementAt(
    items,
    index,
    callback
) {

    if (
        index >=
        EXPECTED_PLACEMENTS.length
    ) {

        callback();
        return;
    }


    var expected =
        EXPECTED_PLACEMENTS[
            index
        ];


    var expectedHandler =
        handlerUrl(
            expected.file
        );


    var exists =
        false;


    var i;

    for (
        i = 0;
        i < items.length;
        i++
    ) {

        if (
            placementName(
                items[i]
            )
            ===
            expected.placement
            &&
            placementHandler(
                items[i]
            )
            ===
            expectedHandler
        ) {

            exists =
                true;

            break;
        }
    }


    if (
        exists
    ) {

        log(
            'Уже зарегистрировано: ' +
            expected.title +
            ' → ' +
            expectedHandler,
            'ok'
        );


        ensurePlacementAt(
            items,
            index + 1,
            callback
        );

        return;
    }


    call(
        'placement.bind',

        {
            PLACEMENT:
                expected.placement,

            HANDLER:
                expectedHandler,

            TITLE:
                expected.title,

            LANG_ALL: {

                ru: {

                    TITLE:
                        expected.title
                }
            }
        },

        function (
            result
        ) {

            if (
                result.error()
            ) {

                log(
                    'ОШИБКА регистрации ' +
                    expected.title +
                    ': ' +
                    result.error() +
                    ' — ' +
                    result.error_description(),
                    'err'
                );

            } else {

                log(
                    'Зарегистрировано: ' +
                    expected.title +
                    ' → ' +
                    expectedHandler,
                    'ok'
                );
            }


            ensurePlacementAt(
                items,
                index + 1,
                callback
            );
        }
    );
}


/*
 * =========================================================
 * СОБЫТИЯ
 * =========================================================
 */

var EXPECTED_EVENTS = [

    {
        event:
            'ONCRMACTIVITYUPDATE',

        file:
            'activity-guard.php'
    },

    {
        event:
            'ONCRMLEADADD',

        file:
            'lead-status-logger.php'
    },

    {
        event:
            'ONCRMLEADUPDATE',

        file:
            'lead-status-logger.php'
    }
];


function loadEvents(
    callback
) {

    call(
        'event.get',
        {},

        function (
            result
        ) {

            if (
                result.error()
            ) {

                log(
                    'event.get недоступен: ' +
                    result.error_description() +
                    '. Основные кнопки всё равно будут работать.',
                    'warn'
                );

                callback(
                    []
                );

                return;
            }


            callback(
                normalizeArray(
                    result.data()
                )
            );
        }
    );
}


function eventName(
    item
) {

    return String(
        item.event
        ||
        item.EVENT
        ||
        ''
    ).toUpperCase();
}


function eventHandler(
    item
) {

    return String(
        item.handler
        ||
        item.HANDLER
        ||
        ''
    );
}


function ensureEventAt(
    items,
    index,
    callback
) {

    if (
        index >=
        EXPECTED_EVENTS.length
    ) {

        callback();
        return;
    }


    var expected =
        EXPECTED_EVENTS[
            index
        ];


    var expectedHandler =
        handlerUrl(
            expected.file
        );


    var exists =
        false;


    var i;

    for (
        i = 0;
        i < items.length;
        i++
    ) {

        if (
            eventName(
                items[i]
            )
            ===
            expected.event
            &&
            eventHandler(
                items[i]
            )
            ===
            expectedHandler
        ) {

            exists =
                true;

            break;
        }
    }


    if (
        exists
    ) {

        log(
            'Событие уже зарегистрировано: ' +
            expected.event,
            'ok'
        );


        ensureEventAt(
            items,
            index + 1,
            callback
        );

        return;
    }


    call(
        'event.bind',

        {
            event:
                expected.event,

            handler:
                expectedHandler
        },

        function (
            result
        ) {

            if (
                result.error()
            ) {

                log(
                    'Не удалось зарегистрировать ' +
                    expected.event +
                    ': ' +
                    result.error_description(),
                    'warn'
                );

            } else {

                log(
                    'Зарегистрировано событие: ' +
                    expected.event,
                    'ok'
                );
            }


            ensureEventAt(
                items,
                index + 1,
                callback
            );
        }
    );
}


/*
 * =========================================================
 * ФИНИШ
 * =========================================================
 */

function showFinish() {

    log(
        'Проверка завершена. CALL_CARD не перепривязывается, если URL уже правильный.',
        'ok'
    );


    document.getElementById(
        'finishButton'
    ).style.display =
        'block';


    try {

        BX24.resizeWindow(
            950,
            760
        );

    } catch (e) {

        console.warn(
            e
        );
    }
}


function finishInstall() {

    if (
        installFinished
    ) {
        return;
    }


    installFinished =
        true;


    document.getElementById(
        'finishButton'
    ).disabled =
        true;


    BX24.installFinish();


    log(
        'installFinish отправлен.',
        'ok'
    );
}


/*
 * =========================================================
 * СТАРТ
 * =========================================================
 */

BX24.init(
    function () {

        log(
            'BX24.init выполнен.',
            'ok'
        );


        log(
            'Текущая база обработчиков: ' +
            baseUrl(),
            ''
        );


        loadPlacements(
            function (
                placements
            ) {

                removeStalePlacements(
                    placements,
                    0,

                    function () {

                        /*
                         * После удаления старых URL
                         * перечитываем список.
                         */

                        loadPlacements(
                            function (
                                freshPlacements
                            ) {

                                ensurePlacementAt(
                                    freshPlacements,
                                    0,

                                    function () {

                                        loadEvents(
                                            function (
                                                events
                                            ) {

                                                ensureEventAt(
                                                    events,
                                                    0,
                                                    showFinish
                                                );
                                            }
                                        );
                                    }
                                );
                            }
                        );
                    }
                );
            }
        );
    }
);

</script>

</body>
</html>
