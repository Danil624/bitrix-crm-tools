<!doctype html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <title>Установка CRM-инструментов</title>

    <script src="https://api.bitrix24.com/api/v1/"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7f8;
            color: #252525;
        }

        .box {
            max-width: 900px;
            margin: 0 auto;
            padding: 22px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .07);
        }

        h2 {
            margin: 0 0 8px;
        }

        .subtitle {
            margin-bottom: 18px;
            color: #777;
            font-size: 13px;
        }

        .line {
            margin: 5px 0;
            padding: 7px 9px;
            border-radius: 5px;
            background: #f6f8f9;
            word-break: break-word;
            font-size: 14px;
        }

        .ok {
            background: #e7f7ec;
            color: #24743a;
        }

        .warn {
            background: #fff7e6;
            color: #8a5a00;
        }

        .err {
            background: #fdeaea;
            color: #b93030;
        }

        #finishButton {
            display: none;
            width: 100%;
            margin-top: 18px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2fc6f6;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>
        Установка CRM-инструментов
    </h2>

    <div class="subtitle">
        Проверяем и регистрируем необходимые точки встраивания.
    </div>

    <div id="status">

        <div class="line">
            install.php загружен. Ожидаем BX24.init...
        </div>

    </div>

    <button
        id="finishButton"
        type="button"
        onclick="finishInstall()"
    >
        Завершить установку
    </button>

</div>


<script>

var installFinished =
    false;


/*
 * ============================================
 * ЛОГ
 * ============================================
 */

function log(
    text,
    type
) {

    var line =
        document.createElement(
            'div'
        );

    line.className =
        'line ' +
        (
            type
            ?
            type
            :
            ''
        );

    line.textContent =
        text;

    document
        .getElementById(
            'status'
        )
        .appendChild(
            line
        );

    console.log(
        '[CRM INSTALL]',
        text
    );
}


/*
 * ============================================
 * БАЗОВЫЙ URL
 * ============================================
 */

function baseUrl() {

    var href =
        window.location.href;

    var q =
        href.indexOf(
            '?'
        );

    if (
        q >= 0
    ) {

        href =
            href.substring(
                0,
                q
            );
    }

    var slash =
        href.lastIndexOf(
            '/'
        );

    return (
        slash >= 0
        ?
        href.substring(
            0,
            slash + 1
        )
        :
        href
    );
}


function handlerUrl(
    fileName
) {

    return (
        baseUrl()
        +
        fileName
    );
}


/*
 * ============================================
 * REST
 * ============================================
 */

function call(
    method,
    params
) {

    return new Promise(
        function (
            resolve,
            reject
        ) {

            BX24.callMethod(

                method,

                params || {},

                function (
                    result
                ) {

                    if (
                        result.error()
                    ) {

                        reject(
                            new Error(
                                result.error()
                                +
                                ': '
                                +
                                result.error_description()
                            )
                        );

                        return;
                    }

                    resolve(
                        result.data()
                    );
                }
            );
        }
    );
}


/*
 * ============================================
 * НОРМАЛИЗАЦИЯ
 * ============================================
 */

function normalizeArray(
    data
) {

    if (
        Array.isArray(
            data
        )
    ) {

        return data;
    }

    if (
        data
        &&
        Array.isArray(
            data.items
        )
    ) {

        return data.items;
    }

    return [];
}


function placementName(
    item
) {

    return String(
        item.PLACEMENT
        ||
        item.placement
        ||
        ''
    );
}


function placementHandler(
    item
) {

    return String(
        item.HANDLER
        ||
        item.handler
        ||
        ''
    );
}


/*
 * ============================================
 * НУЖНЫЕ PLACEMENTS
 * ============================================
 */

var EXPECTED_PLACEMENTS = [

    {
        placement:
            'CRM_LEAD_DETAIL_ACTIVITY',

        file:
            'commercial.php',

        title:
            'КП'
    },

    {
        placement:
            'CRM_LEAD_DETAIL_ACTIVITY',

        file:
            'testdrive.php',

        title:
            'Тест-драйв'
    },

    {
        placement:
            'CRM_LEAD_DETAIL_ACTIVITY',

        file:
            'call-plan.php',

        title:
            'Запланировать звонок'
    },

    {
        placement:
            'CALL_CARD',

        file:
            'call-result.php',

        title:
            'Результат звонка'
    },

    {
        placement:
            'CRM_LEAD_ACTIVITY_TIMELINE_MENU',

        file:
            'call-complete.php',

        title:
            'Завершить звонок с результатом'
    }

];


/*
 * ============================================
 * ПОЛУЧАЕМ PLACEMENTS
 * ============================================
 */

async function getPlacements() {

    try {

        var data =
            await call(
                'placement.get',
                {}
            );

        return normalizeArray(
            data
        );

    } catch (
        error
    ) {

        log(
            'Не удалось получить placements: '
            +
            error.message,
            'err'
        );

        return [];
    }
}


/*
 * ============================================
 * ПРОВЕРКА PLACEMENT
 * ============================================
 */

function placementExists(
    items,
    expected
) {

    var expectedHandler =
        handlerUrl(
            expected.file
        );

    return items.some(
        function (
            item
        ) {

            return (
                placementName(
                    item
                )
                ===
                expected.placement

                &&

                placementHandler(
                    item
                )
                ===
                expectedHandler
            );
        }
    );
}

async function cleanupWrongCallCard() {

    var items =
        await getPlacements();

    for (
        var i = 0;
        i < items.length;
        i++
    ) {

        var item =
            items[i];

        var placement =
            placementName(item);

        var handler =
            placementHandler(item);

        if (
            placement === 'CALL_CARD'
            &&
            handler.indexOf('/call-plan.php') !== -1
        ) {

            try {

                await call(
                    'placement.unbind',
                    {
                        PLACEMENT:
                            'CALL_CARD',

                        HANDLER:
                            handler
                    }
                );

                log(
                    'Удалена неправильная привязка CALL_CARD → call-plan.php',
                    'ok'
                );

            } catch (error) {

                log(
                    'Ошибка удаления старого CALL_CARD: ' +
                    error.message,
                    'err'
                );
            }
        }
    }
}

/*
 * ============================================
 * УДАЛЯЕМ СТАРЫЕ PLACEMENTS С ДРУГИМ HOST
 * ============================================
 */

async function cleanupOldPlacements() {

    var items =
        await getPlacements();

    for (
        var i = 0;
        i < items.length;
        i++
    ) {

        var item =
            items[i];

        var placement =
            placementName(item);

        var handler =
            placementHandler(item);

        for (
            var j = 0;
            j < EXPECTED_PLACEMENTS.length;
            j++
        ) {

            var expected =
                EXPECTED_PLACEMENTS[j];

            var currentUrl =
                handlerUrl(expected.file);

            if (
                placement === expected.placement
                &&
                handler.endsWith(expected.file)
                &&
                handler !== currentUrl
            ) {

                try {

                    await call(
                        'placement.unbind',
                        {
                            PLACEMENT:
                                placement,

                            HANDLER:
                                handler
                        }
                    );

                    log(
                        'Удалена старая привязка: ' +
                        handler,
                        'ok'
                    );

                } catch (error) {

                    log(
                        'Ошибка удаления старой привязки: ' +
                        error.message,
                        'err'
                    );
                }
            }
        }
    }
}

/*
 * ============================================
 * РЕГИСТРИРУЕМ НЕДОСТАЮЩИЕ
 * ============================================
 */

async function ensurePlacements() {

    var items =
        await getPlacements();

    for (
        var i = 0;
        i < EXPECTED_PLACEMENTS.length;
        i++
    ) {

        var expected =
            EXPECTED_PLACEMENTS[i];

        var url =
            handlerUrl(
                expected.file
            );

        if (
            placementExists(
                items,
                expected
            )
        ) {

            log(
                'Уже зарегистрировано: '
                +
                expected.title,
                'ok'
            );

            continue;
        }

        try {

            await call(

                'placement.bind',

                {
                    PLACEMENT:
                        expected.placement,

                    HANDLER:
                        url,

                    TITLE:
                        expected.title,

                    LANG_ALL: {

                        ru: {

                            TITLE:
                                expected.title

                        }

                    }
                }
            );

            log(
                'Зарегистрировано: '
                +
                expected.title
                +
                ' → '
                +
                url,
                'ok'
            );

        } catch (
            error
        ) {

            log(
                'Ошибка регистрации «'
                +
                expected.title
                +
                '»: '
                +
                error.message,
                'err'
            );
        }
    }
}


/*
 * ============================================
 * СОБЫТИЯ
 * ============================================
 */

var EXPECTED_EVENTS = [

    {
        event:
            'ONCRMACTIVITYUPDATE',

        file:
            'activity-guard.php'
    },

    {
        event:
            'ONCRMLEADADD',

        file:
            'lead-status-logger.php'
    },

    {
        event:
            'ONCRMLEADUPDATE',

        file:
            'lead-status-logger.php'
    }

];


function eventName(
    item
) {

    return String(
        item.event
        ||
        item.EVENT
        ||
        ''
    )
    .toUpperCase();
}


function eventHandler(
    item
) {

    return String(
        item.handler
        ||
        item.HANDLER
        ||
        ''
    );
}


async function ensureEvents() {

    var items =
        [];

    try {

        var data =
            await call(
                'event.get',
                {}
            );

        items =
            normalizeArray(
                data
            );

    } catch (
        error
    ) {

        log(
            'event.get недоступен. Основные кнопки всё равно будут работать.',
            'warn'
        );

        return;
    }


    for (
        var i = 0;
        i < EXPECTED_EVENTS.length;
        i++
    ) {

        var expected =
            EXPECTED_EVENTS[i];

        var url =
            handlerUrl(
                expected.file
            );


        var exists =
            items.some(
                function (
                    item
                ) {

                    return (
                        eventName(
                            item
                        )
                        ===
                        expected.event

                        &&

                        eventHandler(
                            item
                        )
                        ===
                        url
                    );
                }
            );


        if (
            exists
        ) {

            log(
                'Событие уже зарегистрировано: '
                +
                expected.event,
                'ok'
            );

            continue;
        }


        try {

            await call(

                'event.bind',

                {
                    event:
                        expected.event,

                    handler:
                        url
                }
            );

            log(
                'Зарегистрировано событие: '
                +
                expected.event,
                'ok'
            );

        } catch (
            error
        ) {

            log(
                'Не удалось зарегистрировать '
                +
                expected.event
                +
                ': '
                +
                error.message,
                'warn'
            );
        }
    }
}


/*
 * ============================================
 * ЗАВЕРШЕНИЕ
 * ============================================
 */

function showFinish() {

    log(
        'Проверка завершена.',
        'ok'
    );

    document
        .getElementById(
            'finishButton'
        )
        .style
        .display =
        'block';


    try {

        BX24.resizeWindow(
            950,
            760
        );

    } catch (
        error
    ) {

        console.warn(
            error
        );
    }
}


function finishInstall() {

    if (
        installFinished
    ) {

        return;
    }

    installFinished =
        true;


    document
        .getElementById(
            'finishButton'
        )
        .disabled =
        true;


    BX24.installFinish();


    log(
        'installFinish отправлен.',
        'ok'
    );
}


/*
 * ============================================
 * СТАРТ
 * ============================================
 */

BX24.init(

    async function () {

        log(
            'BX24.init выполнен.',
            'ok'
        );


        log(
            'Текущая база обработчиков: '
            +
            baseUrl()
        );

        await cleanupWrongCallCard();

        await cleanupOldPlacements();
        
        await ensurePlacements();

        await ensureEvents();

        showFinish();
    }

);

</script>

</body>
</html>
