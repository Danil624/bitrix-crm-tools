<body>

<!--

<script>


/*
 * ========================================
 * КОНТЕКСТ
 * ========================================
 */

let context =
    null;


let rating =
    0;
const TEST_DRIVE_WATCH_DELAY_MS =
    5000;

/*
 * ========================================
 * СТАРТ
 * ========================================
 */

BX24.init(
    function() {

        /*
         * Получаем контекст,
         * который openRestApp
         * передал из кнопки дела.
         */

        const info =
            BX24.placement.info();


        console.log(
            'PLACEMENT INFO:',
            info
        );


        const options =
            info.options
            ||
            {};


        /*
         * В зависимости от версии Битрикса
         * actionParams могут лежать
         * непосредственно в options
         * либо во вложенном объекте.
         */

        const params =
            findActionParams(
                options
            );


        /*
         * Объединяем системный контекст
         * и наши параметры.
         */

        context = {

            ...options,

            ...params
        };


        if (
            context.mode
            ===
            'create_testdrive'
        ) {

            openExistingLeadTool(
                '/testdrive.php',
                context
            );

            return;
        }


        if (
            context.mode
            ===
            'create_commercial'
        ) {

            openExistingLeadTool(
                '/commercial.php',
                context
            );

            return;
        }


        if (
            context.mode
            ===
            'testdrive_result'
        ) {

            showResultPage();

        } else {

            document
                .getElementById(
                    'defaultPage'
                )
                .style
                .display =
                    'block';
        }


        initRating();

    }
);


/*
 * ========================================
 * ИЩЕМ НАШИ ACTION PARAMS
 * ========================================
 */

function isSupportedActionMode(
    mode
) {

    return [
        'testdrive_result',
        'create_testdrive',
        'create_commercial'
    ].includes(
        String(
            mode || ''
        )
    );
}


function findActionParams(
    obj
) {

    if (
        !obj
        ||
        typeof obj !== 'object'
    ) {

        return {};
    }


    if (
        isSupportedActionMode(
            obj.mode
        )
    ) {

        return obj;
    }


    const candidates = [

        obj.actionParams,

        obj.ACTION_PARAMS,

        obj.value,

        obj.params

    ];


    for (
        const candidate
        of candidates
    ) {

        if (
            candidate
            &&
            typeof candidate
            === 'object'
            &&
            isSupportedActionMode(
                candidate.mode
            )
        ) {

            return candidate;
        }
    }


    for (
        const key
        in obj
    ) {

        if (
            obj[key]
            &&
            typeof obj[key]
            === 'object'
        ) {

            const found =
                findActionParams(
                    obj[key]
                );


            if (
                isSupportedActionMode(
                    found.mode
                )
            ) {

                return found;
            }
        }
    }


    return {};
}


function openExistingLeadTool(
    path,
    params
) {

    const leadId =
        Number(
            params.leadId
            ||
            params.entityId
            ||
            params.ID
            ||
            0
        );


    if (!leadId) {

        document
            .getElementById(
                'defaultPage'
            )
            .style.display =
                'block';


        document
            .getElementById(
                'defaultPage'
            )
            .innerHTML =
                '<h1>CRM-инструменты</h1>' +
                '<p>Не удалось определить ID лида.</p>';

        return;
    }


    try {

        sessionStorage.setItem(
            'crm_tool_lead_id',
            String(
                leadId
            )
        );

    } catch (e) {

        console.warn(
            'sessionStorage недоступен:',
            e
        );
    }


    const separator =
        path.includes('?')
        ?
        '&'
        :
        '?';


    window.location.replace(
        path +
        separator +
        'leadId=' +
        encodeURIComponent(
            leadId
        ) +
        '&entityId=' +
        encodeURIComponent(
            leadId
        ) +
        '&ID=' +
        encodeURIComponent(
            leadId
        )
    );
}


/*
 * ========================================
 * ОТКРЫВАЕМ НУЖНУЮ ФОРМУ
 * ========================================
 */

function showResultPage() {

    document
        .getElementById(
            'defaultPage'
        )
        .style.display =
            'none';


    document
        .getElementById(
            'resultPage'
        )
        .style.display =
            'block';


    const car =
        context.car
        ||
        'Автомобиль';


    document
        .getElementById(
            'summary'
        )
        .innerHTML =
            '<b>Автомобиль:</b> ' +
            escapeHtml(car) +
            '<br>' +

            '<b>Дата:</b> ' +
            escapeHtml(
                context.date
                ||
                '—'
            ) +
            '<br>' +

            '<b>Ответственный:</b> ' +
            escapeHtml(
                context.responsibleName
                ||
                '—'
            );


    if (
        context.result
        ===
        'failed'
    ) {

        document
            .getElementById(
                'pageTitle'
            )
            .textContent =
                'Тест-драйв не состоялся';


        document
            .getElementById(
                'passedForm'
            )
            .style.display =
                'none';


        document
            .getElementById(
                'failedForm'
            )
            .style.display =
                'block';

    } else {

        document
            .getElementById(
                'pageTitle'
            )
            .textContent =
                'Результат тест-драйва';


        document
            .getElementById(
                'pageSubtitle'
            )
            .textContent =
                'Заполните короткую анкету по итогам поездки';
    }
}


/*
 * ========================================
 * ОЦЕНКА
 * ========================================
 */

function initRating() {

    document
        .querySelectorAll(
            '#rating button'
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    'click',

                    function() {

                        rating =
                            Number(
                                button.dataset.rating
                            );


                        document
                            .querySelectorAll(
                                '#rating button'
                            )
                            .forEach(
                                function(item) {

                                    item.classList
                                        .toggle(
                                            'active',

                                            Number(
                                                item.dataset.rating
                                            )
                                            <=
                                            rating
                                        );
                                }
                            );
                    }
                );
            }
        );
}


/*
 * ========================================
 * REST
 * ========================================
 */

function callBitrix(
    method,
    params = {}
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            BX24.callMethod(

                method,

                params,

                function(result) {

                    if (
                        result.error()
                    ) {

                        reject(
                            new Error(
                                result.error()
                                +
                                ': '
                                +
                                result.error_description()
                            )
                        );

                        return;
                    }


                    resolve(
                        result.data()
                    );
                }
            );
        }
    );
}

/*
 * ========================================
 * ПЕРЕВОД ЛИДА НА СТАДИЮ ПО НАЗВАНИЮ
 * ========================================
 */

async function moveLeadToStageByName(
    leadId,
    stageName
) {

    const statuses =
        await callBitrix(
            'crm.status.list',
            {
                order: {
                    SORT: 'ASC'
                },

                filter: {
                    ENTITY_ID: 'STATUS'
                }
            }
        );


    const target =
        (statuses || []).find(
            function(status) {

                return String(
                    status.NAME || ''
                ).trim().toLowerCase()
                ===
                String(
                    stageName || ''
                ).trim().toLowerCase();
            }
        );


    if (!target) {

        throw new Error(
            'Не найдена стадия «' +
            stageName +
            '»'
        );
    }


    await callBitrix(
        'crm.lead.update',
        {
            id: leadId,

            fields: {

                STATUS_ID:
                    target.STATUS_ID
            }
        }
    );
}


/*
 * ========================================
 * КОНТРОЛЬ ПОСЛЕ УСПЕШНОГО ТЕСТ-ДРАЙВА
 * ========================================
 */

async function startPassedTestDriveWatch(
    leadId,
    activityId
) {

    const auth =
        BX24.getAuth();


    if (
        !auth
        ||
        !auth.domain
        ||
        !auth.access_token
    ) {

        throw new Error(
            'Не удалось получить авторизацию для контроля лида'
        );
    }


    const response =
        await fetch(
            '/testdrive-watch.php',
            {
                method:
                    'POST',

                headers: {

                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify(
                        {

                            domain:
                                auth.domain,

                            accessToken:
                                auth.access_token,

                            leadId:
                                Number(
                                    leadId
                                ),

                            activityId:
                                Number(
                                    activityId
                                ),

                            delayMs:
                                TEST_DRIVE_WATCH_DELAY_MS
                        }
                    )
            }
        );


    const data =
        await response.json();


    if (
        !response.ok
        ||
        !data.ok
    ) {

        throw new Error(
            data.error_description
            ||
            data.error
            ||
            'Не удалось запустить контроль после тест-драйва'
        );
    }
}
/*
 * ========================================
 * СОХРАНЯЕМ УСПЕШНЫЙ ТЕСТ-ДРАЙВ
 * ========================================
 */

async function savePassedResult() {

    const impression =
        document
            .getElementById(
                'impression'
            )
            .value
            .trim();


    const liked =
        document
            .getElementById(
                'liked'
            )
            .value
            .trim();


    const concerns =
        document
            .getElementById(
                'concerns'
            )
            .value
            .trim();


    const interest =
        document
            .getElementById(
                'interest'
            )
            .value;


    const nextStep =
        document
            .getElementById(
                'nextStep'
            )
            .value;


    if (!rating) {

        showError(
            'Поставьте общую оценку'
        );

        return;
    }


    if (!impression) {

        showError(
            'Заполните общие впечатления'
        );

        return;
    }


    if (!interest) {

        showError(
            'Укажите интерес к покупке'
        );

        return;
    }


    if (!nextStep) {

        showError(
            'Выберите следующий шаг'
        );

        return;
    }


    await updateTestDrive(
        {

            status:
                'Тест-драйв пройден',

            rating:
                rating + ' / 5',

            impression:
                impression,

            liked:
                liked || '—',

            concerns:
                concerns || '—',

            interest:
                interest,

            nextStep:
                nextStep

        }
    );
}


/*
 * ========================================
 * НЕ СОСТОЯЛСЯ
 * ========================================
 */

async function saveFailedResult() {

    const reason =
        document
            .getElementById(
                'failReason'
            )
            .value;


    const comment =
        document
            .getElementById(
                'failComment'
            )
            .value
            .trim();


    if (!reason) {

        showError(
            'Выберите причину'
        );

        return;
    }


    await updateTestDrive(
        {

            status:
                'Не состоялся',

            reason:
                reason,

            comment:
                comment || '—'

        }
    );
}


/*
 * ========================================
 * ОБНОВЛЯЕМ ДЕЛО
 * ========================================
 */

async function updateTestDrive(
    result
) {

    try {

        const activityId =
            Number(
                context.activityId
                ||
                context.activity_id
            );


        const leadId =
            Number(
                context.entityId
                ||
                context.leadId
            );


        if (!activityId) {

            throw new Error(
                'Битрикс24 не передал ID дела'
            );
        }


        setButtonsDisabled(
            true
        );


        /*
         * Основные блоки,
         * которые были в карточке.
         */

        const blocks = {


            date: {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Дата и время',

                    inline:
                        true,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                context.date
                                ||
                                '—'
                        }
                    }
                }
            },


            car: {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Автомобиль',

                    inline:
                        true,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                context.car
                                ||
                                '—',

                            bold:
                                true
                        }
                    }
                }
            },


            responsible: {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Ответственный',

                    inline:
                        true,

                    block: {

                        type:
                            'text',

                    properties: {

                            value:
                                context.responsibleName
                                ||
                                '—'
                        }
                    }
                }
            },


            result: {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Результат',

                    inline:
                        true,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                result.status,

                            bold:
                                true
                        }
                    }
                }
            }

        };


        /*
         * =================================
         * ЕСЛИ ПРОЙДЕН
         * =================================
         */

        if (
            result.status
            ===
            'Тест-драйв пройден'
        ) {


            blocks.rating = {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Оценка',

                    inline:
                        true,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                result.rating,

                            bold:
                                true
                        }
                    }
                }
            };


            blocks.interest = {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Интерес к покупке',

                    inline:
                        true,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                result.interest,

                            bold:
                                true
                        }
                    }
                }
            };


            blocks.impression = {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Общие впечатления',

                    inline:
                        false,

                    block: {

                        type:
                            'text',
                            

                        properties: {

                            value:
                                result.impression,
                                multiline:
                                          true
                        }
                    }
                }
            };


            blocks.liked = {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Что понравилось',

                    inline:
                        false,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                result.liked,
                                  multiline:
                                            true
                        }
                    }
                }
            };


            blocks.concerns = {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Сомнения / минусы',

                    inline:
                        false,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                result.concerns,
                               multiline:
                                        true 
                        }
                    }
                }
            };


            blocks.nextStep = {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Следующий шаг',

                    inline:
                        true,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                result.nextStep,

                            bold:
                                true
                        }
                    }
                }
            };

        }


        /*
         * =================================
         * ЕСЛИ НЕ СОСТОЯЛСЯ
         * =================================
         */

        else {


            blocks.reason = {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Причина',

                    inline:
                        true,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                result.reason,

                            bold:
                                true
                        }
                    }
                }
            };


            blocks.comment = {

                type:
                    'withTitle',

                properties: {

                    title:
                        'Комментарий',

                    inline:
                        false,

                    block: {

                        type:
                            'text',

                        properties: {

                            value:
                                result.comment,
                                multiline:
                                        true
                        }
                    }
                }
            };
        }


        /*
         * =================================
         * ОБНОВЛЯЕМ КАРТОЧКУ
         * =================================
         */

        await callBitrix(

            'crm.activity.configurable.update',

            {

                id:
                    activityId,


                fields: {

                    completed:
                        true
                },


                layout: {

                    icon: {

                        code:
                            'testdrive-car-icon-v1'
                    },


                    header: {

                        title:
                            (
                                result.status
                                ===
                                'Тест-драйв пройден'
                            )
                            ?
                            'Тест-драйв пройден — ' +
                            (
                                context.car
                                ||
                                ''
                            )
                            :
                            'Тест-драйв не состоялся — ' +
                            (
                                context.car
                                ||
                                ''
                            )
                    },


                    body: {

                        logo: {

                            code:
                                'testdrive-car-logo-v1'
                        },

                        blocks:
                            blocks
                    }


                    /*
                     * FOOTER БОЛЬШЕ НЕТ.
                     *
                     * Значит кнопки
                     * "Пройден / Не состоялся"
                     * исчезнут.
                     */
                }
            }
        );


     if (
    result.status
    ===
    'Не состоялся'
) {

    await moveLeadToStageByName(
        leadId,
        'Брошенный'
    );


    showSuccess(
        'Тест-драйв не состоялся. ' +
        'Лид переведён в «Брошенный».'
    );

} else {

    await startPassedTestDriveWatch(
        leadId,
        activityId
    );


    showSuccess(
        'Тест-драйв пройден. ' +
        'Запущен контроль активности лида на 5 секунд.'
    );
}


setTimeout(
    function() {

        BX24.reloadWindow(
            function() {

                BX24.closeApplication();
            }
        );

    },
    900
);

    } catch (error) {

        console.error(error);


        setButtonsDisabled(
            false
        );


        showError(
            error.message
            ||
            String(error)
        );
    }
}


/*
 * ========================================
 * UI
 * ========================================
 */

function setButtonsDisabled(
    disabled
) {

    document
        .querySelectorAll(
            '.submit'
        )
        .forEach(
            function(button) {

                button.disabled =
                    disabled;
            }
        );
}


function showError(
    text
) {

    const message =
        document
            .getElementById(
                'message'
            );


    message.className =
        'message error';


    message.textContent =
        text;
}


function showSuccess(
    text
) {

    const message =
        document
            .getElementById(
                'message'
            );


    message.className =
        'message success';


    message.textContent =
        text;
}


function escapeHtml(
    value
) {

    return String(
        value
        ??
        ''
    )
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );
}

</script>
